<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全屏模式 · 放映</title>
<!--
  ⚠️ DEPRECATED：本模板已废弃，仅保留向后兼容。新 deck 请使用 app-template.html。
     app-template 已把画板与全屏合并为单文件双模式（画板点缩略图 → 全屏，ESC/按钮回画板），
     并加入预加载下一页，翻页无白屏。使用旧 board+deck 双文件结构的既有 deck 无需改动；
     新建 deck 一律用 app-template。
  ========================================================================
  纸墨线稿 · 全屏模式模板（放映视图）
  使用：复制为 deck 目录的 deck.html，填写下方 CONFIG 与 SHOTS。
    - 每页通过 iframe 全视口载入 frames/shot-NN.html，URL 自动追加 ?ppt
      （触发该页 .folio 页脚与页码显示；stageFit() 负责等比适配窗口）
    - 翻页：←/→ ↑/↓ 空格 PageUp/PageDown Home/End，触屏左右滑/上下滑
    - 深链：#3 直接打开第 3 页
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #111;
    overflow: hidden;
    font-family: ui-monospace, Menlo, monospace;
  }
  #view {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    background: #111;
  }
  #pager {
    position: fixed; right: 28px; bottom: 20px;
    z-index: 10;
    font-size: 13px; letter-spacing: .22em;
    color: rgba(255,255,255,.42);
    user-select: none; pointer-events: none;
    transition: opacity .4s;
  }
  body.idle #pager { opacity: 0; }
</style>
</head>
<body>
<iframe id="view" title="slide"></iframe>
<div id="pager"></div>

<script>
/* ===== 配置区：改这里 ===== */
var CONFIG = {
  framesDir: 'frames',
  framePrefix: 'shot-'
};
var SHOTS = ['01', '02'];   // 页码列表，顺序即翻页顺序
/* ===== 配置区结束 ===== */

var view = document.getElementById('view');
var pager = document.getElementById('pager');
var cur = 0;

function clamp(n) { return Math.max(0, Math.min(SHOTS.length - 1, n)); }
function go(n, push) {
  cur = clamp(n);
  var url = CONFIG.framesDir + '/' + CONFIG.framePrefix + SHOTS[cur] + '.html?ppt';
  if (view.getAttribute('src') !== url) view.src = url;
  pager.textContent = (cur + 1) + ' / ' + SHOTS.length;
  if (push !== false) history.replaceState(null, '', '#' + (cur + 1));
  wake();
}
function next() { go(cur + 1); }
function prev() { go(cur - 1); }

/* 键盘：左右、上下、空格、PageUp/Down、Home/End */
addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(SHOTS.length - 1); }
});

/* 触屏：左右滑 / 上下滑 */
var tx = 0, ty = 0;
addEventListener('touchstart', function(e) {
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, { passive: true });
addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - tx;
  var dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 48) return;
  if (Math.abs(dx) >= Math.abs(dy)) { dx < 0 ? next() : prev(); }
  else { dy < 0 ? next() : prev(); }
}, { passive: true });

/* 页码指示：活动时显示，静止 2.5s 后淡出 */
var idleTimer = null;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function() { document.body.classList.add('idle'); }, 2500);
}
addEventListener('mousemove', wake);

/* 深链 #N */
var start = parseInt((location.hash || '').replace('#', ''), 10);
go(isNaN(start) ? 0 : start - 1, false);
</script>
</body>
</html>
