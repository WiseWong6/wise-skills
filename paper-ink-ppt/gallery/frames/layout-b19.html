<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>layout-b19 · 分层架构堆栈</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  canvas { position: absolute; inset: 0; z-index: 2; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">PAPER-INK GALLERY — B19<br>LAYERED ARCHITECTURE STACK</div>
  <div class="folio">B19 / 59 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>
  <canvas id="cv" width="1920" height="1080"></canvas>

  <div class="caption">左列层标、右带能力件，层间一线贯通——平台分几层、每层有什么，一屏读完。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. B19 — LAYERED ARCHITECTURE STACK', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:540, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 骨架：4 层横带，层间 0.6px 贯通 ---------- */
var BT = 240, BH = 132, BB = BT + BH*4;      /* y240–768 */
[BT, BT+BH, BT+BH*2, BT+BH*3, BB].forEach(function(y, i){
  el('line', {x1:150, y1:y, x2:1780, y2:y, stroke:INK,
    'stroke-width': (i===0||i===4) ? .8 : .6, opacity: (i===0||i===4) ? .45 : .3});
});
el('line', {x1:310, y1:BT, x2:310, y2:BB, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 图元族（形态随语义变化） ---------- */
function nodeDot(cx, cy){
  el('circle', {cx:cx, cy:cy, r:5, fill:'none', stroke:INK80, 'stroke-width':1});
  el('circle', {cx:cx, cy:cy, r:1.8, fill:INK});
}
/* L1 接入：插座 / 插头 / 天线 */
function gSocket(cx, cy){
  el('rect', {x:cx-32, y:cy-20, width:64, height:40, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:cx-27, y:cy-15, width:54, height:30, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
  [-20,-7,7,20].forEach(function(dx){
    el('line', {x1:cx+dx, y1:cy+20, x2:cx+dx, y2:cy+30, stroke:INK, 'stroke-width':1, opacity:.6});
  });
  nodeDot(cx, cy-28);
  el('line', {x1:cx, y1:cy-20, x2:cx, y2:cy-28, stroke:INK, 'stroke-width':.8, opacity:.5});
}
function gPlug(cx, cy){
  el('rect', {x:cx-20, y:cy-8, width:40, height:30, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:cx-10, y1:cy-20, x2:cx-10, y2:cy-8, stroke:INK80, 'stroke-width':1.4});
  el('line', {x1:cx+10, y1:cy-20, x2:cx+10, y2:cy-8, stroke:INK80, 'stroke-width':1.4});
  el('path', {d:'M '+(cx+20)+' '+(cy+7)+' C '+(cx+44)+' '+(cy+7)+', '+(cx+44)+' '+(cy-18)+', '+(cx+58)+' '+(cy-18), fill:'none', stroke:INK, 'stroke-width':1, opacity:.6});
}
function gAntenna(cx, cy){
  el('line', {x1:cx, y1:cy+26, x2:cx, y2:cy-14, stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:cx-18, y1:cy+26, x2:cx+18, y2:cy+26, stroke:INK80, 'stroke-width':1.2});
  [10, 19, 28].forEach(function(r){
    el('path', {d:'M '+(cx-r)+' '+(cy-14-r*.4)+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+(cy-14-r*.4), fill:'none', stroke:INK, 'stroke-width':.9, opacity:.55});
  });
  el('circle', {cx:cx, cy:cy-16, r:2.2, fill:INK});
}
/* L2 调度：齿轮 / 表盘 / 路径 */
function gGear(cx, cy){
  el('circle', {cx:cx, cy:cy, r:22, fill:'none', stroke:INK80, 'stroke-width':1.3});
  el('circle', {cx:cx, cy:cy, r:7, fill:'none', stroke:INK80, 'stroke-width':1.1});
  for (var a = 0; a < 8; a++) {
    var t = a*Math.PI/4;
    el('line', {x1:cx+Math.cos(t)*22, y1:cy+Math.sin(t)*22, x2:cx+Math.cos(t)*29, y2:cy+Math.sin(t)*29, stroke:INK80, 'stroke-width':1.6});
  }
}
function gDial(cx, cy){
  el('path', {d:'M '+(cx-26)+' '+(cy+14)+' A 30 30 0 0 1 '+(cx+26)+' '+(cy+14), fill:'none', stroke:INK80, 'stroke-width':1.2});
  for (var a = 0; a <= 4; a++) {
    var t = Math.PI - a*Math.PI/4;
    el('line', {x1:cx+Math.cos(t)*25, y1:(cy+14)+Math.sin(t)*-25, x2:cx+Math.cos(t)*30, y2:(cy+14)+Math.sin(t)*-30, stroke:INK, 'stroke-width':.9, opacity:.6});
  }
  el('line', {x1:cx, y1:cy+14, x2:cx+13, y2:cy-8, stroke:INK, 'stroke-width':1.4});
  el('circle', {cx:cx, cy:cy+14, r:2.4, fill:INK});
  el('line', {x1:cx-30, y1:cy+14, x2:cx+30, y2:cy+14, stroke:INK, 'stroke-width':.6, opacity:.35});
}
function gRoute(cx, cy){
  el('path', {d:'M '+(cx-30)+' '+(cy+18)+' C '+(cx-8)+' '+(cy-26)+', '+(cx+6)+' '+(cy+30)+', '+(cx+30)+' '+(cy-16), fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('path', {d:'M '+(cx-30)+' '+(cy+26)+' C '+(cx-4)+' '+(cy-12)+', '+(cx+10)+' '+(cy+36)+', '+(cx+30)+' '+(cy-8), fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35, 'stroke-dasharray':'3 4'});
  nodeDot(cx-30, cy+18);
  nodeDot(cx+30, cy-16);
}
/* L3 数据：高圆柱 / 扁圆柱 / 盘组 */
function gCylinder(cx, cy, w, h){
  el('ellipse', {cx:cx, cy:cy-h/2, rx:w/2, ry:8, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:cx-w/2, y1:cy-h/2, x2:cx-w/2, y2:cy+h/2, stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:cx+w/2, y1:cy-h/2, x2:cx+w/2, y2:cy+h/2, stroke:INK80, 'stroke-width':1.2});
  el('path', {d:'M '+(cx-w/2)+' '+(cy+h/2)+' A '+(w/2)+' 8 0 0 0 '+(cx+w/2)+' '+(cy+h/2), fill:'none', stroke:INK80, 'stroke-width':1.2});
}
function gDisks(cx, cy){
  [10, 0, -10].forEach(function(dy, i){
    el('ellipse', {cx:cx, cy:cy+dy, rx:30-i*4, ry:7, fill:'none', stroke:INK80, 'stroke-width':1.1, opacity: 1-i*.2});
  });
  el('line', {x1:cx, y1:cy-22, x2:cx, y2:cy-30, stroke:INK, 'stroke-width':.8, opacity:.5});
  nodeDot(cx, cy-34);
}
/* L4 基础：芯片 / 示波镜 / 集群 */
function gChip(cx, cy){
  el('rect', {x:cx-22, y:cy-22, width:44, height:44, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:cx-12, y:cy-12, width:24, height:24, fill:'none', stroke:INK, 'stroke-width':.7, opacity:.4});
  [-14, 0, 14].forEach(function(d){
    el('line', {x1:cx+d, y1:cy-30, x2:cx+d, y2:cy-22, stroke:INK, 'stroke-width':1, opacity:.6});
    el('line', {x1:cx+d, y1:cy+22, x2:cx+d, y2:cy+30, stroke:INK, 'stroke-width':1, opacity:.6});
    el('line', {x1:cx-30, y1:cy+d, x2:cx-22, y2:cy+d, stroke:INK, 'stroke-width':1, opacity:.6});
    el('line', {x1:cx+22, y1:cy+d, x2:cx+30, y2:cy+d, stroke:INK, 'stroke-width':1, opacity:.6});
  });
}
function gScope(cx, cy){
  el('circle', {cx:cx, cy:cy, r:26, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:cx, cy:cy, r:17, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
  el('line', {x1:cx-26, y1:cy, x2:cx+26, y2:cy, stroke:INK, 'stroke-width':.5, opacity:.3});
  el('line', {x1:cx, y1:cy-26, x2:cx, y2:cy+26, stroke:INK, 'stroke-width':.5, opacity:.3});
  el('path', {d:'M '+(cx-18)+' '+(cy+6)+' L '+(cx-8)+' '+(cy+6)+' L '+(cx-4)+' '+(cy-10)+' L '+(cx+2)+' '+(cy+12)+' L '+(cx+7)+' '+(cy-4)+' L '+(cx+18)+' '+(cy-4), fill:'none', stroke:INK, 'stroke-width':1.3});
}
function gCluster(cx, cy){
  var s = 20, gap = 7;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(p, i){
    var x = cx + p[0]*(s/2+gap/2) - s/2, y = cy + p[1]*(s/2+gap/2) - s/2;
    el('rect', {x:x, y:y, width:s, height:s, fill:'none', stroke:INK80, 'stroke-width':1.1, opacity: i===3 ? .45 : 1, 'stroke-dasharray': i===3 ? '3 3' : 'none'});
  });
  el('line', {x1:cx-s-gap/2+10, y1:cy, x2:cx+s+gap/2-10, y2:cy, stroke:INK, 'stroke-width':.7, opacity:.4});
  el('line', {x1:cx, y1:cy-s-gap/2+10, x2:cx, y2:cy+s+gap/2-10, stroke:INK, 'stroke-width':.7, opacity:.4});
}

/* ---------- 层定义 ---------- */
var layers = [
  {no:'L1', cn:'接入层', en:'ACCESS', items:[
    {g:gSocket,  en:'OMS GW',  cn:'订单网关'},
    {g:gPlug,    en:'EDI LINK', cn:'客户直连'},
    {g:gAntenna, en:'OPEN API', cn:'开放接口'}
  ]},
  {no:'L2', cn:'调度层', en:'ORCHESTRATION', items:[
    {g:gGear,  en:'ENGINE',   cn:'调度引擎'},
    {g:gDial,  en:'SIM LAB',  cn:'仿真沙盘'},
    {g:gRoute, en:'PATH NET', cn:'路径网络'}
  ]},
  {no:'L3', cn:'数据层', en:'DATA', items:[
    {g:function(cx,cy){ gCylinder(cx,cy,46,44); }, en:'MAP DB',    cn:'高精地图'},
    {g:function(cx,cy){ gCylinder(cx,cy,64,26); }, en:'STATE BUS', cn:'状态总线'},
    {g:gDisks, en:'LOG ARC', cn:'日志归档'}
  ]},
  {no:'L4', cn:'基础层', en:'INFRA', items:[
    {g:gChip,    en:'EDGE NODE', cn:'边缘节点'},
    {g:gScope,   en:'WATCH',     cn:'监控告警'},
    {g:gCluster, en:'K8S POOL',  cn:'容器集群'}
  ]}
];

var IXS = [620, 1065, 1510];                 /* 带内能力件均布 */
layers.forEach(function(L, r){
  var midY = BT + r*BH + BH/2;
  /* 左列层标（与横带严格左对齐） */
  txt(160, midY-16, L.no, {'font-family':MONO, 'font-size':20, 'letter-spacing':2, fill:INK});
  txt(160, midY+12, L.cn, {'font-family':SANS, 'font-weight':400, 'font-size':22, fill:INK});
  txt(160, midY+34, L.en, {'font-family':MONO, 'font-size':11, 'letter-spacing':2, fill:INK45});
  el('line', {x1:160, y1:midY+48, x2:230, y2:midY+48, stroke:INK, 'stroke-width':.6, opacity:.3});
  /* 带内能力件 */
  L.items.forEach(function(it, i){
    var cx = IXS[i];
    it.g(cx-70, midY);
    txt(cx-16, midY-4, it.en, {'font-family':MONO, 'font-size':14, 'letter-spacing':1.5, fill:'rgba(25,25,23,.55)'});
    txt(cx-16, midY+22, it.cn, {'font-family':SANS, 'font-weight':400, 'font-size':18, fill:INK});
  });
});

stageFit();
</script>
</body>
</html>
