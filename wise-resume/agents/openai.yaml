interface:
  display_name: "简历排版与诊断优化"
  short_description: "原文排版，或先诊断与示范、再优化；HTML 确认后出 PDF"
  default_prompt: "使用 $wise-resume：仅排版保留原文；优化按基础信息、简介、经历、辅助内容诊断，确认方向后改全文。已授权现有资料内优化时先交完整稿，不等待补齐信息或重复确认；缺岗位描述也可先做通用优化。按事实含义归纳、重组、取舍，只有动作材料也提炼实践重点，不强凑结果。任职背景、可选总述、贡献和荣誉各有归属，总述与荣誉不编号；并列贡献按同一标准划分，不包含或重叠，数字保持正确的产品、时间和角色归属。以前后稿是否更易看清定位、经验和本人贡献检验改写，再核对事实及保留必要性。先交稿，再提少量有价值的问题，用户不补充时不重复追问。基础信息只允许姓名、联系方式、已确认的当前常驻城市、本人头像；经历标题只含日期、公司或产品名称、职位，不附加地区，完整保持一行。优化时默认不设技能栏，仅保留具体、相关、有依据且补充独立信息的专业技能；不列通用工具或重复经历的能力标签，没有合适内容就删除整栏，仅排版保留原文。简介建议三句、允许一至三句，分别讲定位、支撑、辨识度；第三句优先具体开源贡献、独立开发作品或有分量的奖项等真实且与岗位相关的事情，其次是用户自述的价值观、性格等，无合适材料可省略。保留已选外观，新建默认多页竖版、纯白背景、正黑配色、霞鹜文楷。复用模板，既有行为不覆盖设计规范。优化或已授权补充内容时，页面有大段空白应优先保留或补回原材料中有价值的贡献与依据，尤其是侧版右栏；避免过度精简，不靠拉大间距、行高或字号填满，不凑字或编造。仅排版不自行补写。先交 HTML，源码、内容和实际显示验收分别报告，确认后再出 PDF。"

policy:
  allow_implicit_invocation: false
