interface:
  display_name: "Skill Optimizer"
  short_description: "审计运行门槛、Bundle 来源、发行体量与依赖替代边界"
  default_prompt: "使用 $skill-optimizer 检查这个 Skill，先区分开发者与使用者，核对源码、发行外壳、安装副本和运行环境；依赖允许存在，但按系统原生能力、已有依赖、新增依赖的顺序寻找更轻方案，并验证用途条件；检查版本门槛、Bundle 来源、发行分类占比、静态联网行为，以及 macOS/Windows 和多 Agent 适配，保留优化前已有的 README、License、声明、示例入口和有效链接，不为原本没有的自用 Skill 强制新增，再以公共根因、影响面和防复发验证说明方案，等我确认后再修改。"
