interface:
  display_name: "Skill Optimizer"
  short_description: "审计 Skill 生命周期、测试体系、死重候选与结构职责"
  default_prompt: "使用 $skill-optimizer 检查这个 Skill，先区分开发者与使用者，并沿权威源码、发行载荷、Agent 安装入口/软链、实际加载和真实任务建立生命周期证据图；分别记录 Git、manifest、frontmatter 与安装副本版本坐标，区分功能、文档、发行、完整性、来源和法律入边，只输出待隔离验证的死重候选，不自动删除或修复软链；测试语义由目标源仓合同声明，只校验规则主人、执行边界和文件覆盖，无合同时不自动判断重复；保留已有 README、License/NOTICE、用户入口和必要依赖，检查 macOS/Windows 与多 Agent 适配、公共根因、影响面和防复发门禁，先用通俗中文给方案，等我确认后再修改。"
