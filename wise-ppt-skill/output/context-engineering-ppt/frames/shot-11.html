<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>shot-11 · Hermes · 双层压缩 + 交接文档</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 100px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">CONTEXT ENGINEERING — CH03<br>HERMES · DUAL-LAYER + HANDOFF</div>
  <div class="folio">11 / 15 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch11" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#191917" stroke-width=".7" opacity=".35"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">压缩不是泛泛总结，是给下一轮模型准备一份可继续执行的交接清单。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. 11 — HERMES · DUAL-LAYER COMPRESSION', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:620, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ============ 左区：双层阈值示意（容器 + 两条阈值线） ============ */
var FX = 150, FY = 260, FW = 720, FH = 560;
el('rect', {x:FX, y:FY, width:FW, height:FH, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3});
el('rect', {x:FX+6, y:FY+6, width:FW-12, height:FH-12, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
/* 编号牌 */
el('rect', {x:200, y:238, width:300, height:44, fill:'#DFE0D9', stroke:INK, 'stroke-width':1.2});
txt(350, 267, 'CONTEXT WINDOW FILLING', {'font-family':MONO, 'font-size':14, 'letter-spacing':2, 'text-anchor':'middle', fill:INK});

/* 上下文填充柱（从底向上 hatch） */
var barX = FX + 60, barW = FW - 120, barBY = FY + FH - 60, barTop = FY + 80;
el('line', {x1:barX, y1:barBY, x2:barX+barW, y2:barBY, stroke:INK80, 'stroke-width':1.2, opacity:.6});
/* 填充层（hatch 到 Agent 阈值附近） */
var fillTop = FY + 220;
el('rect', {x:barX, y:fillTop, width:barW, height:barBY-fillTop, fill:'url(#hatch11)', stroke:'none', opacity:.6});

/* 左侧 Y 轴刻度 */
for (var pct = 0; pct <= 100; pct += 25) {
  var py = barBY - (barBY - barTop) * pct / 100;
  el('line', {x1:barX-6, y1:py, x2:barX, y2:py, stroke:INK, 'stroke-width':.7, opacity:.4});
  txt(barX-14, py+4, pct + '%', {'font-family':MONO, 'font-size':11, 'text-anchor':'end', fill:INK45});
}

/* Agent 层阈值线 50% */
var y50 = barBY - (barBY - barTop) * 0.5;
el('line', {x1:barX, y1:y50, x2:barX+barW, y2:y50, stroke:INK, 'stroke-width':1.6, opacity:.8});
el('line', {x1:barX+barW, y1:y50, x2:barX+barW+8, y2:y50, stroke:INK, 'stroke-width':1.6, opacity:.8});
txt(barX+barW+16, y50-6, 'AGENT LAYER', {'font-family':MONO, 'font-size':12, 'letter-spacing':1.5, fill:INK});
txt(barX+barW+16, y50+14, '50% · 早压缩', {'font-family':SANS, 'font-weight':300, 'font-size':14, fill:INK70});

/* Gateway 层阈值线 85% */
var y85 = barBY - (barBY - barTop) * 0.85;
el('line', {x1:barX, y1:y85, x2:barX+barW, y2:y85, stroke:INK, 'stroke-width':1.6, opacity:.8, 'stroke-dasharray':'6 4'});
txt(barX+barW+16, y85-6, 'GATEWAY', {'font-family':MONO, 'font-size':12, 'letter-spacing':1.5, fill:INK});
txt(barX+barW+16, y85+14, '85% · 兜底', {'font-family':SANS, 'font-weight':300, 'font-size':14, fill:INK70});

/* 压缩动作箭头（从 50% 线向下压回） */
el('line', {x1:barX+barW*0.35, y1:y50-40, x2:barX+barW*0.35, y2:y50+8, stroke:INK80, 'stroke-width':1.4});
el('path', {d:'M '+(barX+barW*0.35-6)+' '+(y50)+' L '+(barX+barW*0.35)+' '+(y50+8)+' L '+(barX+barW*0.35+6)+' '+(y50), fill:'none', stroke:INK80, 'stroke-width':1.4, 'stroke-linecap':'round', 'stroke-linejoin':'round'});

/* 增量更新标注 */
el('line', {x1:barX+barW*0.7, y1:y50-60, x2:barX+barW*0.7, y2:y50+4, stroke:INK, 'stroke-width':.6, opacity:.35, 'stroke-dasharray':'3 5'});
txt(barX+barW*0.7, y50-72, '增量更新', {'font-family':SANS, 'font-weight':300, 'font-size':15, 'text-anchor':'middle', fill:INK70});
txt(barX+barW*0.7, y50-54, 'APPEND, NOT REBUILD', {'font-family':MONO, 'font-size':11, 'letter-spacing':1.5, 'text-anchor':'middle', fill:INK45});

/* ============ 右区：交接文档结构化字段 ============ */
var DX = 940, DY = 260, DW = 820, DH = 560;
el('rect', {x:DX, y:DY, width:DW, height:DH, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3});
el('rect', {x:DX+6, y:DY+6, width:DW-12, height:DH-12, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
/* 编号牌 */
el('rect', {x:990, y:238, width:300, height:44, fill:'#DFE0D9', stroke:INK, 'stroke-width':1.2});
txt(1140, 267, 'HANDOFF DOCUMENT', {'font-family':MONO, 'font-size':14, 'letter-spacing':2, 'text-anchor':'middle', fill:INK});

/* 交接字段（结构化） */
var fields = [
  {code:'GOAL',      cn:'当前目标',     val:'完成 Agent 上下文优化'},
  {code:'PROGRESS',  cn:'完成进度',     val:'3/5 步骤已完成，第 4 步进行中'},
  {code:'DECISIONS', cn:'核心决策',     val:'采用 50% 早压缩，保留工作集'},
  {code:'FILES',     cn:'读写文件',     val:'context.py · compress.py · handoff.md'},
  {code:'NEXT',      cn:'下一步',       val:'验证增量更新不丢失关键信息'}
];
var FY2 = 320, FRH = 92;
fields.forEach(function(f, i){
  var ry = FY2 + i * FRH;
  /* 字段码 */
  txt(DX + 40, ry + 28, f.code, {'font-family':MONO, 'font-size':14, 'letter-spacing':2, fill:INK45});
  /* 圆点 */
  el('circle', {cx:DX+28, cy:ry+22, r:2.6, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.8});
  /* 中文标签 */
  txt(DX + 140, ry + 28, f.cn, {'font-family':SANS, 'font-weight':300, 'font-size':20, fill:INK});
  /* 值（内容） */
  txt(DX + 40, ry + 60, f.val, {'font-family':SANS, 'font-weight':300, 'font-size':18, fill:INK70});
  /* 分隔线 */
  if (i < fields.length - 1)
    el('line', {x1:DX+30, y1:ry+FRH-12, x2:DX+DW-30, y2:ry+FRH-12, stroke:INK, 'stroke-width':.5, opacity:.2});
});

/* 右下角交接箭头标注 */
txt(DX+DW-30, DY+DH-24, '→ NEXT WINDOW READY', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'end', fill:INK45});

stageFit();
</script>
</body>
</html>
