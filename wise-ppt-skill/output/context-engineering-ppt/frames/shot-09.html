<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>shot-09 · OpenClaw · 极度开放的上下文框架</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 100px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">CONTEXT ENGINEERING — CH03<br>OPENCLAW · OPEN FRAMEWORK</div>
  <div class="folio">09 / 15 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">框架的开放性不等于开箱即用的可靠性——不调优，Agent 不如预期。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. 09 — OPENCLAW · OPEN CONTEXT FRAMEWORK', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:640, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 双面板 ---------- */
var PY = 270, PH = 520, PW = 520;
var LX = 300, RX = 1100;
[LX, RX].forEach(function(px){
  el('rect', {x:px, y:PY, width:PW, height:PH, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3});
  el('rect', {x:px+5, y:PY+5, width:PW-10, height:PH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
});
/* 左面板页签 */
el('rect', {x:560-150, y:248, width:300, height:44, fill:'#DFE0D9', stroke:INK, 'stroke-width':1.2});
txt(486, 277, '内置引擎', {'font-family':SANS, 'font-weight':300, 'font-size':15, fill:INK});
txt(541, 277, 'LEGACY ENGINE', {'font-family':MONO, 'font-size':13, 'letter-spacing':2, fill:'rgba(25,25,23,.6)'});
/* 右面板页签 */
el('rect', {x:1360-150, y:248, width:300, height:44, fill:'#DFE0D9', stroke:INK, 'stroke-width':1.2});
txt(1283, 277, '开放插件', {'font-family':SANS, 'font-weight':300, 'font-size':15, fill:INK});
txt(1353, 277, 'CONTEXT-ENGINE', {'font-family':MONO, 'font-size':13, 'letter-spacing':2, fill:'rgba(25,25,23,.6)'});

/* ---------- 左面板：内置策略（封闭齿轮组） ---------- */
txt(560, 410, '调优精细', {'font-family':SANS, 'font-weight':300, 'font-size':34, 'letter-spacing':4, 'text-anchor':'middle', fill:INK});
txt(560, 452, 'TUNED INTERNAL STRATEGY', {'font-family':MONO, 'font-size':13, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* 小图形：封闭齿轮组（3 个互锁齿轮） */
(function(){
  var gears = [{cx:500, cy:600, r:32}, {cx:580, cy:620, r:26}, {cx:540, cy:670, r:20}];
  gears.forEach(function(g){
    el('circle', {cx:g.cx, cy:g.cy, r:g.r, fill:'none', stroke:INK80, 'stroke-width':1.3});
    el('circle', {cx:g.cx, cy:g.cy, r:g.r*.4, fill:'none', stroke:INK80, 'stroke-width':1});
    for (var a = 0; a < 8; a++) {
      var t = a * Math.PI / 4;
      el('line', {x1:g.cx+Math.cos(t)*g.r, y1:g.cy+Math.sin(t)*g.r, x2:g.cx+Math.cos(t)*(g.r+6), y2:g.cy+Math.sin(t)*(g.r+6), stroke:INK80, 'stroke-width':1.4});
    }
    el('circle', {cx:g.cx, cy:g.cy, r:2, fill:INK});
  });
  /* 外围封闭虚线框 */
  el('rect', {x:460, y:566, width:152, height:118, fill:'none', stroke:INK, 'stroke-width':.7, opacity:.3, 'stroke-dasharray':'4 5'});
  txt(560, 712, 'SEALED · NO SWAP', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
})();

txt(560, 756, '开箱即用，但不可替换', {'font-family':SANS, 'font-weight':300, 'font-size':19, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});

/* ---------- 右面板：开放平台（可插拔插槽） ---------- */
txt(1360, 410, '自由插拔', {'font-family':SANS, 'font-weight':300, 'font-size':34, 'letter-spacing':4, 'text-anchor':'middle', fill:INK});
txt(1360, 452, 'PLUGGABLE PLATFORM', {'font-family':MONO, 'font-size':13, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* 小图形：开放插槽 + 可替换引擎卡 */
(function(){
  var bx = 1280, by = 570, bw = 160, bh = 110;
  /* 主板底座（虚线框=开放边界） */
  el('rect', {x:bx, y:by, width:bw, height:bh, fill:'none', stroke:INK80, 'stroke-width':1.2, opacity:.5, 'stroke-dasharray':'5 4'});
  /* 插槽轨道 */
  el('line', {x1:bx+14, y1:by+20, x2:bx+bw-14, y2:by+20, stroke:INK, 'stroke-width':1, opacity:.4});
  el('line', {x1:bx+14, y1:by+58, x2:bx+bw-14, y2:by+58, stroke:INK, 'stroke-width':1, opacity:.4});
  /* 引擎卡 A（已插入） */
  el('rect', {x:bx+20, y:by+24, width:56, height:28, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.2});
  txt(bx+48, by+42, 'A', {'font-family':MONO, 'font-size':13, 'text-anchor':'middle', fill:INK});
  /* 引擎卡 B（已插入） */
  el('rect', {x:bx+84, y:by+24, width:56, height:28, fill:'none', stroke:INK, 'stroke-width':1, opacity:.5, 'stroke-dasharray':'3 3'});
  txt(bx+112, by+42, 'B', {'font-family':MONO, 'font-size':13, 'text-anchor':'middle', fill:'rgba(25,25,23,.5)'});
  /* 第三槽（空，等待插入） */
  el('rect', {x:bx+20, y:by+62, width:120, height:28, fill:'none', stroke:INK, 'stroke-width':1, opacity:.4, 'stroke-dasharray':'4 4'});
  txt(bx+80, by+80, 'EMPTY SLOT', {'font-family':MONO, 'font-size':12, 'letter-spacing':1.5, 'text-anchor':'middle', fill:'rgba(25,25,23,.4)'});
  /* 正在插入的卡（从上方落下） */
  el('rect', {x:bx+48, y:by-28, width:56, height:28, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.2, 'stroke-dasharray':'3 3'});
  el('line', {x1:bx+76, y1:by, x2:bx+76, y2:by+18, stroke:INK80, 'stroke-width':1.1, opacity:.5, 'stroke-dasharray':'3 4'});
  el('path', {d:'M '+(bx+70)+' '+(by+12)+' L '+(bx+76)+' '+(by+18)+' L '+(bx+82)+' '+(by+12), fill:'none', stroke:INK80, 'stroke-width':1.1, opacity:.5, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  txt(1360, 712, 'YOUR ENGINE · YOUR RULES', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
})();

txt(1360, 756, '完全可定制，但需要主动调优', {'font-family':SANS, 'font-weight':300, 'font-size':19, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});

/* ---------- 中央 VS 徽章 ---------- */
el('circle', {cx:960, cy:460, r:34, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.2});
el('circle', {cx:960, cy:460, r:40, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
txt(960, 468, 'VS', {'font-family':MONO, 'font-size':22, 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
el('line', {x1:LX+PW+14, y1:460, x2:960-46, y2:460, stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 5'});
el('line', {x1:960+46, y1:460, x2:RX-14, y2:460, stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 5'});

stageFit();
</script>
</body>
</html>
