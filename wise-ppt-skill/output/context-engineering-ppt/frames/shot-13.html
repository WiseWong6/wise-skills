<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>shot-13 · 金句 · AI 时代不仅止于技术创新</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  canvas.px { position: absolute; inset: 0; z-index: 1; }
  svg.marks { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .motif-label {
    position: absolute; left: 0; right: 0; top: 626px;
    text-align: center;
    font-family: var(--mono); font-size: 15px;
    letter-spacing: .5em; text-indent: .5em;
    color: var(--ink-70);
    z-index: 3;
  }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 36px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">CONTEXT ENGINEERING — CH04<br>QUOTE · BEYOND INNOVATION</div>
  <div class="folio">13 / 15 — BY @歪斯Wise</div>

  <canvas class="px" id="px" width="1920" height="1080"></canvas>

  <svg class="marks" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="motif-label">INNOVATION × PERCEPTION</div>

  <div class="caption">把技术创新点，以一个用户可感知的方式展示出来。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
(function(){
  var ctx = document.getElementById('px').getContext('2d');

  /* 四周稀疏静点氛围 */
  PART.dust(ctx, 120, 140, 1680, 150, 55, .16);
  PART.dust(ctx, 120, 320, 560, 420, 50, .15);
  PART.dust(ctx, 1240, 320, 560, 420, 50, .15);
  PART.dust(ctx, 120, 730, 1680, 90, 38, .14);

  /* 小主角：从散乱点（左）汇聚成有序箭头（右）——创新→可感知 */
  var CX = 960, CY = 478;
  /* 左侧散乱点簇 */
  for (var i = 0; i < 20; i++) {
    var px = CX - 80 + (Math.random() - .5) * 40;
    var py = CY + (Math.random() - .5) * 60;
    PART.dot(ctx, px, py, 1.6 + Math.random() * .6, .35 + Math.random() * .2);
  }
  /* 中间汇聚线流 */
  for (var j = 0; j < 12; j++) {
    var t = j / 12;
    var px2 = CX - 30 + t * 60;
    var py2 = CY + (Math.random() - .5) * (30 - t * 25);
    PART.dot(ctx, px2, py2, 1.8, .5 + t * .3);
  }
  /* 右侧有序箭头头部（3 个排列的点） */
  PART.dot(ctx, CX + 48, CY, 2.6, .9);
  PART.dot(ctx, CX + 62, CY - 8, 2, .7);
  PART.dot(ctx, CX + 62, CY + 8, 2, .7);
})();

/* SVG 细线制图标记：散乱区→有序区的虚线分界 + 箭头 */
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var INK8 = 'rgba(25,25,23,.8)';
  var G = document.getElementById('draw');
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    G.appendChild(e); return e;
  }
  var CX = 960, CY = 478;
  /* 左侧散乱区虚线圈 */
  el('circle', {cx:CX-60, cy:CY, r:42, fill:'none', stroke:INK8, 'stroke-width':.5, opacity:.25, 'stroke-dasharray':'2 6'});
  /* 中轴虚线 */
  el('line', {x1:CX, y1:CY-48, x2:CX, y2:CY+48, stroke:INK8, 'stroke-width':.5, opacity:.2, 'stroke-dasharray':'2 6'});
})();

stageFit();
</script>
</body>
</html>
