<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>shot-06 · 五大问题 · 上下文工程解决什么</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 100px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">CONTEXT ENGINEERING — WHAT<br>5 PROBLEMS · WHY IT MATTERS</div>
  <div class="folio">06 / 15 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">AI 失忆、跑偏、胡说八道，根因往往是上下文工程没做好。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. 06 — FIVE CONTEXT PROBLEMS', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:560, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 5 根立柱 ---------- */
var COLS = [
  {x:150,  no:'01', cn:'窗口有上限',  en:'LIMIT',     tag:'MAX 128K', glyph:'cap',
   note1:'文件读取、工具输出、', note2:'推理过程迅速累积'},
  {x:480,  no:'02', cn:'越长越笨',    en:'DEGRADE',   tag:'LOST IN MIDDLE', glyph:'degrade',
   note1:'上下文越长表现越差，', note2:'注意力被稀释'},
  {x:810,  no:'03', cn:'越长越贵',    en:'COST',      tag:'TOKEN ↑', glyph:'cost',
   note1:'Token 成本与延迟，', note2:'随上下文长度增长'},
  {x:1140, no:'04', cn:'新会话失忆',  en:'AMNESIA',   tag:'NO MEMORY', glyph:'amnesia',
   note1:'不同窗口之间，', note2:'模型不主动记住上次'},
  {x:1470, no:'05', cn:'工具噪音',    en:'NOISE',     tag:'LOG SWAMP', glyph:'noise',
   note1:'日志、文件内容、搜索结果', note2:'吞掉推理空间'}
];
var CW = 300;

/* 栏间分隔虚线 */
[460, 790, 1120, 1450].forEach(function(x){
  el('line', {x1:x, y1:260, x2:x, y2:820, stroke:INK, 'stroke-width':.6, 'stroke-dasharray':'2 6', opacity:.22});
});

COLS.forEach(function(c){
  var x = c.x, cx = x + CW / 2;
  /* 栏题 */
  txt(x, 280, c.cn, {'font-family':SANS, 'font-weight':300, 'font-size':25, fill:INK});
  txt(x, 308, c.en, {'font-family':MONO, 'font-size':13, 'letter-spacing':2.5, fill:INK45});
  el('line', {x1:x, y1:326, x2:x+72, y2:326, stroke:INK, 'stroke-width':.8, opacity:.5});
  el('line', {x1:x, y1:332, x2:x+CW-20, y2:332, stroke:INK, 'stroke-width':.6, opacity:.22});

  /* 微图元 */
  var cy = 470;

  if (c.glyph === 'cap') {
    /* 杯子（满溢/触顶）—— 梯形杯 + 水位线顶刻度 */
    el('path', {d:'M '+(cx-34)+' '+(cy-40)+' L '+(cx+34)+' '+(cy-40)+' L '+(cx+24)+' '+(cy+44)+' L '+(cx-24)+' '+(cy+44)+' Z', fill:'none', stroke:INK80, 'stroke-width':1.3, 'stroke-linejoin':'round'});
    /* 水位（hatch 到顶） */
    for (var ry = cy - 34; ry < cy + 42; ry += 7) {
      el('line', {x1:cx-32+(ry-cy+40)*0.15, y1:ry, x2:cx+32-(ry-cy+40)*0.15, y2:ry, stroke:INK, 'stroke-width':.5, opacity:.3});
    }
    /* 顶部 MAX 线（虚线 + 刻度） */
    el('line', {x1:cx-44, y1:cy-40, x2:cx+44, y2:cy-40, stroke:INK, 'stroke-width':1, opacity:.6, 'stroke-dasharray':'4 3'});
    txt(cx, cy-58, 'MAX', {'font-family':MONO, 'font-size':11, 'letter-spacing':1.5, 'text-anchor':'middle', fill:INK45});
  }

  if (c.glyph === 'degrade') {
    /* 递减阶梯线（从高到低）+ 虚线衰减 */
    var pts = [[cx-50, cy-38], [cx-25, cy-18], [cx, cy+4], [cx+25, cy+22], [cx+50, cy+38]];
    el('path', {d:'M ' + pts.map(function(p){return p[0]+' '+p[1];}).join(' L '), fill:'none', stroke:INK80, 'stroke-width':1.4, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
    pts.forEach(function(p){
      el('circle', {cx:p[0], cy:p[1], r:3.5, fill:'#DFE0D9', stroke:INK, 'stroke-width':1});
      el('circle', {cx:p[0], cy:p[1], r:1.2, fill:INK});
    });
    /* 下方虚线基线 */
    el('line', {x1:cx-56, y1:cy+52, x2:cx+56, y2:cy+52, stroke:INK, 'stroke-width':.6, opacity:.35, 'stroke-dasharray':'3 5'});
  }

  if (c.glyph === 'cost') {
    /* 向上的阶梯柱 + 上方货币符号 */
    var bw = 16, gap = 6;
    var heights = [20, 32, 44, 56];
    heights.forEach(function(h, i){
      var bx = cx - 34 + i * (bw + gap);
      el('rect', {x:bx, y:cy+30-h, width:bw, height:h, fill:'none', stroke:INK80, 'stroke-width':1.1});
      /* 内 hatch */
      for (var hy = cy + 30 - h + 3; hy < cy + 27; hy += 5)
        el('line', {x1:bx, y1:hy, x2:bx+bw, y2:hy-3, stroke:INK, 'stroke-width':.4, opacity:.3});
    });
    el('line', {x1:cx-40, y1:cy+30, x2:cx+40, y2:cy+30, stroke:INK, 'stroke-width':1, opacity:.5});
    /* 向上箭头 */
    el('line', {x1:cx+52, y1:cy+24, x2:cx+52, y2:cy-30, stroke:INK80, 'stroke-width':1.3});
    el('path', {d:'M '+(cx+46)+' '+(cy-22)+' L '+(cx+52)+' '+(cy-30)+' L '+(cx+58)+' '+(cy-22), fill:'none', stroke:INK80, 'stroke-width':1.3, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  }

  if (c.glyph === 'amnesia') {
    /* 两个断开的窗口 + 中间断裂虚线 + ✕ */
    el('rect', {x:cx-60, y:cy-40, width:44, height:56, fill:'none', stroke:INK80, 'stroke-width':1.2});
    for (var a1 = 0; a1 < 3; a1++) el('line', {x1:cx-54, y1:cy-30+a1*12, x2:cx-24, y2:cy-30+a1*12, stroke:INK, 'stroke-width':.6, opacity:.4});
    el('rect', {x:cx+16, y:cy-40, width:44, height:56, fill:'none', stroke:INK80, 'stroke-width':1.2, 'stroke-dasharray':'3 4'});
    for (var a2 = 0; a2 < 3; a2++) el('line', {x1:cx+22, y1:cy-30+a2*12, x2:cx+52, y2:cy-30+a2*12, stroke:INK, 'stroke-width':.6, opacity:.35});
    /* 中间断裂标记 ✕ */
    el('path', {d:'M '+(cx-8)+' '+(cy-8)+' L '+(cx+8)+' '+(cy+8)+' M '+(cx+8)+' '+(cy-8)+' L '+(cx-8)+' '+(cy+8), stroke:INK, 'stroke-width':2, 'stroke-linecap':'round', opacity:.7});
  }

  if (c.glyph === 'noise') {
    /* 杂乱的线条/符号噪音簇 */
    var noiseLines = [
      [cx-40, cy-30, cx-18, cy-30],
      [cx-30, cy-18, cx+12, cy-18],
      [cx-42, cy-6, cx-10, cy-6],
      [cx-20, cy+6, cx+34, cy+6],
      [cx-38, cy+18, cx+8, cy+18],
      [cx+14, cy+30, cx+38, cy+30],
      [cx+20, cy-34, cx+34, cy-34]
    ];
    noiseLines.forEach(function(l){
      el('line', {x1:l[0], y1:l[1], x2:l[2], y2:l[3], stroke:INK, 'stroke-width':.8, opacity:.45 + Math.random()*.25});
    });
    /* 散落小点 */
    for (var ni = 0; ni < 8; ni++) {
      el('circle', {cx:cx-44+Math.random()*88, cy:cy-36+Math.random()*72, r:1.5, fill:INK, opacity:.4});
    }
  }

  /* 说明文字 */
  txt(cx, cy + 130, c.note1, {'font-family':SANS, 'font-weight':300, 'font-size':18, 'text-anchor':'middle', fill:INK70});
  txt(cx, cy + 158, c.note2, {'font-family':SANS, 'font-weight':300, 'font-size':18, 'text-anchor':'middle', fill:'rgba(25,25,23,.55)'});

  /* 栏底 mono 标签 */
  txt(x + CW - 20, 812, c.tag, {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'end', fill:INK45});
});

stageFit();
</script>
</body>
</html>
