<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>shot-12 · 五条启发 · Agent 设计心法</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 100px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">CONTEXT ENGINEERING — CH04<br>5 TAKEAWAYS · AGENT DESIGN</div>
  <div class="folio">12 / 15 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">做好上下文工程，Agent 才能少失忆、不跑偏、不胡说。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. 12 — FIVE AGENT DESIGN TAKEAWAYS', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:580, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 5 根立柱 ---------- */
var COLS = [
  {x:150,  no:'01', cn:'上下文分层',   en:'LAYERING',  tag:'4 LEVELS', glyph:'layers',
   note1:'不要把上下文当垃圾桶', note2:'长时记忆 / 规则 / 工具 / 任务进展'},
  {x:480,  no:'02', cn:'能删就删',     en:'PRUNE',     tag:'NO FLUFF', glyph:'prune',
   note1:'无意义的寒暄、过程日志', note2:'不需要花成本让模型总结'},
  {x:810,  no:'03', cn:'缓存要稳定',   en:'STABLE CACHE',tag:'SAVE MONEY', glyph:'cache',
   note1:'系统提示词、记忆快照', note2:'不要频繁变更，稳定才省钱'},
  {x:1140, no:'04', cn:'写成交接文档', en:'HANDOFF',   tag:'NOT SUMMARY', glyph:'handoff',
   note1:'压缩不是泛泛总结', note2:'给下一轮模型准备可执行清单'},
  {x:1470, no:'05', cn:'压缩后恢复',   en:'RESTORE',   tag:'WORKING SET', glyph:'restore',
   note1:'补回关键文件、激活技能', note2:'否则会重复刚做过的事'}
];
var CW = 300;

/* 栏间分隔虚线 */
[460, 790, 1120, 1450].forEach(function(x){
  el('line', {x1:x, y1:260, x2:x, y2:820, stroke:INK, 'stroke-width':.6, 'stroke-dasharray':'2 6', opacity:.22});
});

COLS.forEach(function(c){
  var x = c.x, cx = x + CW / 2;
  /* 栏题 */
  txt(x, 280, c.cn, {'font-family':SANS, 'font-weight':300, 'font-size':25, fill:INK});
  txt(x, 308, c.en, {'font-family':MONO, 'font-size':13, 'letter-spacing':2.5, fill:INK45});
  el('line', {x1:x, y1:326, x2:x+72, y2:326, stroke:INK, 'stroke-width':.8, opacity:.5});
  el('line', {x1:x, y1:332, x2:x+CW-20, y2:332, stroke:INK, 'stroke-width':.6, opacity:.22});

  /* 微图元 */
  var cy = 470;

  if (c.glyph === 'layers') {
    /* 4 层堆叠（实线→虚线→疏虚线） */
    var dashPatterns = ['none', '6 3', '3 4', '2 5'];
    var opacities = [.8, .6, .45, .3];
    for (var l = 0; l < 4; l++) {
      var ly = cy - 36 + l * 20;
      el('rect', {x:cx-44, y:ly, width:88, height:14, fill:'none', stroke:INK80, 'stroke-width':1.2, opacity:opacities[l], 'stroke-dasharray':dashPatterns[l]});
    }
    /* 左侧向下箭头 */
    el('line', {x1:cx+56, y1:cy-36, x2:cx+56, y2:cy+30, stroke:INK80, 'stroke-width':1.1, opacity:.5});
    el('path', {d:'M '+(cx+50)+' '+(cy+22)+' L '+(cx+56)+' '+(cy+30)+' L '+(cx+62)+' '+(cy+22), fill:'none', stroke:INK80, 'stroke-width':1.1, 'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:.5});
  }

  if (c.glyph === 'prune') {
    /* 剪刀裁剪（两刃 V + 中心轴 + 断开的线） */
    el('line', {x1:cx-50, y1:cy-10, x2:cx-16, y2:cy-10, stroke:INK, 'stroke-width':1, opacity:.5, 'stroke-dasharray':'3 4'});
    el('line', {x1:cx+16, y1:cy-10, x2:cx+50, y2:cy-10, stroke:INK, 'stroke-width':1, opacity:.5, 'stroke-dasharray':'3 4'});
    /* 剪刀 */
    el('circle', {cx:cx-28, cy:cy+20, r:7, fill:'none', stroke:INK80, 'stroke-width':1.3});
    el('circle', {cx:cx+28, cy:cy+20, r:7, fill:'none', stroke:INK80, 'stroke-width':1.3});
    el('line', {x1:cx-24, y1:cy+14, x2:cx-2, y2:cy-4, stroke:INK80, 'stroke-width':1.4});
    el('line', {x1:cx+24, y1:cy+14, x2:cx+2, y2:cy-4, stroke:INK80, 'stroke-width':1.4});
    el('circle', {cx:cx, cy:cy-4, r:3, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1});
    /* 上方被裁掉的碎片 */
    el('line', {x1:cx-20, y1:cy-30, x2:cx-8, y2:cy-30, stroke:INK, 'stroke-width':.6, opacity:.3});
    el('line', {x1:cx+8, y1:cy-30, x2:cx+20, y2:cy-30, stroke:INK, 'stroke-width':.6, opacity:.3});
  }

  if (c.glyph === 'cache') {
    /* 稳定的缓存块（方框 + 锁定标记） */
    el('rect', {x:cx-48, y:cy-32, width:96, height:56, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3});
    /* 内部 3 行内容 */
    for (var cl = 0; cl < 3; cl++) el('line', {x1:cx-38, y1:cy-20+cl*14, x2:cx+38, y2:cy-20+cl*14, stroke:INK, 'stroke-width':.6, opacity:.45});
    /* 锁定标记（挂锁） */
    el('rect', {x:cx-10, y:cy+26, width:20, height:16, rx:2, fill:'none', stroke:INK80, 'stroke-width':1.2});
    el('path', {d:'M '+(cx-6)+' '+(cy+26)+' L '+(cx-6)+' '+(cy+20)+' A 6 6 0 0 1 '+(cx+6)+' '+(cy+20)+' L '+(cx+6)+' '+(cy+26), fill:'none', stroke:INK80, 'stroke-width':1.2});
    el('circle', {cx:cx, cy:cy+34, r:2, fill:INK});
    /* 下方 IN-SYNC 标注 */
    txt(cx, cy+56, 'IN-SYNC', {'font-family':MONO, 'font-size':10, 'letter-spacing':1.5, 'text-anchor':'middle', fill:INK45});
  }

  if (c.glyph === 'handoff') {
    /* 交接文档（文档 + 向右传递箭头） */
    el('path', {d:'M '+(cx-40)+' '+(cy-40)+' L '+(cx-16)+' '+(cy-40)+' L '+(cx-6)+' '+(cy-30)+' L '+(cx-6)+' '+(cy+36)+' L '+(cx-40)+' '+(cy+36)+' Z', fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3, 'stroke-linejoin':'round'});
    el('path', {d:'M '+(cx-16)+' '+(cy-40)+' L '+(cx-16)+' '+(cy-30)+' L '+(cx-6)+' '+(cy-30), fill:'none', stroke:INK, 'stroke-width':.8, opacity:.5});
    /* 文档内字段行 */
    for (var hf = 0; hf < 4; hf++) el('line', {x1:cx-34, y1:cy-20+hf*12, x2:cx-14, y2:cy-20+hf*12, stroke:INK, 'stroke-width':.6, opacity:.45});
    /* 向右箭头（传递给下一窗口） */
    el('line', {x1:cx+4, y1:cy, x2:cx+38, y2:cy, stroke:INK80, 'stroke-width':1.3});
    el('path', {d:'M '+(cx+30)+' '+(cy-6)+' L '+(cx+38)+' '+cy+' L '+(cx+30)+' '+(cy+6), fill:'none', stroke:INK80, 'stroke-width':1.3, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
    /* 接收者小框 */
    el('rect', {x:cx+40, y:cy-12, width:20, height:24, fill:'none', stroke:INK80, 'stroke-width':1, opacity:.5, 'stroke-dasharray':'3 3'});
  }

  if (c.glyph === 'restore') {
    /* 压缩点 → 恢复出三条线（文件/Skill/任务） */
    /* 压缩核（左） */
    el('circle', {cx:cx-36, cy:cy, r:14, fill:'none', stroke:INK80, 'stroke-width':1.3});
    el('circle', {cx:cx-36, cy:cy, r:5, fill:'none', stroke:INK, 'stroke-width':1});
    el('circle', {cx:cx-36, cy:cy, r:2, fill:INK});
    /* 三条恢复线 → 右侧三个目标 */
    var targets = [{y:cy-26, cn:'FILE'}, {y:cy, cn:'SKILL'}, {y:cy+26, cn:'TASK'}];
    targets.forEach(function(t){
      el('line', {x1:cx-22, y1:cy, x2:cx+28, y2:t.y, stroke:INK80, 'stroke-width':1.1, opacity:.55});
      el('circle', {cx:cx+36, cy:t.y, r:8, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.1});
      el('circle', {cx:cx+36, cy:t.y, r:2, fill:INK});
      txt(cx+52, t.y+4, t.cn, {'font-family':MONO, 'font-size':10, 'letter-spacing':1, fill:INK45});
    });
  }

  /* 说明文字 */
  txt(cx, cy + 120, c.note1, {'font-family':SANS, 'font-weight':300, 'font-size':18, 'text-anchor':'middle', fill:INK70});
  txt(cx, cy + 148, c.note2, {'font-family':SANS, 'font-weight':300, 'font-size':18, 'text-anchor':'middle', fill:'rgba(25,25,23,.55)'});

  /* 栏底 mono 标签 */
  txt(x + CW - 20, 812, c.tag, {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'end', fill:INK45});
});

stageFit();
</script>
</body>
</html>
