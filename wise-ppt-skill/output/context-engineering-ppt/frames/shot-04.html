<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>shot-04 · 七层上下文 · 模型推理看见什么</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 100px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">CONTEXT ENGINEERING — WHAT<br>SEVEN LAYERS · MODEL VISION</div>
  <div class="folio">04 / 15 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">每一轮推理，模型看到的远不止你的输入。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. 04 — SEVEN LAYERS OF CONTEXT', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:580, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 骨架：7 层横带 ---------- */
var BT = 240, BH = 80;      /* 每层高 80，7 层 y240–800 */
var BL = 150, BR = 1770;
[0,1,2,3,4,5,6,7].forEach(function(i){
  var y = BT + i * BH;
  el('line', {x1:BL, y1:y, x2:BR, y2:y, stroke:INK, 'stroke-width': (i===0||i===7)?.8:.5, opacity: (i===0||i===7)?.4:.25});
});
el('line', {x1:320, y1:BT, x2:320, y2:BT+7*BH, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 微图元族（形态随语义变化） ---------- */
function nodeDot(cx, cy, r) {
  r = r || 5;
  el('circle', {cx:cx, cy:cy, r:r, fill:'none', stroke:INK80, 'stroke-width':1});
  el('circle', {cx:cx, cy:cy, r:1.8, fill:INK});
}
/* L1 持久记忆：芯片+引脚 */
function gMemory(cx, cy) {
  var s = 30;
  el('rect', {x:cx-s/2, y:cy-s/2, width:s, height:s, fill:'none', stroke:INK80, 'stroke-width':1.2});
  for (var p = 0; p < 3; p++) {
    el('line', {x1:cx-s/2-4, y1:cy-s/4+p*s/4, x2:cx-s/2, y2:cy-s/4+p*s/4, stroke:INK80, 'stroke-width':1});
    el('line', {x1:cx+s/2, y1:cy-s/4+p*s/4, x2:cx+s/2+4, y2:cy-s/4+p*s/4, stroke:INK80, 'stroke-width':1});
  }
  el('circle', {cx:cx, cy:cy, r:5, fill:'none', stroke:INK80, 'stroke-width':1});
}
/* L2 全局规则：书页 */
function gRules(cx, cy) {
  el('path', {d:'M '+(cx-16)+' '+(cy-12)+' C '+(cx-10)+' '+(cy-15)+', '+(cx-2)+' '+(cy-14)+', '+cx+' '+(cy-10)+' L '+cx+' '+(cy+14)+' C '+(cx-8)+' '+(cy+10)+', '+(cx-14)+' '+(cy+12)+', '+(cx-16)+' '+(cy+14)+' Z', fill:'none', stroke:INK80, 'stroke-width':1.1, 'stroke-linejoin':'round'});
  el('path', {d:'M '+(cx+16)+' '+(cy-12)+' C '+(cx+10)+' '+(cy-15)+', '+(cx+2)+' '+(cy-14)+', '+cx+' '+(cy-10), fill:'none', stroke:INK80, 'stroke-width':1.1});
  el('path', {d:'M '+cx+' '+(cy+14)+' C '+(cx+8)+' '+(cy+10)+', '+(cx+14)+' '+(cy+12)+', '+(cx+16)+' '+(cy+14)+' Z', fill:'none', stroke:INK80, 'stroke-width':1.1, 'stroke-linejoin':'round'});
  [-4, 0, 4].forEach(function(dy){ el('line', {x1:cx-12, y1:cy+dy, x2:cx-4, y2:cy+dy, stroke:INK, 'stroke-width':.6, opacity:.5}); el('line', {x1:cx+4, y1:cy+dy, x2:cx+12, y2:cy+dy, stroke:INK, 'stroke-width':.6, opacity:.5}); });
}
/* L3 系统提示词：齿轮 */
function gSystem(cx, cy) {
  el('circle', {cx:cx, cy:cy, r:14, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:cx, cy:cy, r:5, fill:'none', stroke:INK80, 'stroke-width':1});
  for (var a = 0; a < 8; a++) {
    var t = a * Math.PI / 4;
    el('line', {x1:cx+Math.cos(t)*14, y1:cy+Math.sin(t)*14, x2:cx+Math.cos(t)*19, y2:cy+Math.sin(t)*19, stroke:INK80, 'stroke-width':1.4});
  }
}
/* L4 用户提示词：对话气泡 */
function gUser(cx, cy) {
  el('rect', {x:cx-16, y:cy-12, width:32, height:20, rx:5, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('path', {d:'M '+(cx-6)+' '+(cy+8)+' L '+(cx-10)+' '+(cy+14)+' L '+(cx+2)+' '+(cy+8), fill:'none', stroke:INK80, 'stroke-width':1.2, 'stroke-linejoin':'round'});
  [-7, 0, 7].forEach(function(dx){ el('circle', {cx:cx+dx, cy:cy-2, r:1.8, fill:INK}); });
}
/* L5 工具描述：插头 */
function gTool(cx, cy) {
  el('rect', {x:cx-12, y:cy-14, width:24, height:20, rx:2, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:cx-7, y1:cy+6, x2:cx-7, y2:cy+14, stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:cx+7, y1:cy+6, x2:cx+7, y2:cy+14, stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:cx-7, cy:cy-4, r:2, fill:'none', stroke:INK, 'stroke-width':.8});
  el('circle', {cx:cx+7, cy:cy-4, r:2, fill:'none', stroke:INK, 'stroke-width':.8});
}
/* L6 工具返回：返回箭头 */
function gResult(cx, cy) {
  el('line', {x1:cx-16, y1:cy+8, x2:cx+12, y2:cy+8, stroke:INK80, 'stroke-width':1.3});
  el('path', {d:'M '+(cx-12)+' '+(cy+14)+' L '+(cx-16)+' '+(cy+8)+' L '+(cx-12)+' '+(cy+2), fill:'none', stroke:INK80, 'stroke-width':1.3, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  el('line', {x1:cx-16, y1:cy-4, x2:cx+12, y2:cy-4, stroke:INK, 'stroke-width':.6, opacity:.4, 'stroke-dasharray':'3 4'});
}
/* L7 对话历史/摘要：时钟（代表近x轮历史） */
function gHistory(cx, cy) {
  el('circle', {cx:cx, cy:cy, r:14, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:cx, y1:cy, x2:cx, y2:cy-8, stroke:INK, 'stroke-width':1.2, 'stroke-linecap':'round'});
  el('line', {x1:cx, y1:cy, x2:cx+7, y2:cy, stroke:INK, 'stroke-width':1.2, 'stroke-linecap':'round'});
  el('circle', {cx:cx, cy:cy, r:1.8, fill:INK});
}

/* ---------- 层定义 ---------- */
var layers = [
  {no:'L1', cn:'持久记忆',   en:'MEMORY',     item:gMemory,  desc:'跨会话保留 · Soul / Memory 快照'},
  {no:'L2', cn:'全局规则',   en:'RULES',      item:gRules,   desc:'CLAUDE.md · AGENTS.md 项目约束'},
  {no:'L3', cn:'系统提示词', en:'SYS PROMPT', item:gSystem,  desc:'AI 的工作说明 · 不在对话框'},
  {no:'L4', cn:'用户提示词', en:'USER INPUT', item:gUser,    desc:'用户输入 + 注入的变量'},
  {no:'L5', cn:'工具描述',   en:'TOOL DESC',  item:gTool,    desc:'MCP · Function 等工具说明'},
  {no:'L6', cn:'工具返回',   en:'TOOL RESULT',item:gResult,  desc:'工具调用回来的结果'},
  {no:'L7', cn:'对话历史',   en:'HISTORY',    item:gHistory, desc:'近 X 轮对话 + 压缩摘要'}
];

var IXS = [560, 940, 1320];   /* 带内能力件均布 */
layers.forEach(function(L, r){
  var midY = BT + r * BH + BH / 2;
  /* 左列层标 */
  txt(162, midY - 14, L.no, {'font-family':MONO, 'font-size':18, 'letter-spacing':1.5, fill:INK});
  txt(162, midY + 10, L.cn, {'font-family':SANS, 'font-weight':300, 'font-size':20, fill:INK});
  el('line', {x1:162, y1:midY + 22, x2:230, y2:midY + 22, stroke:INK, 'stroke-width':.6, opacity:.3});
  /* 带内：微图元 + 说明文字 */
  L.item(IXS[0] - 70, midY);
  txt(IXS[0] - 20, midY - 5, L.en, {'font-family':MONO, 'font-size':14, 'letter-spacing':1.5, fill:'rgba(25,25,23,.55)'});
  txt(IXS[0] - 20, midY + 18, L.desc, {'font-family':SANS, 'font-weight':300, 'font-size':18, fill:INK});
});

/* 右侧 "采样窗口" 虚线框标注 */
el('rect', {x:1380, y:248, width:360, height:7*80-16, fill:'none', stroke:INK, 'stroke-width':.7, opacity:.3, 'stroke-dasharray':'4 6'});
txt(1560, 234, 'INFERRED PER TURN', {'font-family':MONO, 'font-size':12, 'letter-spacing':2.5, 'text-anchor':'middle', fill:INK45});
/* 框内右侧 mono 注 */
txt(1560, 300, 'w ≈ 128K', {'font-family':MONO, 'font-size':13, 'letter-spacing':1.5, 'text-anchor':'middle', fill:INK45});

stageFit();
</script>
</body>
</html>
