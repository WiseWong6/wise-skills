<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>shot-03 · 金句 · 上下文决定看见什么</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  canvas.px { position: absolute; inset: 0; z-index: 1; }
  svg.marks { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .motif-label {
    position: absolute; left: 0; right: 0; top: 626px;
    text-align: center;
    font-family: var(--mono); font-size: 15px;
    letter-spacing: .5em; text-indent: .5em;
    color: var(--ink-70);
    z-index: 3;
  }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 36px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">CONTEXT ENGINEERING — M2<br>QUOTE · WHAT THE MODEL SEES</div>
  <div class="folio">03 / 15 — BY @歪斯Wise</div>

  <canvas class="px" id="px" width="1920" height="1080"></canvas>

  <svg class="marks" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="motif-label">PROMPT × CONTEXT</div>

  <div class="caption">提示词决定 AI 怎么运行，上下文决定它每一轮看见什么。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
(function(){
  var ctx = document.getElementById('px').getContext('2d');

  /* 四周稀疏静点氛围 */
  PART.dust(ctx, 120, 140, 1680, 150, 55, .16);
  PART.dust(ctx, 120, 320, 560, 420, 50, .15);
  PART.dust(ctx, 1240, 320, 560, 420, 50, .15);
  PART.dust(ctx, 120, 730, 1680, 90, 38, .14);

  /* 小主角：两个同心环——外环=上下文（大、稀疏），内环=提示词（小、密实） */
  var CX = 960, CY = 478;
  /* 外环（上下文）R=104，N=28 */
  var R1 = 104, N1 = 28;
  for (var i = 0; i < N1; i++) {
    var an = -Math.PI / 2 + i / N1 * 6.2832;
    var px = CX + Math.cos(an) * R1 + (Math.random() - .5) * 1.4;
    var py = CY + Math.sin(an) * R1 + (Math.random() - .5) * 1.4;
    PART.dot(ctx, px, py, 1.8 + Math.random() * .6, .5 + Math.random() * .15);
  }
  /* 内环（提示词）R=48，N=14，更密更实 */
  var R2 = 48, N2 = 14;
  for (var j = 0; j < N2; j++) {
    var an2 = -Math.PI / 2 + j / N2 * 6.2832;
    var px2 = CX + Math.cos(an2) * R2 + (Math.random() - .5) * 1.2;
    var py2 = CY + Math.sin(an2) * R2 + (Math.random() - .5) * 1.2;
    PART.dot(ctx, px2, py2, 2.2 + Math.random() * .8, .8 + Math.random() * .18);
  }
  /* 环心静止核 */
  PART.dot(ctx, CX, CY, 2.4, .9);
})();

/* SVG 细线制图标记：两个构造环（虚线基准） */
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var INK8 = 'rgba(25,25,23,.8)';
  var G = document.getElementById('draw');
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    G.appendChild(e); return e;
  }
  var CX = 960, CY = 478;
  /* 外构造环 */
  el('circle', {cx:CX, cy:CY, r:118, fill:'none', stroke:INK8, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 6'});
  /* 内构造环 */
  el('circle', {cx:CX, cy:CY, r:62, fill:'none', stroke:INK8, 'stroke-width':.6, opacity:.25, 'stroke-dasharray':'2 6'});
})();

stageFit();
</script>
</body>
</html>
