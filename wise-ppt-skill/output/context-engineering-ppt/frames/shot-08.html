<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>shot-08 · Claude Code · 渐进式压缩流水线</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 100px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">CONTEXT ENGINEERING — CH03<br>CLAUDE CODE · 5-LEVEL COMPRESSION</div>
  <div class="folio">08 / 15 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch08" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#191917" stroke-width=".7" opacity=".35"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">渐进式压缩 + 压缩后恢复工作集，是 Claude Code 不易失忆的关键。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. 08 — CLAUDE CODE COMPRESSION PIPELINE', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:640, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 共享基线尺 ---------- */
var BY = 560, X0 = 260, X1 = 1660;
var C = [416, 728, 1040, 1352, 1660 - 128];  /* 5 个站位 */
/* 最后一站调整到合理位置 */
C[4] = 1610;
X1 = 1660;
el('line', {x1:X0, y1:BY, x2:X1, y2:BY, stroke:INK, 'stroke-width':1, opacity:.5});
for (var tx = X0; tx <= X1; tx += 40) {
  if (C.some(function(c){ return Math.abs(tx - c) < 14; })) continue;
  el('line', {x1:tx, y1:BY-5, x2:tx, y2:BY+5, stroke:INK, 'stroke-width':.5, opacity:.35});
}
C.forEach(function(c){
  el('line', {x1:c, y1:BY-9, x2:c, y2:BY+9, stroke:INK, 'stroke-width':1, opacity:.8});
});

/* ---------- 段间开放箭头 ---------- */
for (var i = 0; i < 4; i++) {
  var a1 = C[i] + 96, a2 = C[i+1] - 96;
  el('line', {x1:a1, y1:BY, x2:a2, y2:BY, stroke:INK80, 'stroke-width':1.3});
  el('path', {d:'M '+(a2-13)+' '+(BY-6.5)+' L '+a2+' '+BY+' L '+(a2-13)+' '+(BY+6.5),
    fill:'none', stroke:INK80, 'stroke-width':1.3, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
}

/* 虚线吊点 */
function hanger(c, yTop){
  el('line', {x1:c, y1:yTop, x2:c, y2:BY-12, stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'3 5'});
  el('circle', {cx:c, cy:yTop, r:2, fill:INK, opacity:.5});
}

/* ---------- ① 高噪音清理：筛网 ---------- */
(function(){
  var c = C[0], x = c - 60, y = 320, w = 120, h = 130;
  /* 筛网外框 */
  el('rect', {x:x, y:y, width:w, height:h, rx:6, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3});
  /* 网格线 */
  for (var gx = x+12; gx < x+w; gx += 14)
    el('line', {x1:gx, y1:y+10, x2:gx, y2:y+h-10, stroke:INK, 'stroke-width':.6, opacity:.4});
  for (var gy = y+12; gy < y+h; gy += 14)
    el('line', {x1:x+8, y1:gy, x2:x+w-8, y2:gy, stroke:INK, 'stroke-width':.6, opacity:.4});
  /* 上方噪音点（被筛掉的） */
  for (var pi = 0; pi < 6; pi++)
    el('circle', {cx:x+15+Math.random()*90, cy:y-10-Math.random()*24, r:1.8, fill:INK, opacity:.4});
  /* 下方干净流 */
  el('line', {x1:c, y1:y+h+8, x2:c, y2:y+h+24, stroke:INK80, 'stroke-width':1.1, opacity:.6});
  hanger(c, y);
})();

/* ---------- ② 历史裁剪：裁刀/剪刀 ---------- */
(function(){
  var c = C[1], y0 = 330;
  /* 左剪刃（V形） */
  el('path', {d:'M '+(c-44)+' '+(y0+24)+' L '+(c-4)+' '+(y0+58)+' L '+(c-44)+' '+(y0+92), fill:'none', stroke:INK80, 'stroke-width':1.4, 'stroke-linejoin':'round'});
  /* 右剪刃 */
  el('path', {d:'M '+(c+44)+' '+(y0+24)+' L '+(c+4)+' '+(y0+58)+' L '+(c+44)+' '+(y0+92), fill:'none', stroke:INK80, 'stroke-width':1.4, 'stroke-linejoin':'round'});
  /* 中心轴 */
  el('circle', {cx:c, cy:y0+58, r:6, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:c, cy:y0+58, r:1.8, fill:INK});
  /* 被裁断的对话行（虚线断口） */
  el('line', {x1:c-52, y1:y0+58, x2:c-16, y2:y0+58, stroke:INK, 'stroke-width':.8, opacity:.5, 'stroke-dasharray':'3 4'});
  el('line', {x1:c+16, y1:y0+58, x2:c+52, y2:y0+58, stroke:INK, 'stroke-width':.8, opacity:.5, 'stroke-dasharray':'3 4'});
  hanger(c, y0+20);
})();

/* ---------- ③ 轻量压缩（缓存感知）：折纸 ---------- */
(function(){
  var c = C[2], x = c-48, y = 330, w = 96, h = 120;
  /* 纸张外框（带折角） */
  el('path', {d:'M '+x+' '+y+' L '+(x+w-20)+' '+y+' L '+(x+w)+' '+(y+20)+' L '+(x+w)+' '+(y+h)+' L '+x+' '+(y+h)+' Z', fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3, 'stroke-linejoin':'round'});
  el('path', {d:'M '+(x+w-20)+' '+y+' L '+(x+w-20)+' '+(y+20)+' L '+(x+w)+' '+(y+20), fill:'none', stroke:INK, 'stroke-width':.8, opacity:.5});
  /* 折叠线（虚线） */
  el('line', {x1:x+8, y1:y+50, x2:x+w-8, y2:y+50, stroke:INK, 'stroke-width':.6, opacity:.4, 'stroke-dasharray':'4 4'});
  el('line', {x1:x+8, y1:y+80, x2:x+w-8, y2:y+80, stroke:INK, 'stroke-width':.6, opacity:.4, 'stroke-dasharray':'4 4'});
  /* 上半文字行（密） */
  for (var r1 = 0; r1 < 3; r1++) el('line', {x1:x+12, y1:y+18+r1*10, x2:x+w-12, y2:y+18+r1*10, stroke:INK, 'stroke-width':.5, opacity:.4});
  /* 下半文字行（疏 → 压缩后） */
  el('line', {x1:x+12, y1:y+60, x2:x+w-24, y2:y+60, stroke:INK, 'stroke-width':.6, opacity:.5});
  el('line', {x1:x+12, y1:y+72, x2:x+w-16, y2:y+72, stroke:INK, 'stroke-width':.6, opacity:.5});
  /* 缓存命中标记 */
  txt(x+w/2, y+h+28, 'CACHE-AWARE', {'font-family':MONO, 'font-size':11, 'letter-spacing':1.5, 'text-anchor':'middle', fill:INK45});
  hanger(c, y);
})();

/* ---------- ④ 上下文折叠：叠纸 ---------- */
(function(){
  var c = C[3], x = c-44, y = 340, w = 88, h = 44;
  /* 三层叠纸（从下到上逐渐小） */
  for (var layer = 2; layer >= 0; layer--) {
    var off = layer * 8;
    el('rect', {x:x-off, y:y+layer*30, width:w-off*2, height:h, fill: layer===0 ? 'rgba(255,255,255,.22)' : 'none', stroke:INK80, 'stroke-width':1.2, opacity:1-layer*.15});
    /* 每层内文字行 */
    el('line', {x1:x-off+8, y1:y+layer*30+14, x2:x-off+w-off*2-20, y2:y+layer*30+14, stroke:INK, 'stroke-width':.5, opacity:.4-layer*.08});
    el('line', {x1:x-off+8, y1:y+layer*30+26, x2:x-off+w-off*2-28, y2:y+layer*30+26, stroke:INK, 'stroke-width':.5, opacity:.4-layer*.08});
  }
  /* 折叠箭头（竖向） */
  el('line', {x1:c+w/2+12, y1:y+10, x2:c+w/2+12, y2:y+90, stroke:INK80, 'stroke-width':1.1, opacity:.5});
  el('path', {d:'M '+(c+w/2+6)+' '+(y+82)+' L '+(c+w/2+12)+' '+(y+90)+' L '+(c+w/2+18)+' '+(y+82), fill:'none', stroke:INK80, 'stroke-width':1.1, 'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:.5});
  hanger(c, y);
})();

/* ---------- ⑤ 自动压缩：压缩机/活塞（视觉重心，放大） ---------- */
(function(){
  var c = C[4], cy = 400, r = 80;
  /* 圆筒外壳 */
  el('circle', {cx:c, cy:cy, r:r, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.4});
  el('circle', {cx:c, cy:cy, r:r-8, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
  /* 内部压缩旋涡（同心弧箭头） */
  for (var ring = 0; ring < 3; ring++) {
    var rr = r - 24 - ring * 16;
    el('path', {d:'M '+(c+rr)+' '+cy+' A '+rr+' '+rr+' 0 0 1 '+(c-rr*.3)+' '+(cy-rr*.95), fill:'none', stroke:INK80, 'stroke-width':1.2, opacity:.7-ring*.15});
  }
  /* 中心核 */
  el('circle', {cx:c, cy:cy, r:5, fill:'none', stroke:INK, 'stroke-width':1});
  el('circle', {cx:c, cy:cy, r:2, fill:INK});
  /* 入口（上方宽箭头） */
  el('path', {d:'M '+(c-24)+' '+(cy-r-30)+' L '+(c+24)+' '+(cy-r-30)+' L '+(c+24)+' '+(cy-r-8)+' L '+(c-24)+' '+(cy-r-8)+' Z', fill:'none', stroke:INK80, 'stroke-width':1.2, opacity:.6});
  el('line', {x1:c, y1:cy-r-30, x2:c, y2:cy-r-44, stroke:INK80, 'stroke-width':1.1, opacity:.5});
  /* 出口（下方窄箭头 → 压缩后小） */
  el('path', {d:'M '+(c-8)+' '+(cy+r+8)+' L '+(c+8)+' '+(cy+r+8)+' L '+(c+8)+' '+(cy+r+24)+' L '+(c-8)+' '+(cy+r+24)+' Z', fill:'none', stroke:INK80, 'stroke-width':1.1, opacity:.6});
  txt(c, cy+r+50, 'SUMMARY', {'font-family':MONO, 'font-size':11, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
  hanger(c, cy+r);
})();

/* ---------- 站位编号与说明 ---------- */
var steps = [
  {no:'1', en:'NOISE CLEAR',  cn:'高噪音清理', note:'处理工具结果等高噪音'},
  {no:'2', en:'HISTORY CUT',  cn:'历史裁剪',   note:'裁掉旧的工具输出'},
  {no:'3', en:'LIGHT COMPRESS',cn:'轻量压缩',  note:'缓存感知的摘要'},
  {no:'4', en:'FOLDING',      cn:'上下文折叠', note:'全文换成摘要继续'},
  {no:'5', en:'AUTO COMPACT', cn:'自动压缩',   note:'激进取舍旧上下文'}
];
steps.forEach(function(s, i){
  var c = C[i];
  el('circle', {cx:c, cy:BY+50, r:18, fill:'#DFE0D9', stroke:INK, 'stroke-width':1.4});
  txt(c, BY+56, s.no, {'font-family':MONO, 'font-size':16, 'text-anchor':'middle', fill:INK});
  txt(c, BY+98, s.en, {'font-family':MONO, 'font-size':13, 'letter-spacing':1.5, 'text-anchor':'middle', fill:INK});
  txt(c, BY+124, s.cn, {'font-family':SANS, 'font-weight':300, 'font-size':18, 'text-anchor':'middle', fill:INK70});
  txt(c, BY+148, s.note, {'font-family':SANS, 'font-weight':300, 'font-size':15, 'text-anchor':'middle', fill:'rgba(25,25,23,.5)'});
});

/* ---------- 底部恢复条（压缩后自动恢复工作集） ---------- */
var RY = 810;
el('line', {x1:200, y1:RY, x2:1720, y2:RY, stroke:INK, 'stroke-width':.6, opacity:.3});
txt(220, RY-8, 'AUTO-RESTORE AFTER COMPRESSION', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, fill:INK45});

var restore = [
  {cx:560,  cn:'最近 5 个文件', en:'RECENT FILES'},
  {cx:960,  cn:'已激活的 Skills', en:'ACTIVE SKILLS'},
  {cx:1360, cn:'当前任务状态',   en:'TASK STATE'}
];
restore.forEach(function(r){
  el('circle', {cx:r.cx-100, cy:RY+32, r:4, fill:'none', stroke:INK, 'stroke-width':1, opacity:.6});
  el('circle', {cx:r.cx-100, cy:RY+32, r:1.4, fill:INK, opacity:.7});
  txt(r.cx-86, RY+36, r.cn, {'font-family':SANS, 'font-weight':300, 'font-size':18, fill:INK});
  txt(r.cx-86, RY+58, r.en, {'font-family':MONO, 'font-size':12, 'letter-spacing':2, fill:INK45});
});

stageFit();
</script>
</body>
</html>
