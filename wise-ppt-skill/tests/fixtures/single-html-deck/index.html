<!doctype html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单 HTML 运行时验收</title>
<link rel="stylesheet" href="../../../themes/paper-ink/assets/shared.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#d6d7d0}.slide{width:1920px;height:1080px;flex:none;position:relative;overflow:hidden}.slide .stage{width:1920px;height:1080px}.title{position:absolute;left:140px;top:80px;font:500 var(--type-title) var(--serif)}.take{position:absolute;left:140px;bottom:70px;font:var(--type-caption) var(--sans)}
#board{padding:40px;min-height:100vh}.board-head,.section-label,.board-grid{max-width:1500px;margin:auto}.section-label{margin-top:30px;border-bottom:1px solid var(--ink-45);padding:8px;font:var(--type-meta) var(--mono)}.board-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:16px}.board-card{border:0;background:none;text-align:left}.board-preview{position:relative;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--ink-45)}.board-clone{position:absolute!important;inset:0!important;transform:scale(var(--board-scale));transform-origin:top left}.board-title{margin-top:8px;font:var(--type-label) var(--mono)}.board-summary{margin-top:4px;color:var(--ink-70)}
#deck{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);visibility:hidden}#deck-stage{width:1920px;height:1080px;overflow:hidden;transform-origin:center}#track{display:flex;width:max-content;height:1080px;transition:transform .25s}#pager,#board-toggle{position:fixed;right:24px;z-index:5}#pager{bottom:18px;color:#fff}#board-toggle{bottom:50px}body.mode-deck #board{display:none}body.mode-deck #deck{visibility:visible}body.mode-board #pager,body.mode-board #board-toggle{display:none}
.pipeline{position:absolute;left:140px;top:305px;width:1640px;display:flex;align-items:center;gap:32px}.node{width:360px;height:150px;border:1px solid #191917;padding:30px}.node b{display:block;font:500 var(--type-subheading) var(--serif);margin-bottom:12px}.arrow{font:var(--type-heading) var(--serif)}.band{position:absolute;left:140px;top:650px;width:1640px;border-block:1px solid #191917;padding:30px 40px;font:500 var(--type-metric) var(--serif)}
.shell{position:absolute;left:120px;top:160px;width:1680px;height:730px;border:1px solid #191917;background:rgba(255,255,255,.24);padding:40px}.status{font:500 var(--type-heading) var(--serif)}.chart{position:absolute;right:60px;top:100px;width:900px;height:480px;border:1px solid rgba(25,25,23,.3)}.note{position:absolute;left:40px;bottom:80px;width:550px;font:var(--type-body)/1.5 var(--sans)}
@page{size:20in 11.25in;margin:0}html.print-mode #board,html.print-mode #pager,html.print-mode #board-toggle{display:none!important}html.print-mode #deck{position:static;display:block;visibility:visible;background:#fff}html.print-mode #deck-stage{width:1920px;height:auto;overflow:visible;transform:none!important}html.print-mode #track{display:block;width:1920px;height:auto;transform:none!important}html.print-mode .slide{break-after:page;page-break-after:always}html.print-mode .slide:last-child{break-after:auto;page-break-after:auto}@media print{*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style><script src="../../../runtime/deck-runtime.js"></script></head>
<body class="mode-board"><main id="board"><header class="board-head"><h1 id="deck-title"></h1><p id="deck-subtitle"></p></header><div id="board-sections"></div></main>

</section>
</div></div><div id="pager"></div><button id="board-toggle" type="button">返回画册</button></section></body></html>
