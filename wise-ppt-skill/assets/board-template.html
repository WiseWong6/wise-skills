<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>画板模式 · 分镜总览</title>
<!--
  ⚠️ DEPRECATED：本模板已废弃，仅保留向后兼容。新 deck 请使用 app-template.html。
     差异：app-template 把画板与全屏合并为单文件双模式，缩略图改用 PNG（根治 N 个
     iframe 同屏卡顿），点缩略图进入全屏放映（同页切换 + ESC 返回），全屏带预加载。
     使用旧 board+deck 双文件结构的既有 deck 无需改动；新建 deck 一律用 app-template。
  ========================================================================
  纸墨线稿 · 画板模式模板（缩略图总览）
  使用：复制为 deck 目录的 index.html，填写下方 CONFIG 与 SHOTS。
    - SHOTS 每行：[幕组 id, 页码, 中文标题, 时间码(可空), 一句话 VO]
    - ACTS 定义幕组顺序与名称；不需要分幕时只留一组
    - frames/shot-NN.html 必须存在；点击缩略图新标签页打开原尺寸
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #D6D7D0;
    color: #191917;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    padding: 48px 40px 80px;
    -webkit-font-smoothing: antialiased;
  }
  header { max-width: 1560px; margin: 0 auto 36px; }
  header h1 { font-size: 30px; font-weight: 700; }
  header p { margin-top: 10px; color: rgba(25,25,23,.55); font-size: 14px; font-family: ui-monospace, Menlo, monospace; letter-spacing: .08em; }
  .act {
    max-width: 1560px; margin: 36px auto 18px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 13px; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(25,25,23,.55);
    border-bottom: 1px solid rgba(25,25,23,.3);
    padding-bottom: 10px;
  }
  .grid {
    max-width: 1560px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .shot { display: block; text-decoration: none; color: inherit; }
  .frame {
    width: 100%; aspect-ratio: 16/9;
    overflow: hidden; border-radius: 6px;
    border: 1px solid rgba(25,25,23,.35);
    position: relative; background: #DFE0D9;
    transition: box-shadow .2s;
  }
  .shot:hover .frame { box-shadow: 0 6px 24px rgba(25,25,23,.25); }
  .frame iframe {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px; border: 0;
    transform-origin: top left; pointer-events: none;
  }
  .meta { margin-top: 10px; }
  .meta .row1 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: ui-monospace, Menlo, monospace;
  }
  .meta .no { color: rgba(25,25,23,.8); font-size: 13px; letter-spacing: .12em; }
  .meta .tc { color: rgba(25,25,23,.45); font-size: 12px; }
  .meta .vo { margin-top: 5px; font-size: 13px; line-height: 1.6; color: rgba(25,25,23,.6); }
</style>
</head>
<body>
<header>
  <h1 id="deck-title">《标题》分镜总览</h1>
  <p id="deck-sub">N SHOTS · 精细线稿版 · 点击任意镜头在新标签页查看 1920×1080 原尺寸</p>
</header>
<div id="acts"></div>

<script>
/* ===== 配置区：改这里 ===== */
var CONFIG = {
  title: '《标题》分镜总览',
  framesDir: 'frames',           // 分镜目录（相对本文件）
  framePrefix: 'shot-'           // 文件名前缀：frames/shot-NN.html
};
var ACTS = [
  ['g1', 'ACT 1 · 第一幕名称'],
  ['g2', 'ACT 2 · 第二幕名称']
];
var SHOTS = [
  ['g1', '01', '页面标题', '', '一句话 VO / 页面内容摘要。'],
  ['g2', '02', '页面标题', '', '一句话 VO / 页面内容摘要。']
];
/* ===== 配置区结束 ===== */

document.getElementById('deck-title').textContent = CONFIG.title;
document.getElementById('deck-sub').textContent =
  SHOTS.length + ' SHOTS · 精细线稿版 · 点击任意镜头在新标签页查看 1920×1080 原尺寸';

var actsRoot = document.getElementById('acts');
ACTS.forEach(function(a) {
  var label = document.createElement('div');
  label.className = 'act';
  label.textContent = a[1];
  var grid = document.createElement('div');
  grid.className = 'grid';
  grid.id = a[0];
  actsRoot.appendChild(label);
  actsRoot.appendChild(grid);
});
SHOTS.forEach(function(s) {
  var a = document.createElement('a');
  a.className = 'shot';
  a.href = CONFIG.framesDir + '/' + CONFIG.framePrefix + s[1] + '.html';
  a.target = '_blank';
  a.innerHTML =
    '<div class="frame"><iframe data-src="' + a.href + '" scrolling="no"></iframe></div>' +
    '<div class="meta"><div class="row1"><span class="no">S' + s[1] + ' · ' + s[2] + '</span>' +
    '<span class="tc">' + s[3] + '</span></div><div class="vo">' + s[4] + '</div></div>';
  var grid = document.getElementById(s[0]);
  if (grid) grid.appendChild(a);
});
function fit() {
  document.querySelectorAll('.frame').forEach(function(f) {
    var k = f.clientWidth / 1920;
    f.querySelector('iframe').style.transform = 'scale(' + k + ')';
  });
}
document.querySelectorAll('iframe').forEach(function(i) { i.src = i.dataset.src; });
addEventListener('resize', fit);
fit();
</script>
</body>
</html>
