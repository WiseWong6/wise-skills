<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>置身钉内：ONE 的系统复盘</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d6d7d0;color:#191917;font-family:-apple-system,"PingFang SC",sans-serif}header{max-width:1500px;margin:0 auto;padding:48px 24px 28px;display:flex;justify-content:space-between;gap:24px;align-items:end}h1{font-size:32px;margin:0}header p{margin:8px 0 0;color:#666}button{border:1px solid #777;background:transparent;padding:10px 14px;cursor:pointer}#grid{max-width:1500px;margin:0 auto;padding:0 24px 72px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{min-height:220px;border:1px solid #999;background:#dfe0d9;padding:24px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.card:hover{border-color:#191917}.no,.section{font:12px ui-monospace,monospace;letter-spacing:.18em;color:#777}.card h2{font-size:22px;font-weight:500;line-height:1.45}.card p{font-size:14px;line-height:1.6;color:#666}#deck{position:fixed;inset:0;background:#111;display:none}#deck.on{display:block}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .18s}iframe.visible{opacity:1}#toolbar{position:absolute;right:24px;bottom:20px;z-index:5;display:flex;gap:8px;color:#fff}#toolbar button{border-color:#777;color:#ddd;background:#222c}#pager{padding:10px 12px;font:13px ui-monospace,monospace}@media(max-width:900px){#grid{grid-template-columns:1fr}}</style></head>
<body><header><div><h1>置身钉内：ONE 的系统复盘</h1><p>15 页 · 点击任意页面进入放映</p></div><button id="accent">强调色：开</button></header><main id="grid"></main><section id="deck"><iframe id="a"></iframe><iframe id="b"></iframe><div id="toolbar"><button id="back">画板</button><button id="prev">←</button><span id="pager"></span><button id="next">→</button></div></section>
<script>const slides=[{"no": "01", "title": "ONE 的问题，不是没有理想，而是理想没有收敛成同一个真实问题", "takeaway": "这是一条从发心、定位、设计到组织秩序的失败链。", "section": "发心与定位"}, {"no": "02", "title": "八章复盘把产品问题逐步推向组织与长期主义", "takeaway": "产品成败不是单点设计题，而是一套相互作用的系统。", "section": "发心与定位"}, {"no": "03", "title": "ONE 同时承载用户、产品与组织三层发心", "takeaway": "它既想减少遗漏，也想成为 AI 新入口，还承担了一场组织战役。", "section": "发心与定位"}, {"no": "04", "title": "定位必须同时回答用户、场景、价值与竞争", "takeaway": "定位不是命名，而是取舍以后仍然留下来的方向。", "section": "发心与定位"}, {"no": "05", "title": "ONE 的目标彼此牵制，构成一个不可能 N 角", "takeaway": "高频、普适、管理者价值、成本、信息流与 AI 准确率很难同时最优。", "section": "发心与定位"}, {"no": "06", "title": "定位反复改写，却没有补上前一阶段留下的缝", "takeaway": "大基数与付费、工作流与学习流、看见与做完、旧入口与新入口的矛盾一直存在。", "section": "发心与定位"}, {"no": "07", "title": "卡片很有表现力，却与工作信息的实时性和上下文发生冲突", "takeaway": "形式一旦主导注意力，用户就会先感到成本，再感到价值。", "section": "设计与用户"}, {"no": "08", "title": "实时、排序、卡片与已读叠加成一条体验失败链", "takeaway": "团队修补了很多痛点，却长期绕开“这个已读到底该不该发生”。", "section": "设计与用户"}, {"no": "09", "title": "放弃大包大揽后，设计才从形式回到用户动作", "takeaway": "产品不再证明“卡片能做什么”，而是聚焦阅读、表达与防遗漏。", "section": "设计与用户"}, {"no": "10", "title": "共创用户体验的是产品加服务，真实用户只验收眼前价值", "takeaway": "共创里的解释、陪伴和耐心，上线后都不会自动存在。", "section": "设计与用户"}, {"no": "11", "title": "用户最诚实的回答，往往不在嘴上，而在成本里", "takeaway": "愿不愿多点一次、改变路径、交出流程，比一句“不错”更有证据重量。", "section": "设计与用户"}, {"no": "12", "title": "响应快在修补痛感，迭代深才敢回到最初判断", "takeaway": "每天有东西改不等于敏捷；关键是有没有更接近正确问题。", "section": "敏捷与秩序"}, {"no": "13", "title": "流水线管理追求可见性，创造性劳动需要完整时间与自主判断", "takeaway": "当可见性成为最高价值，人会把时间投向被看见，而不是创造价值。", "section": "敏捷与秩序"}, {"no": "14", "title": "平台竞争的终局判断没有错，问题是太早用终局叙事组织中局战斗", "takeaway": "战略不是把所有机会装进发布会，而是明确选择什么不做。", "section": "敏捷与秩序"}, {"no": "15", "title": "真正的敏捷，是更快学习、更快校准、更快把资源转向正确问题", "takeaway": "如果一个团队每天都在动，却没有更接近正确问题，那不叫敏捷，叫奔波。", "section": "敏捷与秩序"}];let cur=0,accent=true,front=document.querySelector('#a'),back=document.querySelector('#b');const grid=document.querySelector('#grid'),deck=document.querySelector('#deck');slides.forEach((s,i)=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div><span class="no">${s.no}</span><span class="section"> · ${s.section}</span><h2>${s.title}</h2></div><p>${s.takeaway}</p>`;el.onclick=()=>enter(i);grid.appendChild(el)});function url(i){return `frames/shot-${slides[i].no}.html?ppt${accent?'&accent':''}`}async function ready(f){for(let i=0;i<160;i++){try{const d=f.contentDocument;if(d?.documentElement?.dataset.renderReady==='true'){if(d.fonts?.ready)await d.fonts.ready;return}}catch(e){}await new Promise(r=>setTimeout(r,50))}throw new Error('page ready timeout')}async function show(i){cur=Math.max(0,Math.min(slides.length-1,i));back.classList.remove('visible');back.src=url(cur);await ready(back);front.classList.remove('visible');back.classList.add('visible');[front,back]=[back,front];document.querySelector('#pager').textContent=`${cur+1} / ${slides.length}`;history.replaceState(null,'',`#${cur+1}`)}function enter(i){deck.classList.add('on');show(i)}function leave(){deck.classList.remove('on');history.replaceState(null,'',location.pathname)}document.querySelector('#prev').onclick=()=>show(cur-1);document.querySelector('#next').onclick=()=>show(cur+1);document.querySelector('#back').onclick=leave;document.querySelector('#accent').onclick=e=>{accent=!accent;e.target.textContent=`强调色：${accent?'开':'关'}`;if(deck.classList.contains('on'))show(cur)};addEventListener('keydown',e=>{if(!deck.classList.contains('on'))return;if(['ArrowRight',' ','PageDown'].includes(e.key))show(cur+1);if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1);if(e.key==='Escape')leave()});if(location.hash)enter(Math.max(0,parseInt(location.hash.slice(1),10)-1));</script></body></html>
