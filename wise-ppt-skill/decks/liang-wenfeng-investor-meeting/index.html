<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梁文锋投资者交流会：愿景如何成为经营系统</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d6d7d0;color:#191917;font-family:-apple-system,"PingFang SC",sans-serif}header{max-width:1500px;margin:0 auto;padding:48px 24px 28px;display:flex;justify-content:space-between;gap:24px;align-items:end}h1{font-size:32px;margin:0}header p{margin:8px 0 0;color:#666}button{border:1px solid #777;background:transparent;padding:10px 14px;cursor:pointer}#grid{max-width:1500px;margin:0 auto;padding:0 24px 72px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{min-height:220px;border:1px solid #999;background:#dfe0d9;padding:24px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.card:hover{border-color:#191917}.no,.section{font:12px ui-monospace,monospace;letter-spacing:.18em;color:#777}.card h2{font-size:22px;font-weight:500;line-height:1.45}.card p{font-size:14px;line-height:1.6;color:#666}#deck{position:fixed;inset:0;background:#111;display:none}#deck.on{display:block}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .18s}iframe.visible{opacity:1}#toolbar{position:absolute;right:24px;bottom:20px;z-index:5;display:flex;gap:8px;color:#fff}#toolbar button{border-color:#777;color:#ddd;background:#222c}#pager{padding:10px 12px;font:13px ui-monospace,monospace}@media(max-width:900px){#grid{grid-template-columns:1fr}}</style></head>
<body><header><div><h1>梁文锋投资者交流会：愿景如何成为经营系统</h1><p>14 页 · 点击任意页面进入放映</p></div><button id="accent">强调色：开</button></header><main id="grid"></main><section id="deck"><iframe id="a"></iframe><iframe id="b"></iframe><div id="toolbar"><button id="back">画板</button><button id="prev">←</button><span id="pager"></span><button id="next">→</button></div></section>
<script>const slides=[{"no": "01", "title": "愿景不是口号，它通过一连串克制的选择被执行", "takeaway": "本套只呈现交流会原文中的主张；专名与数字以录音为准。", "section": "愿景与商业"}, {"no": "02", "title": "愿景在交流会中被当作组织与经营的解释系统", "takeaway": "开源、定价、人才凝聚和研究方向都被放在同一愿景下解释。", "section": "愿景与商业"}, {"no": "03", "title": "克制不是少做事，而是拒绝用短期收益破坏长期机会", "takeaway": "越大的机会，越需要限制当下对利润、流量与边界的索取。", "section": "愿景与商业"}, {"no": "04", "title": "API 定价用“约十个月回收设备成本”定义合理利润", "takeaway": "交流会明确表示：这个标准不是利润最大化，而是公司与使用者都能接受的平衡。", "section": "愿景与商业"}, {"no": "05", "title": "开源与商业化并不冲突，真正的门槛留在部署与工程效率", "takeaway": "模型开放不等于每家公司都能以同样成本把服务运行起来。", "section": "愿景与商业"}, {"no": "06", "title": "AGI 路线被拆成五级能力阶梯", "takeaway": "Agent 不是终点；持续学习、自我迭代与具身智能继续抬高智能上限。", "section": "AGI 路线"}, {"no": "07", "title": "当前模型的强大依赖完整上下文，而真实工作恰恰缺少这个前提", "takeaway": "持续学习要补的是跨时间积累的上下文，不只是把单次任务做得更长。", "section": "AGI 路线"}, {"no": "08", "title": "持续学习一旦成立，AI 就能帮助构建下一代 AI", "takeaway": "前一阶能力会成为后一阶研发工具，使自我迭代与具身阶段更可达。", "section": "AGI 路线"}, {"no": "09", "title": "C 端与 B 端产品被视为通往 AGI 路上的阶段产出", "takeaway": "商业化可以承接中间能力，但不反过来定义研究终点。", "section": "AGI 路线"}, {"no": "10", "title": "在交流会的判断里，团队稳定是最不能退让的核心利益", "takeaway": "资金和资源可以再获得；关键研究团队一旦持续流失，路线本身会中断。", "section": "组织与算力"}, {"no": "11", "title": "研究组织靠分布式自主性保持探索效率，也面临规模化后的结构挑战", "takeaway": "轻结构适合早期研究，但人数增长后仍要解决协作、方向与支持系统。", "section": "组织与算力"}, {"no": "12", "title": "算力约束把效率工程从成本项变成核心能力", "takeaway": "更少的卡迫使模型、训练、推理和部署共同优化，也让低价服务成为可能。", "section": "组织与算力"}, {"no": "13", "title": "国产硬件合作同时走产能与软件生态两条轨道", "takeaway": "交流会把华为 950 视为生态建设机会，把 TileLang 视为降低迁移和优化门槛的工具。", "section": "组织与算力"}, {"no": "14", "title": "“我们只会因为它是智能路线图上的东西，才会去做”", "takeaway": "在这套逻辑里，商业机会要接受长期智能路线图的筛选。", "section": "组织与算力"}];let cur=0,accent=true,front=document.querySelector('#a'),back=document.querySelector('#b');const grid=document.querySelector('#grid'),deck=document.querySelector('#deck');slides.forEach((s,i)=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div><span class="no">${s.no}</span><span class="section"> · ${s.section}</span><h2>${s.title}</h2></div><p>${s.takeaway}</p>`;el.onclick=()=>enter(i);grid.appendChild(el)});function url(i){return `frames/shot-${slides[i].no}.html?ppt${accent?'&accent':''}`}async function ready(f){for(let i=0;i<160;i++){try{const d=f.contentDocument;if(d?.documentElement?.dataset.renderReady==='true'){if(d.fonts?.ready)await d.fonts.ready;return}}catch(e){}await new Promise(r=>setTimeout(r,50))}throw new Error('page ready timeout')}async function show(i){cur=Math.max(0,Math.min(slides.length-1,i));back.classList.remove('visible');back.src=url(cur);await ready(back);front.classList.remove('visible');back.classList.add('visible');[front,back]=[back,front];document.querySelector('#pager').textContent=`${cur+1} / ${slides.length}`;history.replaceState(null,'',`#${cur+1}`)}function enter(i){deck.classList.add('on');show(i)}function leave(){deck.classList.remove('on');history.replaceState(null,'',location.pathname)}document.querySelector('#prev').onclick=()=>show(cur-1);document.querySelector('#next').onclick=()=>show(cur+1);document.querySelector('#back').onclick=leave;document.querySelector('#accent').onclick=e=>{accent=!accent;e.target.textContent=`强调色：${accent?'开':'关'}`;if(deck.classList.contains('on'))show(cur)};addEventListener('keydown',e=>{if(!deck.classList.contains('on'))return;if(['ArrowRight',' ','PageDown'].includes(e.key))show(cur+1);if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1);if(e.key==='Escape')leave()});if(location.hash)enter(Math.max(0,parseInt(location.hash.slice(1),10)-1));</script></body></html>
