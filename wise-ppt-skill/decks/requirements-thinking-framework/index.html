<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写好需求的思维框架</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d6d7d0;color:#191917;font-family:-apple-system,"PingFang SC",sans-serif}header{max-width:1500px;margin:0 auto;padding:48px 24px 28px;display:flex;justify-content:space-between;gap:24px;align-items:end}h1{font-size:32px;margin:0}header p{margin:8px 0 0;color:#666}button{border:1px solid #777;background:transparent;padding:10px 14px;cursor:pointer}#grid{max-width:1500px;margin:0 auto;padding:0 24px 72px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{min-height:220px;border:1px solid #999;background:#dfe0d9;padding:24px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.card:hover{border-color:#191917}.no,.section{font:12px ui-monospace,monospace;letter-spacing:.18em;color:#777}.card h2{font-size:22px;font-weight:500;line-height:1.45}.card p{font-size:14px;line-height:1.6;color:#666}#deck{position:fixed;inset:0;background:#111;display:none}#deck.on{display:block}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .18s}iframe.visible{opacity:1}#toolbar{position:absolute;right:24px;bottom:20px;z-index:5;display:flex;gap:8px;color:#fff}#toolbar button{border-color:#777;color:#ddd;background:#222c}#pager{padding:10px 12px;font:13px ui-monospace,monospace}@media(max-width:900px){#grid{grid-template-columns:1fr}}</style></head>
<body><header><div><h1>写好需求的思维框架</h1><p>13 页 · 点击任意页面进入放映</p></div><button id="accent">强调色：开</button></header><main id="grid"></main><section id="deck"><iframe id="a"></iframe><iframe id="b"></iframe><div id="toolbar"><button id="back">画板</button><button id="prev">←</button><span id="pager"></span><button id="next">→</button></div></section>
<script>const slides=[{"no": "01", "title": "写好需求，不是把解法写清楚，而是把决策做对", "takeaway": "先回答为什么和值不值得，再讨论怎么做。", "section": "先定义决策"}, {"no": "02", "title": "产品经理的核心工作，是高质量决策与价值再分配", "takeaway": "决策不等于每次都准确，但必须让价值与代价被看见。", "section": "先定义决策"}, {"no": "03", "title": "三道灵魂题先锁住人、问题与价值", "takeaway": "角色、用户需求和产品价值没有答清，后面的方案只是提前开工。", "section": "先定义决策"}, {"no": "04", "title": "四个问题把需求从模糊诉求推进到可执行决策", "takeaway": "问题、时机、价值、方案是一个连续判断链。", "section": "再建立证据"}, {"no": "05", "title": "体验类需求最怕越过分析，直接进入解决方案", "takeaway": "先用调研和数据把现象抽象成问题，再讨论方案。", "section": "再建立证据"}, {"no": "06", "title": "“为什么现在做”必须由证据、优先级与共识共同成立", "takeaway": "客观数据优先；没有客观数据时，要对问题边界与执行形成共识。", "section": "再建立证据"}, {"no": "07", "title": "价值评估不是一个数，而是一组分级、分类的观察面", "takeaway": "指标既要衡量结果，也要让 PM 在事前预判、事后反思。", "section": "再建立证据"}, {"no": "08", "title": "十二问覆盖事实、判断、替代方案与用户视角", "takeaway": "十二问不是逐项走形式，而是防止关键思考被漏掉。", "section": "再建立证据"}, {"no": "09", "title": "效率来自抓关键变量，而不是把每个细节都做满", "takeaway": "先找不超过三个最大挑战，再用一到两个关键判断和事实约束求平衡解。", "section": "最后落到执行"}, {"no": "10", "title": "需求设计要同时守住跨页面一致性与单页行动目标", "takeaway": "大场景负责上下文，小场景负责这一页让用户看见什么、做什么。", "section": "最后落到执行"}, {"no": "11", "title": "评审不是临场答题，而是面向陌生听众的证据组织", "takeaway": "预判问题、挑重点、练表达；证据不足时先研究再回答。", "section": "最后落到执行"}, {"no": "12", "title": "需求生命周期用多次评审，把判断逐步压实为可交付结果", "takeaway": "不值得现在做就进入需求池；值得做才沿 PRD、埋点、研发与回归推进。", "section": "最后落到执行"}, {"no": "13", "title": "需求文档与答辩都是证明题，不是事项清单", "takeaway": "用一到两个最有力案例，证明价值、难点、判断与贡献。", "section": "最后落到执行"}];let cur=0,accent=true,front=document.querySelector('#a'),back=document.querySelector('#b');const grid=document.querySelector('#grid'),deck=document.querySelector('#deck');slides.forEach((s,i)=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div><span class="no">${s.no}</span><span class="section"> · ${s.section}</span><h2>${s.title}</h2></div><p>${s.takeaway}</p>`;el.onclick=()=>enter(i);grid.appendChild(el)});function url(i){return `frames/shot-${slides[i].no}.html?ppt${accent?'&accent':''}`}async function ready(f){for(let i=0;i<160;i++){try{const d=f.contentDocument;if(d?.documentElement?.dataset.renderReady==='true'){if(d.fonts?.ready)await d.fonts.ready;return}}catch(e){}await new Promise(r=>setTimeout(r,50))}throw new Error('page ready timeout')}async function show(i){cur=Math.max(0,Math.min(slides.length-1,i));back.classList.remove('visible');back.src=url(cur);await ready(back);front.classList.remove('visible');back.classList.add('visible');[front,back]=[back,front];document.querySelector('#pager').textContent=`${cur+1} / ${slides.length}`;history.replaceState(null,'',`#${cur+1}`)}function enter(i){deck.classList.add('on');show(i)}function leave(){deck.classList.remove('on');history.replaceState(null,'',location.pathname)}document.querySelector('#prev').onclick=()=>show(cur-1);document.querySelector('#next').onclick=()=>show(cur+1);document.querySelector('#back').onclick=leave;document.querySelector('#accent').onclick=e=>{accent=!accent;e.target.textContent=`强调色：${accent?'开':'关'}`;if(deck.classList.contains('on'))show(cur)};addEventListener('keydown',e=>{if(!deck.classList.contains('on'))return;if(['ArrowRight',' ','PageDown'].includes(e.key))show(cur+1);if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1);if(e.key==='Escape')leave()});if(location.hash)enter(Math.max(0,parseInt(location.hash.slice(1),10)-1));</script></body></html>
