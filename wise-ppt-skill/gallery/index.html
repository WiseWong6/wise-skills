<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>纸墨线稿 · 版式画册（通用）</title>
<!--
  版式画册（gallery）—— wise-ppt-skill skill 的全部版式样张浏览壳
  · 左侧 MECE 族目录，中央等比缩放样张预览（iframe 载入 frames/layout-XX.html）
  · ←/→ 键、左右箭头按钮、目录点击切换
  · LAYOUTS 配置数组即画册目录，新增版式时在此登记
-->
<style>
  :root {
    --ink: #191917;
    --paper: #DFE0D9;
    --mono: 'Courier Prime', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Han Sans', 'Source Han Sans SC', 'Noto Sans SC', sans-serif;
    display: flex;
    overflow: hidden;
  }

  /* ---------- 左侧目录 ---------- */
  #side {
    width: 292px; flex-shrink: 0;
    border-right: 1px solid rgba(25,25,23,.35);
    display: flex; flex-direction: column;
    height: 100vh;
  }
  #side .brand {
    height: 76px; box-sizing: border-box;
    display: flex; align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid rgba(25,25,23,.35);
  }
  #side .brand .en {
    font-family: var(--mono); font-size: 12px; letter-spacing: .3em;
    color: rgba(25,25,23,.5);
  }
  #side .brand .cn {
    font-size: 24px; font-weight: 300; letter-spacing: .06em;
  }
  #side .brand .count {
    margin-top: 10px; font-family: var(--mono); font-size: 11px;
    letter-spacing: .22em; color: rgba(25,25,23,.5);
  }
  #toc { flex: 1; overflow-y: auto; padding: 12px 0 40px; }
  #toc .fam {
    padding: 18px 24px 6px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .26em;
    color: rgba(25,25,23,.45);
    text-transform: uppercase;
  }
  #toc .item {
    display: flex; align-items: baseline; gap: 10px;
    padding: 7px 24px;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  #toc .item .code {
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
    color: rgba(25,25,23,.55); width: 38px; flex-shrink: 0;
  }
  #toc .item .name { font-size: 15px; font-weight: 300; }
  #toc .item:hover { background: rgba(255,255,255,.22); }
  #toc .item.active {
    border-left-color: var(--ink);
    background: rgba(255,255,255,.22);
  }
  #toc .item.active .code { color: var(--ink); }
  #toc .item.active .name { font-weight: 400; }

  /* ---------- 主预览区 ---------- */
  #main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  #bar {
    height: 76px; box-sizing: border-box;
    display: flex; align-items: center; gap: 18px;
    padding: 0 36px;
    border-bottom: 1px solid rgba(25,25,23,.35);
  }
  #bar .code {
    font-family: var(--mono); font-size: 26px; letter-spacing: .12em;
  }
  #bar .name { font-size: 22px; font-weight: 400; letter-spacing: .04em; }
  #bar .use {
    flex: 1;
    font-size: 14px; font-weight: 300; color: rgba(25,25,23,.6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #bar .idx {
    font-family: var(--mono); font-size: 13px; letter-spacing: .2em;
    color: rgba(25,25,23,.55);
  }
  /* 强调色开关：高饱和点缀，不做底色填充 */
  #bar .acc-btn {
    margin-left: auto; align-self: center;
    font-family: var(--mono); font-size: 12px; letter-spacing: .2em;
    padding: 6px 14px;
    border: 1px solid rgba(25,25,23,.45);
    cursor: pointer; user-select: none;
    color: rgba(25,25,23,.7);
  }
  #bar .acc-btn:hover { border-color: var(--ink); color: var(--ink); }
  #bar .acc-btn.on {
    border-color: #002FA7; color: #002FA7;
  }

  #viewport { flex: 1; position: relative; overflow: hidden; }
  #stagebox {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  #stagebox iframe {
    width: 1920px; height: 1080px; border: 0; display: block;
    background: var(--paper);
  }
  /* 样张外框细线 */
  #frame-line {
    position: absolute; pointer-events: none;
    border: 1px solid rgba(25,25,23,.35);
  }

  /* 左右切换箭头：纯箭头，无边框无底色 */
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
    font-family: var(--mono); font-size: 28px;
    color: var(--ink); opacity: .5;
    user-select: none;
  }
  .nav:hover { opacity: 1; }
  #prev { left: 24px; }
  #next { right: 24px; }

  #foot {
    padding: 12px 36px;
    border-top: 1px solid rgba(25,25,23,.35);
    font-family: var(--mono); font-size: 11px; letter-spacing: .24em;
    color: rgba(25,25,23,.45);
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>

<div id="side">
  <div class="brand">
    <div class="cn">版式画册 · 通用</div>
  </div>
  <div id="toc"></div>
</div>

<div id="main">
  <div id="bar">
    <span class="code" id="b-code"></span>
    <span class="name" id="b-name"></span>
    <span class="use" id="b-use"></span>
    <span class="idx" id="b-idx"></span>
    <span class="acc-btn" id="acc-btn">强调色</span>
  </div>
  <div id="viewport">
    <div id="stagebox"><iframe id="fr" src="about:blank"></iframe></div>
    <div id="frame-line"></div>
    <div class="nav" id="prev">←</div>
    <div class="nav" id="next">→</div>
  </div>
  <div id="foot">
    <span>PAPER-INK-PPT SKILL — LAYOUT SPECIMENS</span>
    <span>← / → 切换</span>
  </div>
</div>

<script>

  {fam:'拆解', code:'F3', name:'分栏清单柱', file:'layout-f3.html', use:'并列陈列 3–5 个分类下的离散要点'},
  {fam:'拆解', code:'F4', name:'图标六宫格', file:'layout-f4.html', use:'3–6 个并列概念的最简陈列（兜底页型）'},
  /* —— G 放射：一物 → 多向/多维环绕 —— */

  {fam:'嵌套', code:'H2', name:'嵌套变焦框', file:'layout-h2.html', use:'同一对象的观察粒度逐层拉远（单轮⊂会话⊂过程⊂结果）'},

var cur = 0;

/* ---------- 目录（按族分组，族序 = 字母序 A→O；组内 code 连续） ---------- */
/* 族标题渲染为「字母 · 族名」（如 A · 证据），字母序即族序 */
var toc = document.getElementById('toc');
var seenFam = {};
LAYOUTS.forEach(function (l, i) {
  if (!seenFam[l.fam]) {
    seenFam[l.fam] = true;
    var h = document.createElement('div');
    h.className = 'fam';
    h.textContent = l.code[0] + ' · ' + l.fam;
    toc.appendChild(h);
  }
  var it = document.createElement('div');
  it.className = 'item'; it.dataset.i = i;
  it.innerHTML = '<span class="code">' + l.code + '</span><span class="name">' + l.name + '</span>';
  it.addEventListener('click', function () { go(i); });
  toc.appendChild(it);
});

/* ---------- 预览缩放 ---------- */
var viewport = document.getElementById('viewport');
var stagebox = document.getElementById('stagebox');
var frameLine = document.getElementById('frame-line');
function fit() {
  var vw = viewport.clientWidth - 140, vh = viewport.clientHeight - 60;
  var s = Math.min(vw / 1920, vh / 1080);
  var w = 1920 * s, h = 1080 * s;
  var x = (viewport.clientWidth - w) / 2, y = (viewport.clientHeight - h) / 2;
  stagebox.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  frameLine.style.left = (x - 1) + 'px'; frameLine.style.top = (y - 1) + 'px';
  frameLine.style.width = (w + 2) + 'px'; frameLine.style.height = (h + 2) + 'px';
}
window.addEventListener('resize', fit);

/* ---------- 强调色开关 ---------- */
var accentOn = false;
var accBtn = document.getElementById('acc-btn');
function applyAccent() {
  accBtn.classList.toggle('on', accentOn);
  accBtn.textContent = accentOn ? '强调色 ●' : '强调色';
  if (LAYOUTS.length) go(cur);
}
accBtn.addEventListener('click', function () {
  accentOn = !accentOn;
  applyAccent();
});

/* ---------- 切换 ---------- */
/* 当前版式同步进 URL hash（如 #A2），刷新自动停留、链接可直达 */
function codeToIndex(code) {
  if (!code) return -1;
  for (var i = 0; i < LAYOUTS.length; i++) if (LAYOUTS[i].code === code) return i;
  return -1;
}
function go(i, opts) {
  cur = (i + LAYOUTS.length) % LAYOUTS.length;
  var l = LAYOUTS[cur];
  document.getElementById('fr').src = 'frames/' + l.file + (accentOn ? '?accent=1' : '');
  document.getElementById('b-code').textContent = l.code;
  document.getElementById('b-name').textContent = l.name;
  document.getElementById('b-use').textContent = l.use || '';
  document.getElementById('b-idx').textContent =
    String(cur + 1).padStart(2, '0') + ' / ' + String(LAYOUTS.length).padStart(2, '0');
  var items = document.querySelectorAll('#toc .item');
  items.forEach(function (it) { it.classList.toggle('active', +it.dataset.i === cur); });
  var act = document.querySelector('#toc .item.active');
  if (act) act.scrollIntoView({ block: 'nearest' });
  /* 写入 hash（opts.silent 跳过，避免与 hashchange 互相触发） */
  if (!opts || !opts.silent) {
    var want = '#' + l.code;
    if (location.hash !== want) location.hash = want;
  }
}
/* 浏览器前进/后退或手动改地址栏 → 驱动切换 */
window.addEventListener('hashchange', function () {
  var i = codeToIndex(location.hash.slice(1));
  if (i >= 0 && i !== cur) go(i, { silent: true });
});
document.getElementById('prev').addEventListener('click', function () { go(cur - 1); });
document.getElementById('next').addEventListener('click', function () { go(cur + 1); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { go(cur - 1); e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { go(cur + 1); e.preventDefault(); }
});

fit();
/* 刷新时按 URL hash 停留在原位（如 index.html#A2），无 hash 则回第一页 */
if (LAYOUTS.length) {
  var startI = codeToIndex(location.hash.slice(1));
  go(startI >= 0 ? startI : 0);
}
</script>
</body>
