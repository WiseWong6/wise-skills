<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>layout-b35 · 阶梯爬升路径</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">PAPER-INK GALLERY — B35<br>ASCENDING STAIR PATH</div>
  <div class="folio">B35 / 59 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">五级台阶对应五个真实阶段，节点块挂在踏步侧边，一根平行粗箭头强化上升动势。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. B35 — ASCENDING STAIR PATH', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:540, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 主角：左下→右上的楼梯折线（五级，1.4px） ---------- */
el('path', {d:'M 220 820 H 560 V 690 H 900 V 560 H 1240 V 430 H 1580 V 300 H 1760',
  fill:'none', stroke:INK80, 'stroke-width':1.4});

/* ---------- 平行上升箭头（全页唯一强调线 2.2px，含开放式箭头） ---------- */
el('path', {d:'M 200 862 H 560 V 732 H 900 V 602 H 1240 V 472 H 1580 V 342 H 1740 L 1720 331 M 1740 342 L 1720 353',
  fill:'none', stroke:INK, 'stroke-width':2.2, opacity:.85});

/* ---------- 起点与终点套准 ---------- */
el('circle', {cx:220, cy:820, r:8, fill:'none', stroke:INK80, 'stroke-width':1.1});
el('circle', {cx:220, cy:820, r:2.4, fill:INK});
el('line', {x1:1768, y1:300, x2:1784, y2:300, stroke:INK, 'stroke-width':.8, opacity:.45});
el('line', {x1:1776, y1:292, x2:1776, y2:308, stroke:INK, 'stroke-width':.8, opacity:.45});

/* ---------- 踏步节点块（年份 + 事件 + 一行注，挂台阶侧边） ---------- */
var steps = [
  {x:250,  lx:286,  tread:820, ty:700, year:'2021', ev:'项目立项', note:'单机原型在试验仓跑通'},
  {x:590,  lx:626,  tread:690, ty:570, year:'2022', ev:'首仓试点', note:'华东保税仓 12 台上线'},
  {x:930,  lx:966,  tread:560, ty:440, year:'2023', ev:'调度引擎', note:'多机路径规划 V2 发布'},
  {x:1270, lx:1306, tread:430, ty:310, year:'2024', ev:'跨仓组网', note:'三仓协同 · 统一调度'},
  {x:1608, lx:1644, tread:300, ty:186, year:'2025', ev:'平台开放', note:'开放 API · 百仓互联'}
];
steps.forEach(function(s){
  /* 踏步落点 + 短引线 */
  el('circle', {cx:s.lx, cy:s.tread, r:5, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1});
  el('circle', {cx:s.lx, cy:s.tread, r:1.8, fill:INK});
  el('line', {x1:s.lx, y1:s.tread-6, x2:s.lx, y2:s.ty+78, stroke:INK, 'stroke-width':.7, opacity:.45});
  /* 文字块 */
  txt(s.x, s.ty, s.year, {'font-family':MONO, 'font-size':20, 'letter-spacing':2, fill:INK});
  el('line', {x1:s.x, y1:s.ty+12, x2:s.x+58, y2:s.ty+12, stroke:INK, 'stroke-width':.6, opacity:.3});
  txt(s.x, s.ty+44, s.ev, {'font-family':SANS, 'font-weight':400, 'font-size':26, fill:INK});
  txt(s.x, s.ty+72, s.note, {'font-family':SANS, 'font-weight':300, 'font-size':17, fill:INK70});
});

/* ---------- 右下空白区：竖向高度标注（构造件） ---------- */
el('line', {x1:1830, y1:340, x2:1830, y2:820, stroke:INK, 'stroke-width':.5, opacity:.3, 'stroke-dasharray':'2 6'});
el('line', {x1:1822, y1:340, x2:1838, y2:340, stroke:INK, 'stroke-width':.7, opacity:.4});
el('line', {x1:1822, y1:820, x2:1838, y2:820, stroke:INK, 'stroke-width':.7, opacity:.4});
el('text', {x:1856, y:586, 'font-family':MONO, 'font-size':12, 'letter-spacing':2, fill:INK45,
  transform:'rotate(90 1856 586)'}).textContent = 'Δ STAGE × 5';

stageFit();
</script>
</body>
</html>
