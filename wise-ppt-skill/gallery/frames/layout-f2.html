<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>layout-f2 · 环节树 + 规格单</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">PAPER-INK GALLERY — F2<br>PROCESS TREE + FIELD SPEC</div>
  <div class="folio">F2 / 59 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#191917" stroke-width="0.7" opacity="0.35"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">左区一棵环节树讲清过程结构，右区一张规格单讲清每个环节记什么。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(180, 196, 'FIG. F2 — PROCESS TREE + FIELD SPEC', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:'rgba(25,25,23,.45)'});
el('line', {x1:180, y1:212, x2:500, y2:212, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ============ 左区：一次任务下发的环节树 ============ */
var RX = 180, RY = 250, RW = 640, RH = 64;
el('rect', {x:RX, y:RY, width:RW, height:RH, fill:'url(#hatch)', stroke:INK80, 'stroke-width':1.4});
txt(RX+RW/2-96, RY+40, 'TASK RUN', {'font-family':MONO, 'font-size':22, 'text-anchor':'middle', fill:INK});
txt(RX+RW/2-30, RY+40, '一次任务下发', {'font-family':SANS, 'font-weight':300, 'font-size':20, fill:INK});

var spans = [
  {t:'订单接入', m:'RECV · CHECK'},
  {t:'任务拆解', m:'SPLIT ×36'},
  {t:'路径规划', m:'A* · HEATMAP'},
  {t:'车辆派单', m:'BID · SCORE'},
  {t:'执行跟踪', m:'POSE · ETA'},
  {t:'回库结算', m:'DONE · LOG'}
];
var SY = 346, SH = 48, SGAP = 16, SX = 260, SW = 560;
var ticks = ['4MS', '18MS', '42MS', '9MS', '310MS', '26MS'];
spans.forEach(function(sp, i){
  var y = SY + i * (SH + SGAP);
  /* 竖干连接线 + 落点圆点 */
  el('line', {x1:RX+40, y1:RY+RH, x2:RX+40, y2:y+SH/2, stroke:INK, 'stroke-width':.8, opacity:.55});
  el('line', {x1:RX+40, y1:y+SH/2, x2:SX, y2:y+SH/2, stroke:INK, 'stroke-width':.8, opacity:.55});
  el('circle', {cx:RX+40, cy:y+SH/2, r:2.4, fill:INK, opacity:.7});
  /* 双线环节框 */
  el('rect', {x:SX, y:y, width:SW, height:SH, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:SX+4, y:y+4, width:SW-8, height:SH-8, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4});
  txt(SX+22, y+SH/2+8, sp.t, {'font-family':SANS, 'font-weight':300, 'font-size':21, fill:INK});
  txt(SX+SW-18, y+SH/2+6, sp.m, {'font-family':MONO, 'font-size':14, 'text-anchor':'end', fill:'rgba(25,25,23,.5)'});
  /* 右侧耗时刻度 */
  txt(SX+SW+26, y+SH/2+6, ticks[i], {'font-family':MONO, 'font-size':14, fill:'rgba(25,25,23,.5)'});
});
/* 尾部虚线输出框 */
var OY = SY + spans.length * (SH + SGAP) + 6;
el('line', {x1:RX+40, y1:OY-6, x2:RX+40, y2:OY+22, stroke:INK, 'stroke-width':.8, opacity:.55});
el('line', {x1:RX+40, y1:OY+22, x2:SX, y2:OY+22, stroke:INK, 'stroke-width':.8, opacity:.55});
el('rect', {x:SX, y:OY-8, width:SW, height:60, fill:'none', stroke:INK80, 'stroke-width':1.2, 'stroke-dasharray':'7 5'});
txt(SX+22, OY+30, '任务完成', {'font-family':SANS, 'font-weight':300, 'font-size':21, fill:INK});
txt(SX+SW-18, OY+26, 'OUTPUT', {'font-family':MONO, 'font-size':14, 'text-anchor':'end', fill:'rgba(25,25,23,.5)'});

/* ============ 右区：字段规格单 ============ */
var CX = 1130, CW = 620, CY0 = 250, CH = 620;
el('rect', {x:CX, y:CY0, width:CW, height:CH, fill:'none', stroke:INK80, 'stroke-width':1.2});
el('rect', {x:CX+5, y:CY0+5, width:CW-10, height:CH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4});
txt(CX+30, CY0+48, '每个环节的核心要素', {'font-family':SANS, 'font-weight':300, 'font-size':21, fill:INK});
el('line', {x1:CX+30, y1:CY0+66, x2:CX+CW-30, y2:CY0+66, stroke:INK, 'stroke-width':.8, opacity:.5});

var fields = [
  ['TASK_ID',  '任务编号与来源单号'],
  ['ROBOT',    '指派的机器人与工位'],
  ['PATH',     '规划路径与途经库位'],
  ['ETA',      '预计到达与完成时刻'],
  ['BATTERY',  '取放全程电量预算'],
  ['HANDOVER', '交接与人工确认点']
];
fields.forEach(function(f, i){
  var y = CY0 + 104 + i * 70;
  txt(CX+30, y, f[0], {'font-family':MONO, 'font-size':19, fill:INK});
  txt(CX+200, y, f[1], {'font-family':SANS, 'font-weight':300, 'font-size':21, fill:'rgba(25,25,23,.7)'});
  if (i < fields.length-1) el('line', {x1:CX+30, y1:y+24, x2:CX+CW-30, y2:y+24, stroke:INK, 'stroke-width':.6, opacity:.25});
});
/* 异常行（虚线框单独强调） */
var ey = CY0 + 104 + 6 * 70;
el('rect', {x:CX+20, y:ey-30, width:CW-40, height:46, fill:'none', stroke:INK, 'stroke-width':1, 'stroke-dasharray':'5 4'});
txt(CX+30, ey, 'ALARM', {'font-family':MONO, 'font-size':19, fill:INK});
txt(CX+200, ey, '阻塞与异常（自动上报）', {'font-family':SANS, 'font-weight':300, 'font-size':21, fill:INK});

stageFit();
</script>
</body>
</html>
