<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>layout-e4 · 前后对比行矩阵 + KPI 底带</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">PAPER-INK GALLERY — E4<br>BEFORE-AFTER ROWS + KPI STRIP</div>
  <div class="folio">E4 / 59 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#191917" stroke-width="0.7" opacity="0.35"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">前后对比行矩阵让旧流程与新流程逐列对位——上灰下实，每列一根下行箭头，底部 KPI 带收一行总账。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK45 = 'rgba(25,25,23,.45)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = '#C0392B';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function elp(P, tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  P.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans', SERIF = 'Han Serif';

/* ---------- FIG 图题 ---------- */
txt(304, 176, 'FIG. E4 — BEFORE-AFTER MATRIX + KPI', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:304, y1:192, x2:664, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ============ 列骨架：4 个环节 ============ */
/* 4 列整体几何中心 = 960 = 页面中线，整块矩阵水平居中 */
var COLS = [
  {x:534,  en:'INTAKE',  cn:'接单', oldV:'AVG 0.4 S', newV:'API 0.4 S'},
  {x:874,  en:'ASSIGN',  cn:'派单', oldV:'AVG 12 MIN', newV:'ALGO 0.8 S'},
  {x:1214, en:'PICK',    cn:'取货', oldV:'AVG 9 MIN',  newV:'AMR 3 MIN'},
  {x:1554, en:'DELIVER', cn:'送站', oldV:'AVG 7 MIN',  newV:'LINE 7 MIN'}
];
COLS.forEach(function(c, i){
  txt(c.x, 232, '0' + (i+1) + ' · ' + c.en, {'font-family':MONO, 'font-size':14, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
  txt(c.x, 262, c.cn, {'font-family':SANS, 'font-weight':300, 'font-size':24, 'text-anchor':'middle', fill:INK});
  /* 列向虚线栅格（矩阵感） */
  el('line', {x1:c.x, y1:280, x2:c.x, y2:730, stroke:INK, 'stroke-width':.5, opacity:.16, 'stroke-dasharray':'2 6'});
});

/* 行标签 + 行分隔虚线（中心 x=960，与 KPI 带 200-1720 中心对齐） */
el('line', {x1:334, y1:465, x2:1754, y2:465, stroke:INK, 'stroke-width':.6, opacity:.25, 'stroke-dasharray':'3 6'});
el('line', {x1:334, y1:725, x2:1754, y2:725, stroke:INK, 'stroke-width':.6, opacity:.25, 'stroke-dasharray':'3 6'});
txt(344, 344, 'BEFORE', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, 'text-anchor':'end', fill:'rgba(25,25,23,.5)'});
txt(344, 372, '人工排班', {'font-family':SANS, 'font-weight':300, 'font-size':18, 'text-anchor':'end', fill:'rgba(25,25,23,.5)'});
txt(344, 604, 'AFTER', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, 'text-anchor':'end', fill:INK});
txt(344, 632, '衡玑调度', {'font-family':SANS, 'font-weight':300, 'font-size':18, 'text-anchor':'end', fill:INK});

/* ============ 前行（灰阶虚线）：人工链路四态 ============ */
var GOLD = elp(G, 'g', {opacity:.45});
/* 01 接单：手写单据纸 */
elp(GOLD, 'rect', {x:490, y:318, width:88, height:106, fill:'none', stroke:INK, 'stroke-width':1.1, 'stroke-dasharray':'4 4'});
elp(GOLD, 'path', {d:'M 494 318 L 494 340 L 472 340', fill:'none', stroke:INK, 'stroke-width':.9, 'stroke-dasharray':'3 3'});
[342, 364, 386].forEach(function(yy){
  elp(GOLD, 'line', {x1:502, y1:yy, x2:566, y2:yy, stroke:INK, 'stroke-width':.8, 'stroke-dasharray':'3 3'});
});
elp(GOLD, 'path', {d:'M 420 410 q 14 -12 24 0 q 10 10 26 -4', fill:'none', stroke:INK, 'stroke-width':1, 'stroke-dasharray':'3 3'});
/* 02 派单：对讲机 */
elp(GOLD, 'rect', {x:850, y:330, width:48, height:94, rx:92, fill:'none', stroke:INK, 'stroke-width':1.1, 'stroke-dasharray':'4 4'});
elp(GOLD, 'line', {x1:860, y1:330, x2:842, y2:288, stroke:INK, 'stroke-width':1, 'stroke-dasharray':'3 3'});
elp(GOLD, 'rect', {x:858, y:342, width:32, height:15, fill:'none', stroke:INK, 'stroke-width':.8, 'stroke-dasharray':'2 3'});
[378, 392, 406].forEach(function(yy){
  elp(GOLD, 'circle', {cx:958, cy:yy, r:2.6, fill:'none', stroke:INK, 'stroke-width':.8});
});
/* 03 取货：步行折线（虚） */
elp(GOLD, 'polyline', {points:'1070,418 1096,378 1122,412 1148,372 1174,406 1196,368',
  fill:'none', stroke:INK, 'stroke-width':1.2, 'stroke-dasharray':'5 5'});
[[1070,418],[1096,378],[1122,412],[1148,372],[1174,406],[1196,368]].forEach(function(p){
  elp(GOLD, 'circle', {cx:p[0], cy:p[1], r:3, fill:'none', stroke:INK, 'stroke-width':.9});
});
elp(GOLD, 'rect', {x:1264, y:330, width:34, height:26, fill:'none', stroke:INK, 'stroke-width':.9, 'stroke-dasharray':'3 3'});
/* 04 送站：等待时钟 */
elp(GOLD, 'circle', {cx:1638, cy:376, r:42, fill:'none', stroke:INK, 'stroke-width':1.1, 'stroke-dasharray':'4 4'});
for (var a = 0; a < 12; a++) {
  var rad = a * Math.PI / 6;
  elp(GOLD, 'line', {x1:1554 + Math.sin(rad)*36, y1:376 - Math.cos(rad)*36,
    x2:1554 + Math.sin(rad)*40, y2:376 - Math.cos(rad)*40, stroke:INK, 'stroke-width':.8});
}
elp(GOLD, 'line', {x1:1554, y1:376, x2:1536, y2:356, stroke:INK, 'stroke-width':1.2});
elp(GOLD, 'line', {x1:1554, y1:376, x2:1572, y2:366, stroke:INK, 'stroke-width':1});
elp(GOLD, 'circle', {cx:1638, cy:376, r:2.6, fill:INK});

/* 前行字段行 */
COLS.forEach(function(c){
  txt(c.x, 448, c.oldV, {'font-family':MONO, 'font-size':13, 'letter-spacing':1, 'text-anchor':'middle', fill:'rgba(25,25,23,.45)'});
});

/* ============ 列间下行箭头（前 → 新） ============ */
COLS.forEach(function(c){
  el('line', {x1:c.x, y1:482, x2:c.x, y2:520, stroke:INK80, 'stroke-width':1.1});
  el('line', {x1:c.x-7, y1:511, x2:c.x, y2:521, stroke:INK80, 'stroke-width':1.1});
  el('line', {x1:c.x+7, y1:511, x2:c.x, y2:521, stroke:INK80, 'stroke-width':1.1});
});

/* ============ 新行（全墨实线）：衡玑调度链路四态 ============ */
/* 01 接单：系统对接插头 */
el('rect', {x:486, y:592, width:38, height:34, fill:'none', stroke:INK80, 'stroke-width':1.2});
el('rect', {x:546, y:592, width:38, height:34, fill:'none', stroke:INK80, 'stroke-width':1.2});
[602, 610, 618].forEach(function(yy){
  el('line', {x1:524, y1:yy, x2:536, y2:yy, stroke:INK80, 'stroke-width':1.1});
  el('circle', {cx:625, cy:yy, r:2, fill:'none', stroke:INK, 'stroke-width':.8});
});
el('line', {x1:486, y1:576, x2:584, y2:576, stroke:INK, 'stroke-width':.6, opacity:.4, 'stroke-dasharray':'2 4'});
txt(535, 570, 'WMS-API', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
/* 02 派单：算法芯片 */
el('rect', {x:839, y:570, width:70, height:70, fill:'none', stroke:INK80, 'stroke-width':1.3});
el('rect', {x:855, y:586, width:38, height:38, fill:'none', stroke:INK, 'stroke-width':.7, opacity:.5});
[-12, 0, 12].forEach(function(d){
  el('line', {x1:874+d, y1:570, x2:874+d, y2:560, stroke:INK, 'stroke-width':1, opacity:.7});
  el('line', {x1:874+d, y1:640, x2:874+d, y2:650, stroke:INK, 'stroke-width':1, opacity:.7});
  el('line', {x1:839, y1:605+d, x2:829, y2:605+d, stroke:INK, 'stroke-width':1, opacity:.7});
  el('line', {x1:909, y1:605+d, x2:919, y2:605+d, stroke:INK, 'stroke-width':1, opacity:.7});
});
txt(874, 612, 'ALGO', {'font-family':MONO, 'font-size':13, 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
/* 03 取货：机器人平滑搬运路径 */
el('path', {d:'M 1060 640 C 1100 556, 1160 556, 1200 640', fill:'none', stroke:INK80, 'stroke-width':1.4});
el('circle', {cx:1228, cy:640, r:6, fill:'none', stroke:INK80, 'stroke-width':1.1});
el('circle', {cx:1228, cy:640, r:2, fill:INK});
el('circle', {cx:1368, cy:640, r:6, fill:'none', stroke:INK80, 'stroke-width':1.1});
el('circle', {cx:1368, cy:640, r:2, fill:INK});
el('rect', {x:1200, y:570, width:28, height:19, fill:'url(#hatch)', stroke:INK, 'stroke-width':.9});
el('line', {x1:1214, y1:589, x2:1214, y2:600, stroke:INK, 'stroke-width':.8, opacity:.6});
/* 04 送站：输送闸口直送 + 符号笔触 ✓ */
el('line', {x1:1524, y1:566, x2:1524, y2:650, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:1584, y1:566, x2:1584, y2:650, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:1516, y1:566, x2:1592, y2:566, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:1500, y1:622, x2:1596, y2:622, stroke:INK, 'stroke-width':1.1, opacity:.8});
el('line', {x1:1586, y1:614, x2:1596, y2:622, stroke:INK, 'stroke-width':1.1, opacity:.8});
el('line', {x1:1586, y1:630, x2:1596, y2:622, stroke:INK, 'stroke-width':1.1, opacity:.8});
el('line', {x1:1504, y1:650, x2:1604, y2:650, stroke:INK, 'stroke-width':.9, opacity:.5});
el('path', {d:'M 1456 538 L 1467 549 L 1488 526', fill:'none', stroke:INK, 'stroke-width':3, 'stroke-linecap':'round'});

/* 新行字段行 */
COLS.forEach(function(c){
  txt(c.x, 700, c.newV, {'font-family':MONO, 'font-size':13, 'letter-spacing':1, 'text-anchor':'middle', fill:'rgba(25,25,23,.7)'});
});

/* ============ 底部 KPI 通栏带（总账三数） ============ */
el('line', {x1:200, y1:786, x2:1720, y2:786, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:200, y1:874, x2:1720, y2:874, stroke:INK, 'stroke-width':.6, opacity:.3});
el('line', {x1:192, y1:786, x2:208, y2:786, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:1712, y1:786, x2:1728, y2:786, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:820, y1:794, x2:820, y2:866, stroke:INK, 'stroke-width':.6, opacity:.3});
el('line', {x1:1360, y1:794, x2:1360, y2:866, stroke:INK, 'stroke-width':.6, opacity:.3});

function kpi(nx, num, label, note) {
  /* KPI 三个数字是本页总账焦点 → accent 模式下数字染番茄红，标签/注释保持墨色 */
  var nc = ACCENT ? RED : INK;
  txt(nx, 852, num, {'font-family':SERIF, 'font-size':58, 'text-anchor':'end', fill:nc});
  txt(nx + 24, 832, label, {'font-family':SANS, 'font-weight':300, 'font-size':20, fill:'rgba(25,25,23,.8)'});
  txt(nx + 24, 858, note, {'font-family':MONO, 'font-size':12, 'letter-spacing':2, fill:INK45});
}
kpi(520,  '-42%', '履约时长', 'CYCLE TIME');
kpi(1080, '×2.3',  '人均单量', 'THROUGHPUT');
kpi(1540, '0.3%',  '错单率',   'ERROR RATE');

stageFit();
</script>
</body>
</html>
