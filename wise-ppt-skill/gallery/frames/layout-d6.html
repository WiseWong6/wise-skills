<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>layout-d6 · 联络尾页</title>
<!--
  纸墨线稿样张 · C7 联络尾页
  衡玑科技「仓储机器人调度平台」产品汇报 · 商务收尾
  版式纪律（layouts C7）：左地图线稿 + 三行联系文字，右名片双线卡；约 6:4；二维码只做矩阵暗示
-->
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: rgba(25,25,23,.45); }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: #191917;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">PAPER-INK GALLERY — D6<br>CONTACT CLOSING</div>
  <div class="folio">D6 / 59 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">联络尾页用地图与名片完成商务收口。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ================= 左块：地图线稿 x150–920, y220–640 ================= */
/* 构造虚线边框（测绘图纸感） */
el('rect', {x:150, y:220, width:770, height:420, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 6'});
/* 四角套准十字 */
[[150,220],[920,220],[150,640],[920,640]].forEach(function(p){
  el('line', {x1:p[0]-8, y1:p[1], x2:p[0]+8, y2:p[1], stroke:INK, 'stroke-width':.7, opacity:.35});
  el('line', {x1:p[0], y1:p[1]-8, x2:p[0], y2:p[1]+8, stroke:INK, 'stroke-width':.7, opacity:.35});
});

/* 河：右下斜穿的贝塞尔双细线 */
el('path', {d:'M 700 220 C 760 320, 700 420, 800 500 C 850 540, 880 600, 870 640', fill:'none', stroke:INK, 'stroke-width':.9, opacity:.5});
el('path', {d:'M 726 220 C 786 320, 726 420, 826 500 C 876 540, 906 600, 896 640', fill:'none', stroke:INK, 'stroke-width':.9, opacity:.5});
txt(846, 336, 'WENLAN RIVER', {'font-family':MONO, 'font-size':11, 'letter-spacing':2, fill:'rgba(25,25,23,.45)', transform:'rotate(74 846 336)'});

/* 横向路网（主干道 1.2px，次道 .7px） */
el('path', {d:'M 150 310 C 360 296, 640 324, 920 306', fill:'none', stroke:INK80, 'stroke-width':1.2});
el('path', {d:'M 150 452 C 400 444, 660 460, 920 448', fill:'none', stroke:INK, 'stroke-width':.7, opacity:.6});
el('path', {d:'M 150 570 C 380 580, 660 562, 920 574', fill:'none', stroke:INK, 'stroke-width':.7, opacity:.6});
/* 纵向路网 */
el('path', {d:'M 330 220 C 324 360, 336 500, 328 640', fill:'none', stroke:INK, 'stroke-width':.7, opacity:.6});
el('path', {d:'M 560 220 C 566 340, 554 520, 562 640', fill:'none', stroke:INK80, 'stroke-width':1.2});

/* 街区名 */
txt(196, 290, 'HUITU AVE', {'font-family':MONO, 'font-size':11, 'letter-spacing':2, fill:'rgba(25,25,23,.45)'});
txt(576, 252, 'YUNGU RD', {'font-family':MONO, 'font-size':11, 'letter-spacing':2, fill:'rgba(25,25,23,.45)', transform:'rotate(88 576 252)'});

/* 园区块：双线框 + hatch 角 */
el('rect', {x:380, y:346, width:150, height:92, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':.9, opacity:.85});
el('rect', {x:385, y:351, width:140, height:82, fill:'none', stroke:INK, 'stroke-width':.5, opacity:.3});
txt(455, 396, 'HENGJI', {'font-family':MONO, 'font-size':12, 'letter-spacing':3, 'text-anchor':'middle', fill:INK, opacity:.7});
txt(455, 416, 'CENTER', {'font-family':MONO, 'font-size':12, 'letter-spacing':3, 'text-anchor':'middle', fill:INK, opacity:.7});

/* 定位钉：双圈 + 钉尖 */
el('circle', {cx:560, cy:452, r:10, fill:'none', stroke:INK, 'stroke-width':1.2});
el('circle', {cx:560, cy:452, r:14, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4});
el('circle', {cx:560, cy:452, r:3, fill:INK});
el('path', {d:'M 560 466 L 560 500', stroke:INK, 'stroke-width':.8, opacity:.5});
el('path', {d:'M 560 500 L 596 500', stroke:INK, 'stroke-width':.8, opacity:.5});
txt(604, 505, 'HQ · GATE 3', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, fill:INK, opacity:.75});

/* 比例尺 */
el('line', {x1:180, y1:616, x2:280, y2:616, stroke:INK, 'stroke-width':1, opacity:.6});
el('line', {x1:180, y1:610, x2:180, y2:622, stroke:INK, 'stroke-width':1, opacity:.6});
el('line', {x1:280, y1:610, x2:280, y2:622, stroke:INK, 'stroke-width':1, opacity:.6});
txt(292, 620, '500 M', {'font-family':MONO, 'font-size':11, 'letter-spacing':2, fill:'rgba(25,25,23,.45)'});

/* ================= 左块下方：三行联系文字 ================= */
var contact = [
  ['商务合作', 'bd@hengji.tech · 工作日 9:00 – 18:00'],
  ['客户支持', 'support@hengji.tech · 400-8120-660'],
  ['总部地址', '上海市杨浦区云谷路 88 号衡玑中心 A 座 12F']
];
contact.forEach(function(c, i){
  var y = 726 + i * 52;
  el('circle', {cx:158, cy:y-6, r:3, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.7});
  el('circle', {cx:158, cy:y-6, r:1, fill:INK});
  txt(178, y, c[0], {'font-family':SANS, 'font-weight':300, 'font-size':18, fill:INK});
  txt(292, y, c[1], {'font-family':SANS, 'font-weight':300, 'font-size':18, fill:'rgba(25,25,23,.75)'});
});

/* ================= 右块：名片双线卡 x1100–1720, y200–860 ================= */
var KX = 1100, KY = 200, KW = 620, KH = 660;
el('rect', {x:KX, y:KY, width:KW, height:KH, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3});
el('rect', {x:KX+5, y:KY+5, width:KW-10, height:KH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});

/* 卡头 */
txt(KX+44, KY+64, 'HENGJI TECH — BD OFFICE', {'font-family':MONO, 'font-size':14, 'letter-spacing':3, fill:'rgba(25,25,23,.5)'});
el('line', {x1:KX+44, y1:KY+84, x2:KX+200, y2:KY+84, stroke:INK, 'stroke-width':.8, opacity:.5});

/* 姓名 + 职务 */
txt(KX+44, KY+156, '沈昭远', {'font-family':SANS, 'font-weight':300, 'font-size':38, fill:INK});
txt(KX+46, KY+196, 'SHEN ZHAOYUAN · BD DIRECTOR', {'font-family':MONO, 'font-size':14, 'letter-spacing':2, fill:'rgba(25,25,23,.6)'});
el('line', {x1:KX+44, y1:KY+232, x2:KX+KW-44, y2:KY+232, stroke:INK, 'stroke-width':.8, opacity:.4});

/* 电话 / 邮箱 / 网址行 */
var lines = [
  ['TEL',   '+86 138-0166-8800'],
  ['MAIL',  'zhaoyuan.shen@hengji.tech'],
  ['WEB',   'www.hengji.tech'],
  ['ADDR',  'YUNGU RD 88, SHANGHAI']
];
lines.forEach(function(L, i){
  var y = KY + 292 + i * 62;
  txt(KX+44, y, L[0], {'font-family':MONO, 'font-size':13, 'letter-spacing':3, fill:'rgba(25,25,23,.5)'});
  txt(KX+150, y, L[1], {'font-family':MONO, 'font-size':17, 'letter-spacing':1, fill:INK});
  if (i < lines.length-1)
    el('line', {x1:KX+44, y1:y+22, x2:KX+KW-44, y2:y+22, stroke:INK, 'stroke-width':.6, opacity:.18});
});

/* 线稿二维码位（方块矩阵暗示，不画真码） */
var QX = KX + KW - 190, QY = KY + KH - 190, CS = 6.4;
el('rect', {x:QX-14, y:QY-14, width:21*CS+28, height:21*CS+28, fill:'none', stroke:INK, 'stroke-width':.7, opacity:.4});
for (var qi = 0; qi < 21; qi++) {
  for (var qj = 0; qj < 21; qj++) {
    /* 三个角定位块 + 伪随机数据点 */
    var corner = (qi < 7 && qj < 7) || (qi > 13 && qj < 7) || (qi < 7 && qj > 13);
    var on;
    if (corner) {
      var li = qi < 7 ? qi : qi - 14, lj = qj < 7 ? qj : qj - 14;
      on = (li === 0 || li === 6 || lj === 0 || lj === 6) || (li >= 2 && li <= 4 && lj >= 2 && lj <= 4);
    } else {
      on = ((qi * 7 + qj * 13 + 5) % 9) < 3;
    }
    if (on) el('rect', {x:QX + qj*CS, y:QY + qi*CS, width:CS-.9, height:CS-.9, fill:INK, opacity:.8});
  }
}
txt(QX-14, QY + 21*CS + 44, 'SCAN · WECHAT', {'font-family':MONO, 'font-size':11, 'letter-spacing':2.5, fill:'rgba(25,25,23,.45)'});

/* 卡内左下：一行中文小注 */
txt(KX+44, KY+KH-96, '预约拜访请提前一个工作日邮件确认。', {'font-family':SANS, 'font-weight':300, 'font-size':17, fill:'rgba(25,25,23,.7)'});
txt(KX+44, KY+KH-62, 'VISITS BY APPOINTMENT', {'font-family':MONO, 'font-size':11, 'letter-spacing':2.5, fill:'rgba(25,25,23,.45)'});

stageFit();
</script>
</body>
</html>
