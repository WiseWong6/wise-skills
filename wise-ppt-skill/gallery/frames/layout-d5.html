<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>layout-d5 · 章节隔页</title>
<!--
  纸墨线稿样张 · C6 章节隔页
  虚构主题：衡玑科技「仓储机器人调度平台」产品汇报 · 第三章
  版式纪律（layouts C6）：超大空心编号 + 章节名 + mono 导语 + 一处十字准星；元素 ≤4；留白 >60%；无 FIG、无 caption
-->
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: rgba(25,25,23,.45); }
  .chapter {
    position: absolute; left: 1000px; top: 512px;
    font-family: var(--serif); font-weight: 400;
    font-size: 72px; letter-spacing: .1em;
    color: #191917;
    z-index: 5;
  }
  .lead {
    position: absolute; left: 1004px; top: 636px;
    font-family: var(--mono); font-weight: 400;
    font-size: 14px; letter-spacing: .3em;
    color: rgba(25,25,23,.5);
    text-transform: uppercase;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">PAPER-INK GALLERY — D5<br>CHAPTER DIVIDER</div>
  <div class="folio">D5 / 59 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="chapter">调度引擎</div>
  <div class="lead">Chapter 03 — How Orders Become Routes</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime';

/* ===== ① 超大空心章节编号（描边不填，测绘感） ===== */
var t = txt(560, 688, '03', {'font-family':MONO, 'font-size':300, fill:'none', stroke:INK, 'stroke-width':1.2, opacity:.5});

/* ===== ② 十字准星（唯一装饰，右上空区） ===== */
el('line', {x1:1382, y1:300, x2:1418, y2:300, stroke:INK, 'stroke-width':.8, opacity:.4});
el('line', {x1:1400, y1:282, x2:1400, y2:318, stroke:INK, 'stroke-width':.8, opacity:.4});
el('circle', {cx:1400, cy:300, r:26, fill:'none', stroke:INK, 'stroke-width':.5, opacity:.25});

stageFit();
</script>
</body>
</html>
