<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>layout-c0 · 封面</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

  /* 左侧落版文字块 */
  .kicker {
    position: absolute; left: 300px; top: 330px;
    font-family: var(--mono); font-size: 14px;
    letter-spacing: .3em; color: var(--ink-45);
    z-index: 2;
  }
  .title {
    position: absolute; left: 294px; top: 372px;
    font-family: var(--serif); font-weight: 400;
    font-size: 96px; letter-spacing: .06em;
    color: var(--ink); z-index: 2;
  }
  .title-bar {
    position: absolute; left: 302px; top: 528px;
    width: 72px; height: 0;
    border-top: 2px solid var(--ink);
    z-index: 2;
  }
  .subtitle {
    position: absolute; left: 300px; top: 564px;
    font-family: var(--sans); font-weight: 400;
    font-size: 26px; letter-spacing: .1em;
    color: var(--ink-70); z-index: 2;
  }
  /* 主角判定：封面标题"仓序"是全页焦点 → 标题整词 + 下划线 bar 一起染色，形成落版焦点；右侧仓库线稿（图形）保持墨黑，不上彩 */
  :root.accent .title { color: var(--accent-red); }
  :root.accent .title-bar { border-top-color: var(--accent-red); }

  /* 右下 mono 元数据块 */
  .meta {
    position: absolute; right: 200px; bottom: 120px;
    font-family: var(--mono); font-size: 13px;
    letter-spacing: .3em; line-height: 2.3;
    color: var(--ink-45); text-align: left;
    z-index: 2; white-space: pre;
  }
  .meta b { font-weight: 400; color: var(--ink-70); }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">PAPER-INK GALLERY — C0<br>COVER</div>
  <div class="folio">C0 / 59 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="kicker">HENGJI TECH — WAREHOUSE ROBOT DISPATCH</div>
  <div class="title">仓序</div>
  <div class="title-bar"></div>
  <div class="subtitle">仓储机器人调度平台 · 产品汇报</div>

  <div class="meta"><b>AUTHOR</b> — SHEN WANGSHU
<b>DATE</b> — 2026.08.06
<b>VERSION</b> — V2.4.1
<b>KEYWORDS</b> — AMR / DISPATCH / SLOT</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK80 = 'rgba(25,25,23,.8)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime';

/* ===== 右侧极细线稿小图：仓库俯视（货区 / 货架 / 路径 / 一台机器人） ===== */
(function(){
  var X = 1330, Y = 316, W = 330, H = 216;

  // 仓区边界：虚线容器（责任域）
  el('rect', {x:X, y:Y, width:W, height:H, fill:'none',
    stroke:INK80, 'stroke-width':.7, opacity:.45, 'stroke-dasharray':'3 5'});
  // 四角十字套准
  [[X,Y],[X+W,Y],[X,Y+H],[X+W,Y+H]].forEach(function(c){
    el('line', {x1:c[0]-6, y1:c[1], x2:c[0]+6, y2:c[1], stroke:INK80, 'stroke-width':.6, opacity:.4});
    el('line', {x1:c[0], y1:c[1]-6, x2:c[0], y2:c[1]+6, stroke:INK80, 'stroke-width':.6, opacity:.4});
  });

  // 三排货架：上排双短列、中排长列、下排长短错落（形态随语义，不做同构阵列）
  function rack(x, y, w) {
    el('rect', {x:x, y:y, width:w, height:26, fill:'none',
      stroke:INK80, 'stroke-width':1.2, opacity:.8});
    for (var i = 1; i < w / 22; i++)
      el('line', {x1:x+i*22, y1:y+5, x2:x+i*22, y2:y+21, stroke:INK80, 'stroke-width':.5, opacity:.4});
  }
  rack(X+34, Y+36, 118);
  rack(X+206, Y+36, 92);
  rack(X+34, Y+96, 264);
  rack(X+34, Y+156, 84);
  rack(X+150, Y+156, 148);

  // 拣货路径：实线去程 + 虚线回程
  el('path', {d:'M '+(X+166)+' '+(Y+H+34)+' L '+(X+166)+' '+(Y+128)+' L '+(X+120)+' '+(Y+128)+' L '+(X+120)+' '+(Y+75),
    fill:'none', stroke:INK80, 'stroke-width':1.3});
  el('path', {d:'M '+(X+120)+' '+(Y+75)+' L '+(X+228)+' '+(Y+75)+' L '+(X+228)+' '+(Y+H+34),
    fill:'none', stroke:INK80, 'stroke-width':.7, opacity:.45, 'stroke-dasharray':'3 5'});

  // 机器人：双圈 + 实心核（落点）
  var rx = X+166, ry = Y+H+34;
  el('circle', {cx:rx, cy:ry, r:10, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:rx, cy:ry, r:6.4, fill:'none', stroke:INK80, 'stroke-width':.6, opacity:.5});
  el('circle', {cx:rx, cy:ry, r:2.4, fill:'#191917'});

  // 装卸口：底部缺口 + 短刻度
  el('line', {x1:X+W/2-26, y1:Y+H, x2:X+W/2-26, y2:Y+H+8, stroke:INK80, 'stroke-width':.8, opacity:.5});
  el('line', {x1:X+W/2+26, y1:Y+H, x2:X+W/2+26, y2:Y+H+8, stroke:INK80, 'stroke-width':.8, opacity:.5});

  // 小图注
  txt(X+W/2, Y+H+64, 'TOP VIEW — DOCK · RACK · PATH', {'font-family':MONO, 'font-size':12,
    'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.45)'});
})();

stageFit();
</script>
</body>
</html>
