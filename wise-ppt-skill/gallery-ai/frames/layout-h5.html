<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>layout-h5 · 状态分层架构图 · AI 平台</title>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 110px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 32px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="doc tl">AI LAYOUT GALLERY — H5<br>STATUS-LAYERED ARCHITECTURE</div>
  <div class="folio">H5 / 63 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#191917" stroke-width="0.6" opacity="0.32"/>
      </pattern>
      <pattern id="hatch-dense" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="5" stroke="#191917" stroke-width="0.7" opacity="0.4"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">左列层标，右带能力件按状态编码——AI 平台分几层、每层建到哪，一屏读完。</div>
</div>

<script src="../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917', INK80 = 'rgba(25,25,23,.8)', INK70 = 'rgba(25,25,23,.7)';
var INK55 = 'rgba(25,25,23,.55)', INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs){ var e=document.createElementNS(NS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); G.appendChild(e); return e; }
function txt(x,y,str,attrs){ var t=el('text',Object.assign({x:x,y:y},attrs||{})); t.textContent=str; return t; }
var MONO='Courier Prime', SANS='Han Sans';
var ACCENT = document.documentElement.classList.contains('accent');
var CINNABAR = ACCENT ? '#C0392B' : '#191917';
var SW = 1.2;

/* 状态编码（同通用版，线型 + 填充密度） */
function statusGlyph(cx,cy,st){
  if(st==='live'||st==='sync'){ el('circle',{cx:cx,cy:cy,r:3.2,fill:INK}); }
  else if(st==='wip'){ el('circle',{cx:cx,cy:cy,r:4,fill:'none',stroke:INK80,'stroke-width':1}); el('circle',{cx:cx,cy:cy,r:1.6,fill:INK}); }
  else if(st==='new'){ el('circle',{cx:cx,cy:cy,r:3.2,fill:INK}); }
  else { el('circle',{cx:cx,cy:cy,r:3.4,fill:'none',stroke:INK55,'stroke-width':1}); }
}
function statusFill(st){
  if(st==='live') return 'url(#hatch)';
  if(st==='sync') return 'url(#hatch-dense)';
  if(st==='new') return 'url(#hatch)';
  return 'none';
}
function statusStroke(st){
  if(st==='todo') return {'stroke':INK55,'stroke-width':1,'stroke-dasharray':'4 4'};
  return {'stroke':INK80,'stroke-width':SW};
}
function tile(x,y,w,h,label,st){
  var dash=statusStroke(st);
  el('rect',{x:x,y:y,width:w,height:h,fill:statusFill(st),stroke:dash.stroke,'stroke-width':dash['stroke-width'],'stroke-dasharray':dash['stroke-dasharray']||'none',rx:2,ry:2});
  statusGlyph(x+16,y+h/2,st);
  var op=st==='todo'?.5:1;
  txt(x+32,y+h/2+5,label,{'font-family':SANS,'font-weight':300,'font-size':16,fill:'rgba(25,25,23,'+(op*0.9)+')'});
  if(st==='new'){ el('path',{d:'M '+(x+w-2)+' '+y+' L '+(x+w-12)+' '+y+' L '+(x+w-2)+' '+(y+10)+' Z',fill:CINNABAR,opacity:.85}); }
}

/* FIG 图题 */
txt(150,150,'FIG. H5 — STATUS-LAYERED ARCHITECTURE',{'font-family':MONO,'font-size':15,'letter-spacing':3,fill:INK45});
el('line',{x1:150,y1:166,x2:560,y2:166,stroke:INK,'stroke-width':.6,opacity:.3});

/* 图例 */
var LX=1180,LY=142;
txt(LX,LY,'LEGEND',{'font-family':MONO,'font-size':12,'letter-spacing':2.5,fill:INK45});
[['live','LIVE 已上线'],['wip','WIP 进行中'],['new','NEW 新上线'],['todo','TODO 未启动']].forEach(function(p,i){
  var lx=LX+70+i*165,ly=138,st=p[0],ms=statusStroke(st);
  el('rect',{x:lx,y:ly,width:20,height:14,fill:statusFill(st),stroke:ms.stroke,'stroke-width':1,'stroke-dasharray':ms['stroke-dasharray']||'none',rx:1.5,ry:1.5});
  statusGlyph(lx+7,ly+7,st);
  if(st==='new'){ el('path',{d:'M '+(lx+18)+' '+ly+' L '+(lx+12)+' '+ly+' L '+(lx+18)+' '+(ly+6)+' Z',fill:CINNABAR,opacity:.85}); }
  txt(lx+28,ly+11,p[1],{'font-family':MONO,'font-size':12,'letter-spacing':1,fill:INK70});
});

/* 6 层 AI 平台架构 */
var BT=210, BH=112, LX0=150, LX1=310, RX=1780;
var layers=[
  {no:'L1',cn:'Agent 应用',en:'AGENT APP',items:[
    {label:'代码助手',st:'live'},{label:'文档问答',st:'live'},
    {label:'数据分析',st:'new'},{label:'流程编排',st:'wip'}
  ]},
  {no:'L2',cn:'编排层',en:'ORCHESTRATION',items:[
    {label:'Prompt 工程',st:'live'},{label:'工具调用',st:'live'},
    {label:'记忆管理',st:'wip'},{label:'任务拆解',st:'wip'},{label:'多步规划',st:'todo'}
  ]},
  {no:'L3',cn:'模型层',en:'MODEL',items:[
    {label:'LLM 代理',st:'live'},{label:'供应商管理',st:'live'},
    {label:'模型测评',st:'live'},{label:'成本核算',st:'live'},{label:'参数锁定',st:'wip'}
  ]},
  {no:'L4',cn:'检索增强',en:'RAG',items:[
    {label:'文档解析',st:'live'},{label:'切片配置',st:'live'},
    {label:'多路召回',st:'live'},{label:'重排策略',st:'wip'},{label:'图谱召回',st:'todo'}
  ]},
  {no:'L5',cn:'工具协议',en:'MCP / TOOL',items:[
    {label:'服务接入',st:'live'},{label:'工具注册',st:'live'},
    {label:'权限网关',st:'live'},{label:'跨域调用',st:'new'}
  ]},
  {no:'L6',cn:'评测治理',en:'EVAL & GOVERN',items:[
    {label:'评测集',st:'live'},{label:'质量监测',st:'live'},
    {label:'Trace 回溯',st:'live'},{label:'输出安检',st:'todo'}
  ]}
];

for(var i=0;i<=layers.length;i++){
  var y=BT+i*BH;
  el('line',{x1:LX0,y1:y,x2:RX,y2:y,stroke:INK,'stroke-width':(i===0||i===layers.length)?.8:.6,opacity:(i===0||i===layers.length)?.4:.25});
}
el('line',{x1:LX1,y1:BT,x2:LX1,y2:BT+layers.length*BH,stroke:INK,'stroke-width':.6,opacity:.25});

layers.forEach(function(L,r){
  var yTop=BT+r*BH, midY=yTop+BH/2;
  txt(LX0+20,midY-14,L.no,{'font-family':MONO,'font-size':18,'letter-spacing':2,fill:INK});
  txt(LX0+20,midY+12,L.cn,{'font-family':SANS,'font-weight':300,'font-size':20,fill:INK});
  txt(LX0+20,midY+34,L.en,{'font-family':MONO,'font-size':10,'letter-spacing':2,fill:INK45});
  el('line',{x1:LX0+20,y1:midY+44,x2:LX0+90,y2:midY+44,stroke:INK,'stroke-width':.5,opacity:.25});
  var n=L.items.length, areaX=LX1+32, areaW=RX-LX1-64, gap=14;
  var tw=(areaW-gap*(n-1))/n, th=46, ty=midY-th/2+2;
  L.items.forEach(function(it,i){
    tile(areaX+i*(tw+gap), ty, tw, th, it.label, it.st);
  });
});

/* 底部总账 */
var done=0,total=0;
layers.forEach(function(L){L.items.forEach(function(it){total++; if(it.st==='live'||it.st==='new'||it.st==='sync')done++;});});
var pct=Math.round(done/total*100);
txt(960,BT+layers.length*BH+36,'COVERAGE '+pct+'%  ·  '+done+'/'+total+' ITEMS LIVE  ·  '+(total-done)+' PENDING',
  {'font-family':MONO,'font-size':13,'letter-spacing':2.5,'text-anchor':'middle',fill:INK45});

stageFit();
</script>
</body>
</html>
