<!DOCTYPE html>
<html lang="zh-CN" data-page-id="page.example-matrix-atlas-process" data-page-role="synthesize" data-theme="paper-ink" data-layout="paper-ink.matrix.stage-dimension" data-density="dense" data-reuse-mode="compose" data-render-ready="true">
<head><meta charset="UTF-8"><title>阶段 × 能力矩阵</title><link rel="stylesheet" href="../../../assets/shared.css"><style>
.title{position:absolute;left:135px;top:75px;font:700 50px var(--sans)}.chain{position:absolute;left:360px;top:185px;width:1410px;display:flex;gap:8px}.step{flex:1;border-top:2px solid #191917;padding:18px 16px;font:600 22px var(--sans)}.step:after{content:'→';float:right;font-family:var(--mono);opacity:.4}.step:last-child:after{content:''}
.matrix{position:absolute;left:135px;top:300px;width:1635px;border-collapse:collapse;font:19px var(--sans)}.matrix th,.matrix td{border:1px solid rgba(25,25,23,.3);padding:23px 20px;vertical-align:top}.matrix th{font:15px var(--mono);letter-spacing:.08em}.matrix .row{width:185px;font-weight:700;background:rgba(25,25,23,.04)}.matrix small{display:block;margin-top:8px;opacity:.55}
.take{position:absolute;left:135px;right:150px;bottom:75px;font:26px var(--sans);border-top:1px solid #191917;padding-top:18px}
</style></head><body><div class="stage">
<h1 class="title">4 个阶段 × 3 类能力 = 12 个交付位</h1>
<div class="chain" data-block-id="block.stage-process" data-provider="atlas" data-component="流程-默认变体(4步)" data-content-ref="item.delivery-stages"><div class="step">01 理解</div><div class="step">02 编排</div><div class="step">03 渲染</div><div class="step">04 验证</div></div>
<table class="matrix" data-block-id="block.capability-matrix" data-provider="table" data-component="matrix-body" data-content-ref="item.stage-capability-matrix"><tr><th></th><th>理解</th><th>编排</th><th>渲染</th><th>验证</th></tr><tr><td class="row">内容</td><td>事实清单<small>来源 / 缺口</small></td><td>叙事主张<small>关系 / 页数</small></td><td>文案落位<small>标题 / 标注</small></td><td>覆盖检查<small>追溯 / 数值</small></td></tr><tr><td class="row">设计</td><td>阅读目标<small>主次 / 节奏</small></td><td>空间原语<small>矩阵 / 流程</small></td><td>主题适配<small>字体 / 线条</small></td><td>视觉检查<small>密度 / 溢出</small></td></tr><tr><td class="row">工程</td><td>输入契约<small>content.json</small></td><td>语义契约<small>deck-plan.json</small></td><td>渲染契约<small>render-plan.json</small></td><td>产物契约<small>HTML / PNG</small></td></tr></table>
<div class="take" data-block-id="block.framework-takeaway" data-provider="typography" data-component="takeaway" data-content-ref="item.framework-takeaway">流程组件负责读顺序，矩阵骨架负责读交叉责任，两者不可互相替代。</div>
</div></body></html>
