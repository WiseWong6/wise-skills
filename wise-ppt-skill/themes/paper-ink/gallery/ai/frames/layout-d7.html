<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.d7">

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">当前章节从数据、模型到应用展开 AI 工程化链路，异常反馈贯穿全程。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ============ 章节轨：x0–104 通高竖条（只有细线与文字，无填充） ============ */
el('line', {x1:104, y1:0, x2:104, y2:1080, stroke:INK, 'stroke-width':1, opacity:.3});

/* 轨顶章节计数 */
txt(52, 132, 'CH', {'font-family':MONO, 'font-size':12, 'letter-spacing':3, 'text-anchor':'middle', fill:INK45});
txt(52, 162, '02', {'font-family':MONO, 'font-size':22, 'text-anchor':'middle', fill:INK});
el('line', {x1:34, y1:182, x2:70, y2:182, stroke:INK, 'stroke-width':.6, opacity:.35});

/* 五枚章节齿：当前章 02 加重；小号重复编号会干扰竖排章名，只保留轨顶章节号。 */
var CHY = [320, 430, 540, 650, 760];
CHY.forEach(function(y, i){
  var cur = (i === 1);
  el('line', {x1:cur ? 72 : 90, y1:y, x2:104, y2:y, stroke:cur ? INK80 : INK,
    'stroke-width': cur ? 1.4 : .8, opacity: cur ? 1 : .4});
  if (cur) el('circle', {cx:96, cy:y, r:2.4, fill:INK});
});

/* 竖排章节名：中文逐字 + mono EN 旋转 */
'AI 工程'.split('').forEach(function(ch, i){
  txt(46, 436 + i * 46, ch, {'font-family':SANS, 'font-weight':300, 'font-size':26, 'text-anchor':'middle', fill:INK});
});
var vt = txt(80, 700, 'AI ENGINEERING', {'font-family':MONO, 'font-size':13, 'letter-spacing':4,
  'text-anchor':'middle', fill:INK45, transform:'rotate(-90 80 700)'});

/* 轨底署名刻度 */
txt(52, 1010, 'AI WSP · 2026', {'font-family':MONO, 'font-size':10, 'letter-spacing':2,
  'text-anchor':'middle', fill:INK45, transform:'rotate(-90 52 1010)'});

/* ---------- FIG 图题（主体区自 x140 起） ---------- */
txt(200, 176, 'FIG. K3 — VERTICAL CHAPTER RAIL', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:570, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ============ 示范主体：本章标题 + 三级决策链（内容随轨右移） ============ */
txt(300, 300, 'CHAPTER 02 / 05', {'font-family':MONO, 'font-size':14, 'letter-spacing':3, fill:'rgba(25,25,23,.5)'});
txt(300, 362, 'AI 工程化：三级决策链路', {'font-family':'Han Serif', 'font-size':44, fill:INK});
el('line', {x1:300, y1:392, x2:760, y2:392, stroke:INK, 'stroke-width':.8, opacity:.5});

/* 三个形态各异的仪器图元：感知（十字准星盘） / 决策（芯片组） / 执行（甘特条） */
var SY = 560;
/* ① 感知层 · 准星盘 */
var P1 = 420;
el('circle', {cx:P1, cy:SY, r:86, fill:'none', stroke:INK80, 'stroke-width':1.3});
el('circle', {cx:P1, cy:SY, r:78, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
el('circle', {cx:P1, cy:SY, r:34, fill:'none', stroke:INK, 'stroke-width':.8, opacity:.55});
el('line', {x1:P1 - 104, y1:SY, x2:P1 + 104, y2:SY, stroke:INK, 'stroke-width':.7, opacity:.5});
el('line', {x1:P1, y1:SY - 104, x2:P1, y2:SY + 104, stroke:INK, 'stroke-width':.7, opacity:.5});
el('circle', {cx:P1, cy:SY, r:3, fill:INK});
el('circle', {cx:P1 + 40, cy:SY - 44, r:5, fill:'none', stroke:INK80, 'stroke-width':1});
el('circle', {cx:P1 + 40, cy:SY - 44, r:1.6, fill:INK});
txt(P1, SY + 132, '数据层', {'font-family':SANS, 'font-weight':300, 'font-size':22, 'text-anchor':'middle', fill:INK});
txt(P1, SY + 160, 'DATA · CORPUS+FEATURE', {'font-family':MONO, 'font-size':13, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* ② 决策层 · 芯片组 */
var P2 = 960;
el('rect', {x:P2 - 78, y:SY - 58, width:156, height:116, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3});
el('rect', {x:P2 - 66, y:SY - 46, width:132, height:92, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
for (var i = 0; i < 6; i++) {
  el('line', {x1:P2 - 78 - 18, y1:SY - 40 + i * 16, x2:P2 - 78, y2:SY - 40 + i * 16, stroke:INK, 'stroke-width':.9, opacity:.6});
  el('line', {x1:P2 + 78, y1:SY - 40 + i * 16, x2:P2 + 78 + 18, y2:SY - 40 + i * 16, stroke:INK, 'stroke-width':.9, opacity:.6});
}
txt(P2, SY - 4, 'M-ENGINE', {'font-family':MONO, 'font-size':15, 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
txt(P2, SY + 22, 'V3.2', {'font-family':MONO, 'font-size':12, 'text-anchor':'middle', fill:'rgba(25,25,23,.5)'});
txt(P2, SY + 132, '模型层', {'font-family':SANS, 'font-weight':300, 'font-size':22, 'text-anchor':'middle', fill:INK});
txt(P2, SY + 160, 'MODEL · TRAIN+TUNE', {'font-family':MONO, 'font-size':13, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* ③ 执行层 · 迷你甘特 */
var P3 = 1500;
el('rect', {x:P3 - 110, y:SY - 66, width:220, height:132, fill:'none', stroke:INK, 'stroke-width':.8, 'stroke-dasharray':'4 4', opacity:.5});
[[-40, 96], [-4, 132], [32, 76]].forEach(function(b, i){
  el('rect', {x:P3 - 92, y:SY + b[0], width:b[1], height:20, fill:'none', stroke:INK80, 'stroke-width':1.1});
  for (var t = 0; t <= 4; t++)
    el('line', {x1:P3 - 92 + t * b[1] / 4, y1:SY + b[0] + 20, x2:P3 - 92 + t * b[1] / 4, y2:SY + b[0] + 26,
      stroke:INK, 'stroke-width':.5, opacity:.45});
});
txt(P3, SY + 132, '应用层', {'font-family':SANS, 'font-weight':300, 'font-size':22, 'text-anchor':'middle', fill:INK});
txt(P3, SY + 160, 'APP · DEPLOY+MONITOR', {'font-family':MONO, 'font-size':13, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* 连接：细线 + 开放箭头 */
[[P1 + 112, P2 - 104], [P2 + 104, P3 - 118]].forEach(function(seg){
  el('line', {x1:seg[0], y1:SY, x2:seg[1], y2:SY, stroke:INK, 'stroke-width':1, opacity:.55});
  el('line', {x1:seg[1] - 12, y1:SY - 7, x2:seg[1], y2:SY, stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:seg[1] - 12, y1:SY + 7, x2:seg[1], y2:SY, stroke:INK80, 'stroke-width':1.2});
});
/* 反馈虚线弧（回环语义 + 弧上标签） */
el('path', {d:'M ' + (P3 - 30) + ' ' + (SY - 76) + ' C ' + P3 + ' ' + (SY - 190) + ' ' + P1 + ' ' + (SY - 190) + ' ' + (P1 + 30) + ' ' + (SY - 96),
  fill:'none', stroke:INK, 'stroke-width':.7, 'stroke-dasharray':'3 6', opacity:.45});
txt(960, SY - 158, 'EXCEPTION FEEDBACK', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'middle', fill:'rgba(25,25,23,.5)'});

/* 轨 → 主体区的构造虚线 + 右移注记 */
el('line', {x1:104, y1:836, x2:270, y2:836, stroke:INK, 'stroke-width':.6, 'stroke-dasharray':'2 6', opacity:.4});
el('circle', {cx:104, cy:836, r:2.4, fill:'none', stroke:INK80, 'stroke-width':1});
txt(282, 830, 'OFFSET X ≥ 140', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, fill:INK45});
txt(282, 854, '主体内容区随轨整体右移', {'font-family':SANS, 'font-weight':300, 'font-size':16, fill:'rgba(25,25,23,.55)'});

stageFit();
</script>
</body>
</html>
