<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-ai-k2" data-page-role="synthesize" data-theme="paper-ink" data-layout="paper-ink.matrix.problem-solution-outcome" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-k2 · 痛点→解法→成效三栏 · AI 阅读系统</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  canvas { position: absolute; inset: 0; z-index: 2; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.k2">
  <div class="doc tl">AI LAYOUT GALLERY — K2<br>PAIN-FIX-GAIN · AI READING</div>
  <div class="folio">K2 / 63 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>
  <canvas id="cv" width="1920" height="1080"></canvas>

  <div class="caption">自动归档、知识卡片与个人智能体让 600 篇收藏重新可用，每篇速读耗时降至 1 分钟。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens §1.5） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = '#C0392B';
var SERIF = 'Han Serif';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. K2 — PAIN — FIX — GAIN', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:480, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});
G = el('g', {transform:'translate(65 68)'});

/* ---------- 栏头：mono 栏题 + 短横 + 中文栏题 ---------- */
var heads = [
  {x:150,  en:'PAIN POINTS', cn:'阅读痛点'},
  {x:700,  en:'THE FIX',    cn:'AI 解法'},
  {x:1330, en:'OUTCOME',    cn:'真实成效'}
];
heads.forEach(function(h){
  txt(h.x, 238, h.en, {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
  el('line', {x1:h.x, y1:254, x2:h.x+100, y2:254, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(h.x, 296, h.cn, {'font-family':SANS, 'font-weight':300, 'font-size':24, fill:INK});
});

/* ---------- 栏间细线开放箭头 ---------- */
function colArrow(x1, x2, y){
  el('line', {x1:x1, y1:y, x2:x2, y2:y, stroke:INK, 'stroke-width':1.2, opacity:.6});
  el('line', {x1:x2-10, y1:y-6, x2:x2, y2:y, stroke:INK, 'stroke-width':1.2, opacity:.6});
  el('line', {x1:x2-10, y1:y+6, x2:x2, y2:y, stroke:INK, 'stroke-width':1.2, opacity:.6});
}
colArrow(636, 684, 540);
colArrow(1186, 1234, 540);

/* ---------- 编号条目（左右栏同构对位） ---------- */
function item(x, y, no, title, note1, note2, tag){
  el('circle', {cx:x+22, cy:y, r:13, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:x+22, cy:y, r:9, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
  txt(x+22, y+4.5, no, {'font-family':MONO, 'font-size':13, 'text-anchor':'middle', fill:INK});
  txt(x+52, y+7, title, {'font-family':SANS, 'font-weight':300, 'font-size':21, fill:INK});
  txt(x+52, y+40, note1, {'font-family':SANS, 'font-weight':300, 'font-size':16, fill:INK70});
  if (note2) txt(x+52, y+66, note2, {'font-family':SANS, 'font-weight':300, 'font-size':16, fill:INK70});
  txt(x+444, y+7, tag, {'font-family':MONO, 'font-size':11, 'letter-spacing':2, 'text-anchor':'end', fill:INK45});
}

var pains = [
  ['1', '收藏夹是坟场', '文章无限期积压，', '存了等于没看，越积越多。', 'BACKLOG↑'],
  ['2', '读完就忘', '没有提炼与归档，', '一周后内容全忘光。', 'RETENTION↓'],
  ['3', '不会用', '不知道能问什么，', '拿到 AI 也只会查天气。', 'USAGE↓']
];
var fixes = [
  ['1', 'AI 阅读系统', '输入链接自动出卡片，', '收藏即整理，零负担归档。', 'AUTO READ'],
  ['2', '知识卡片', '结构化提炼要点，', '一篇长文压缩成 5 张卡。', 'KNOWLEDGE CARD'],
  ['3', '个人智能体', '基于知识库问答，', '随时反查、随时调用。', 'PERSONAL AGENT']
];
var YS = [372, 522, 672];
YS.forEach(function(y, i){
  item(150, y, pains[i][0], pains[i][1], pains[i][2], pains[i][3], pains[i][4]);
  item(700, y, fixes[i][0], fixes[i][1], fixes[i][2], fixes[i][3], fixes[i][4]);
  /* 对位虚线（栏间短桥，编号对齐语义） */
  el('line', {x1:616, y1:y, x2:680, y2:y, stroke:INK, 'stroke-width':.5, opacity:.3, 'stroke-dasharray':'2 5'});
});

/* ---------- 右栏：成效大数字（2 个，整体高度对齐左中栏 y372–738） ---------- */
var CXR = 1485;
/* KPI01 顶部对齐第一条目 y372 */
txt(CXR, 392, 'KPI · 01', {'font-family':MONO, 'font-size':11, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
txt(CXR, 470, '600', {'font-family':SERIF, 'font-size':76, 'text-anchor':'middle', fill:INK});
txt(CXR, 506, '份文章已整理', {'font-family':SANS, 'font-weight':300, 'font-size':20, 'text-anchor':'middle', fill:INK});
txt(CXR, 534, '0 → 600 AUTO-CARD', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

el('line', {x1:1330, y1:568, x2:1640, y2:568, stroke:INK, 'stroke-width':.6, opacity:.3});

/* KPI02 底部不超过左中栏末条目底部 y738 */
txt(CXR, 600, 'KPI · 02', {'font-family':MONO, 'font-size':11, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
txt(CXR, 678, '1分钟', {'font-family':SERIF, 'font-size':76, 'text-anchor':'middle', fill: ACCENT ? RED : INK});  /* 主角：成效焦点（20min→1min） */
txt(CXR, 714, '每篇速读耗时', {'font-family':SANS, 'font-weight':300, 'font-size':20, 'text-anchor':'middle', fill: ACCENT ? 'rgba(192,57,43,.85)' : INK});
txt(CXR, 738, '20MIN → 1MIN PER ARTICLE', {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

stageFit();
</script>
</body>
</html>
