<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-ai-m1" data-page-role="hook" data-theme="paper-ink" data-layout="paper-ink.emotion.particle-hero" data-density="breathing" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-m1 · 粒子主角 + 对照提问 · 大模型黑盒</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  canvas.scene { position: absolute; inset: 0; z-index: 1; }
  svg.overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

  /* 方块上方：对照行 */
  .compare {
    position: absolute; left: 0; right: 0; top: 268px;
    display: flex; align-items: center; justify-content: center;
    gap: var(--space-5); z-index: 3;
    font-family: var(--sans); font-weight: 300;
    font-size: 24px; color: var(--ink-70);
    letter-spacing: .06em;
  }
  .compare .arr { font-style: normal; color: var(--ink-45); }
  .compare .sep { width: 1px; height: 26px; background: var(--ink-25); margin: 0 var(--space-6); }
  .compare .q {
    font-family: var(--serif); font-size: 44px;
    color: var(--ink); transform: translateY(2px);
  }
  .compare-rule {
    position: absolute; left: 560px; top: 336px; width: 800px;
    border-top: 1px solid var(--ink-25); z-index: 3;
  }
  .compare-rule::before, .compare-rule::after {
    content: ""; position: absolute; top: -5px;
    width: 1px; height: 11px; background: var(--ink-25);
  }
  .compare-rule::before { left: 0; }
  .compare-rule::after { right: 0; }

  /* 方块刻字（纸色反色） */
  .boxtext {
    position: absolute; left: 825px; top: 355px;
    width: 270px; height: 270px; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #DFE0D9; pointer-events: none;
  }
  .boxtext .t1 {
    font-family: var(--mono); font-size: 35px;
    letter-spacing: .16em; text-indent: .16em;
  }
  .boxtext .divi {
    width: 140px; height: 1px;
    background: rgba(223,224,217,.55);
    margin: var(--space-6) 0 var(--space-5);
  }
  .boxtext .t2 {
    font-family: var(--mono); font-size: 13px;
    letter-spacing: .4em; text-indent: .4em;
    color: rgba(223,224,217,.8);
  }

  .caption {
    position: absolute; left: 0; right: 0; bottom: 108px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.m1">
  <div class="doc tl">AI LAYOUT GALLERY — M1<br>PARTICLE HERO · LLM BLACKBOX</div>
  <div class="folio">M1 / 63 — BY @歪斯Wise</div>

  <canvas class="scene" id="cv" width="1920" height="1080"></canvas>

  <div class="compare">
    <span>规则引擎</span><i class="arr">→</i><span>可解释</span>
    <span class="sep"></span>
    <span>大模型</span><i class="arr">→</i><span class="q">？</span>
  </div>
  <div class="compare-rule"></div>

  <svg class="overlay" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch" width="5.6" height="5.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="5.6" stroke="#191917" stroke-width="0.7" opacity="0.35"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="boxtext">
    <div class="t1">LLM</div>
    <div class="divi"></div>
    <div class="t2">GIANT BLACKBOX</div>
  </div>

  <div class="caption">输入一句话，输出一个答案——中间发生了什么，没人看得见。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
/* ============ 粒子黑方块（极密 + 毛糙边缘） ============ */
(function(){
  var ctx = document.getElementById('cv').getContext('2d');
  var BX = 825, BY = 355, BS = 270;

  // 极密实心填充
  for (var y = BY; y < BY + BS; y += 2.6) {
    for (var x = BX; x < BX + BS; x += 2.6) {
      var e = Math.min(x - BX, BX + BS - x, y - BY, BY + BS - y);
      if (e < 4 && Math.random() < (4 - e) / 4 * .75) continue;
      PART.dot(ctx,
        x + (Math.random() - .5) * 1.6,
        y + (Math.random() - .5) * 1.6,
        1.5 + Math.random() * .7,
        .75 + Math.random() * .25);
    }
  }
  // 边缘向外毛糙散落
  for (var i = 0; i < 460; i++) {
    var side = (Math.random() * 4) | 0, t = Math.random() * BS;
    var d = Math.pow(Math.random(), 2) * 11;
    var px, py;
    if (side === 0)      { px = BX + BS + d; py = BY + t; }
    else if (side === 1) { px = BX - d;      py = BY + t; }
    else if (side === 2) { px = BX + t;      py = BY + BS + d; }
    else                 { px = BX + t;      py = BY - d; }
    PART.dot(ctx, px, py, .6 + Math.random() * 1.1, .1 + Math.random() * .42 * (1 - d / 11));
  }
  // 氛围尘埃（极淡，避开文字区）
  PART.dust(ctx, 320, 380, 1280, 440, 110, .1);
})();

/* ============ SVG 构造线 / 尺寸标注 / 剖面影 ============ */
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var INK8 = 'rgba(25,25,23,.8)';
  var G = document.getElementById('draw');
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    G.appendChild(e); return e;
  }
  function txt(x, y, str, attrs) {
    var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
    t.textContent = str; return t;
  }
  var MONO = 'Courier Prime';
  var BX = 825, BY = 355, BS = 270;

  // 构造框（虚线，比方块大一圈）
  el('rect', {x:BX-18, y:BY-18, width:BS+36, height:BS+36, fill:'none',
    stroke:INK8, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'3 5'});
  // 构造框四角短刻度
  [[BX-18,BY-18],[BX+BS+18,BY-18],[BX-18,BY+BS+18],[BX+BS+18,BY+BS+18]].forEach(function(c){
    el('line', {x1:c[0]-7, y1:c[1], x2:c[0]+7, y2:c[1], stroke:INK8, 'stroke-width':.8, opacity:.5});
    el('line', {x1:c[0], y1:c[1]-7, x2:c[0], y2:c[1]+7, stroke:INK8, 'stroke-width':.8, opacity:.5});
  });

  // 左侧尺寸标注：270 px
  var dx = BX - 74;
  el('line', {x1:BX-30, y1:BY, x2:dx-10, y2:BY, stroke:INK8, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 4'});
  el('line', {x1:BX-30, y1:BY+BS, x2:dx-10, y2:BY+BS, stroke:INK8, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 4'});
  el('line', {x1:dx, y1:BY, x2:dx, y2:BY+BS, stroke:INK8, 'stroke-width':1.2});
  el('line', {x1:dx-8, y1:BY, x2:dx+8, y2:BY, stroke:INK8, 'stroke-width':1.2});
  el('line', {x1:dx-8, y1:BY+BS, x2:dx+8, y2:BY+BS, stroke:INK8, 'stroke-width':1.2});
  txt(dx-16, BY+BS/2, '270 PX', {'font-family':MONO, 'font-size':14, 'letter-spacing':3,
    fill:'rgba(25,25,23,.6)', 'text-anchor':'middle',
    transform:'rotate(-90 '+(dx-16)+' '+(BY+BS/2)+')'});

  // 底部剖面影（hatch）
  el('path', {d:'M '+BX+' '+(BY+BS+10)+' L '+(BX+BS)+' '+(BY+BS+10)+
    ' L '+(BX+BS-14)+' '+(BY+BS+21)+' L '+(BX-14)+' '+(BY+BS+21)+' Z', fill:'url(#hatch)'});
  el('line', {x1:BX-14, y1:BY+BS+21, x2:BX+BS-14, y2:BY+BS+21, stroke:INK8, 'stroke-width':1, opacity:.5});

  // 图注
  txt(BX+BS/2, BY+BS+62, 'FIG. M1 — PARTICLE MASS · DENSITY 1.0', {'font-family':MONO,
    'font-size':13, 'letter-spacing':4, 'text-anchor':'middle', fill:'rgba(25,25,23,.45)'});
})();

stageFit();
</script>
</body>
</html>
