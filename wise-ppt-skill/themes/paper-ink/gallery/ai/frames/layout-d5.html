<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime';

/* ===== ① 超大空心章节编号（描边不填，测绘感） ===== */
var t = txt(560, 645, '02', {'font-family':MONO, 'font-size':300, fill:'none', stroke:INK, 'stroke-width':1.2, opacity:.5});

/* ===== ② 十字准星（唯一装饰，右上空区） ===== */
el('line', {x1:1382, y1:300, x2:1418, y2:300, stroke:INK, 'stroke-width':.8, opacity:.4});
el('line', {x1:1400, y1:282, x2:1400, y2:318, stroke:INK, 'stroke-width':.8, opacity:.4});

</script>
