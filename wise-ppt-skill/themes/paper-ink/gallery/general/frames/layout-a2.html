<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-a2" data-page-role="hook" data-theme="paper-ink" data-layout="paper-ink.evidence.scenario-illustration" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-a2 · 场景画</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }

  .say { position: absolute; z-index: 3; }
  .say .who {
    font-family: var(--mono); font-size: var(--type-meta); letter-spacing: .25em;
    color: var(--ink-45); margin-bottom: var(--space-3);
  }
  .say .bubble {
    border: 1px solid rgba(25,25,23,.38);
    background: rgba(255,255,255,.22);
    padding: var(--space-5) 28px;
    box-shadow: var(--shadow-soft);
    font-family: var(--sans); font-weight: 300;
    font-size: var(--type-subheading); line-height: 1.6;
  }
  .say .bubble b { font-weight: 400; }

  .caption {
    position: absolute; left: 0; right: 0; bottom: 108px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.a2">
  <div class="doc tl">PAPER-INK GALLERY — A2<br>NARRATIVE SCENE</div>
  <div class="folio">A2 / 63 — BY WISEWONG</div>

  <div class="say" style="left:170px; top:168px; width:520px;">
    <div class="who">运营负责人 · 现场提问</div>
    <div class="bubble">大促夜班，两台车在窄巷道会车，<b>会不会顶牛</b>？</div>
  </div>

  <div class="say" style="right:150px; top:168px; width:470px;">
    <div class="who">衡玑调度平台 · 应答</div>
    <div class="bubble">该段已设<b>单行时窗</b>——K-12 让行 40 秒，F-03 先行。</div>
  </div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#191917" stroke-width="0.8" opacity="0.45"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">场景画把抽象问题演成具体一幕——人、车、货架顺着地平线，从左读到右。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'rgba(25,25,23,.82)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = getComputedStyle(document.documentElement).getPropertyValue('--accent-red').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';
var GY = 740, LW = 1.3;

/* ============ 地面 ============ */
el('line', {x1:150, y1:GY, x2:1770, y2:GY, stroke:INK, 'stroke-width':1.5});
for (var gx = 180; gx < 1760; gx += 42) {
  el('line', {x1:gx, y1:GY, x2:gx-13, y2:GY+11, stroke:INK, 'stroke-width':1, opacity:.3});
}

/* ============ 入库月台（左端） ============ */
(function(){
  var x = 200, y = GY, w = 240, h = 210;
  el('rect', {x:x, y:y-h, width:w, height:h, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':LW});
  /* 雨棚（剖面线斜挑） */
  el('path', {d:'M '+(x-18)+' '+(y-h)+' L '+(x+w+18)+' '+(y-h)+' L '+(x+w+40)+' '+(y-h-46)+' L '+(x+4)+' '+(y-h-46)+' Z',
    fill:'url(#hatch)', stroke:INK, 'stroke-width':LW, 'stroke-linejoin':'round'});
  /* 月台门（双竖线 + 横档） */
  el('rect', {x:x+30, y:y-150, width:96, height:150, fill:'none', stroke:INK, 'stroke-width':1.2});
  el('line', {x1:x+78, y1:y-150, x2:x+78, y2:y, stroke:INK, 'stroke-width':1.1, opacity:.7});
  el('line', {x1:x+30, y1:y-100, x2:x+126, y2:y-100, stroke:INK, 'stroke-width':1, opacity:.5});
  /* 库名招牌 */
  txt(x+178, y-96, '七号库', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-emphasis)', 'letter-spacing':4, 'text-anchor':'middle', fill:INK});
  el('line', {x1:x+140, y1:y-80, x2:x+216, y2:y-80, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(x+w/2, y-h-62, 'DOCK 07', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':4, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
  /* 底部剖面影 */
  el('path', {d:'M '+x+' '+(y+8)+' L '+(x+w)+' '+(y+8)+' L '+(x+w-14)+' '+(y+18)+' L '+(x-14)+' '+(y+18)+' Z', fill:'url(#hatch)'});
})();

/* ============ 调度员小人（手持终端） ============ */
(function(){
  var x = 640, y = GY;
  el('circle', {cx:x, cy:y-118, r:15, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':1.4});
  el('path', {d:'M '+x+' '+(y-102)+' Q '+(x+4)+' '+(y-70)+' '+(x+2)+' '+(y-44), fill:'none', stroke:INK, 'stroke-width':1.6, 'stroke-linecap':'round'});
  /* 手臂前伸持终端 */
  el('path', {d:'M '+(x+2)+' '+(y-88)+' Q '+(x+26)+' '+(y-80)+' '+(x+34)+' '+(y-72), fill:'none', stroke:INK, 'stroke-width':1.8, 'stroke-linecap':'round'});
  el('rect', {x:x+30, y:y-86, width:22, height:16, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':1.1});
  /* 腿（立正微分） */
  el('path', {d:'M '+(x+2)+' '+(y-44)+' Q '+(x+14)+' '+(y-22)+' '+(x+18)+' '+y, fill:'none', stroke:INK, 'stroke-width':1.6, 'stroke-linecap':'round'});
  el('path', {d:'M '+(x+2)+' '+(y-44)+' Q '+(x-10)+' '+(y-22)+' '+(x-14)+' '+y, fill:'none', stroke:INK, 'stroke-width':1.6, 'stroke-linecap':'round'});
  txt(x, y+40, 'DISPATCHER', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.5)'});
})();

/* ============ 潜伏顶升机器人 K-12（驮料箱） ============ */
(function(){
  var x = 830, y = GY, w = 180;
  /* 料箱（顶升盘上） */
  el('rect', {x:x+34, y:y-128, width:112, height:66, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':1.2});
  el('line', {x1:x+34, y1:y-95, x2:x+146, y2:y-95, stroke:INK, 'stroke-width':.8, opacity:.5});
  el('path', {d:'M '+(x+34)+' '+(y-128)+' L '+(x+146)+' '+(y-128)+' L '+(x+146)+' '+(y-62), fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4});
  /* 顶升盘 */
  el('line', {x1:x+22, y1:y-58, x2:x+w-22, y2:y-58, stroke:INK, 'stroke-width':1.6});
  /* 扁平机身（圆角贝塞尔） */
  el('path', {d:'M '+x+' '+(y-16)+
    ' L '+x+' '+(y-40)+' Q '+x+' '+(y-52)+' '+(x+14)+' '+(y-52)+
    ' L '+(x+w-14)+' '+(y-52)+' Q '+(x+w)+' '+(y-52)+' '+(x+w)+' '+(y-40)+
    ' L '+(x+w)+' '+(y-16)+' Z',
    fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':LW, 'stroke-linejoin':'round'});
  /* 雷达塔 + 示廓灯 */
  el('line', {x1:x+w/2, y1:y-52, x2:x+w/2, y2:y-58, stroke:INK, 'stroke-width':1.2});
  el('circle', {cx:x+16, cy:y-34, r:3, fill:'none', stroke:INK, 'stroke-width':1.2});
  /* 驱动轮（双圈） */
  [x+42, x+w-42].forEach(function(wx){
    el('circle', {cx:wx, cy:y-14, r:14, fill:'#DFE0D9', stroke:INK, 'stroke-width':1.3});
    el('circle', {cx:wx, cy:y-14, r:2.2, fill:INK});
  });
  txt(x+w/2, y-140, 'AGV · K-12', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
  /* 底部剖面影 */
  el('path', {d:'M '+(x+6)+' '+(y+8)+' L '+(x+w-6)+' '+(y+8)+' L '+(x+w-18)+' '+(y+16)+' L '+(x-6)+' '+(y+16)+' Z', fill:'url(#hatch)'});
  /* 手写吐槽 */
  txt(x+w/2-10, y-186, 'K-12：你先走。', {id:'accent-dialogue', 'data-accent-group':'narrative-focus', 'font-family':'LXGW WenKai', 'font-size':'var(--type-emphasis)', fill:ACCENT ? RED : INK, transform:'rotate(-3 '+(x+w/2)+' '+(y-186)+')'});
})();

/* ============ 货架墙 RACK B-12（三层搁板 + 货箱） ============ */
(function(){
  var x = 1130, y = GY, w = 330, h = 300;
  /* 立柱与搁板 */
  el('line', {x1:x, y1:y, x2:x, y2:y-h, stroke:INK, 'stroke-width':1.4});
  el('line', {x1:x+w, y1:y, x2:x+w, y2:y-h, stroke:INK, 'stroke-width':1.4});
  el('line', {x1:x+w/2, y1:y, x2:x+w/2, y2:y-h, stroke:INK, 'stroke-width':1, opacity:.6});
  [0, 92, 184, 276].forEach(function(d){
    el('line', {x1:x-8, y1:y-d, x2:x+w+8, y2:y-d, stroke:INK, 'stroke-width':1.2});
  });
  /* 货箱（形态各异的剖面填充件） */
  el('rect', {x:x+16, y:y-76, width:76, height:76, fill:'url(#hatch)', stroke:INK, 'stroke-width':1.1});
  el('rect', {x:x+196, y:y-60, width:110, height:60, fill:'none', stroke:INK, 'stroke-width':1.1});
  el('rect', {x:x+40, y:y-168, width:104, height:76, fill:'none', stroke:INK, 'stroke-width':1.1});
  el('rect', {x:x+206, y:y-160, width:88, height:68, fill:'url(#hatch)', stroke:INK, 'stroke-width':1.1});
  el('rect', {x:x+70, y:y-256, width:96, height:72, fill:'url(#hatch)', stroke:INK, 'stroke-width':1.1});
  /* 顶层梁 + 编号 */
  el('line', {x1:x-8, y1:y-h-12, x2:x+w+8, y2:y-h-12, stroke:INK, 'stroke-width':1.4});
  el('line', {x1:x-8, y1:y-h, x2:x+w+8, y2:y-h, stroke:INK, 'stroke-width':1});
  txt(x+w/2, y-h-26, 'RACK B-12', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
})();

/* ============ 叉取机器人 F-03（桅杆 + 举升货叉） ============ */
(function(){
  var x = 1540, y = GY, w = 150;
  /* 底盘 */
  el('path', {d:'M '+x+' '+(y-16)+' L '+x+' '+(y-52)+' L '+(x+w)+' '+(y-52)+' L '+(x+w)+' '+(y-16)+' Z',
    fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':LW, 'stroke-linejoin':'round'});
  [x+36, x+w-36].forEach(function(wx){
    el('circle', {cx:wx, cy:y-14, r:14, fill:'#DFE0D9', stroke:INK, 'stroke-width':1.3});
    el('circle', {cx:wx, cy:y-14, r:2.2, fill:INK});
  });
  /* 桅杆双轨 */
  el('line', {x1:x+18, y1:y-52, x2:x+18, y2:y-252, stroke:INK, 'stroke-width':1.5});
  el('line', {x1:x+34, y1:y-52, x2:x+34, y2:y-252, stroke:INK, 'stroke-width':1.2});
  for (var my = y-76; my > y-246; my -= 24) {
    el('line', {x1:x+18, y1:my, x2:x+34, y2:my, stroke:INK, 'stroke-width':.8, opacity:.55});
  }
  /* 滑架 + 前伸货叉（举升中，托一箱） */
  el('rect', {x:x+10, y:y-196, width:32, height:34, fill:'none', stroke:INK, 'stroke-width':1.2});
  el('line', {x1:x+10, y1:y-170, x2:x-96, y2:y-170, stroke:INK, 'stroke-width':1.6});
  el('line', {x1:x-96, y1:y-170, x2:x-96, y2:y-186, stroke:INK, 'stroke-width':1.6});
  el('rect', {x:x-158, y:y-236, width:96, height:66, fill:'url(#hatch)', stroke:INK, 'stroke-width':1.2});
  txt(x+w/2, y-272, 'AMR · F-03', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
  /* 底部剖面影 */
  el('path', {d:'M '+(x+4)+' '+(y+8)+' L '+(x+w-4)+' '+(y+8)+' L '+(x+w-16)+' '+(y+16)+' L '+(x-8)+' '+(y+16)+' Z', fill:'url(#hatch)'});
})();

/* ============ 12 m 窄巷道段尺寸标注 ============ */
(function(){
  var y = GY + 76, x1 = 1010, x2 = 1540;
  el('line', {x1:x1, y1:y, x2:x2, y2:y, stroke:INK, 'stroke-width':1.6});
  el('line', {x1:x1, y1:y-10, x2:x1, y2:y+10, stroke:INK, 'stroke-width':1.6});
  el('line', {x1:x2, y1:y-10, x2:x2, y2:y+10, stroke:INK, 'stroke-width':1.6});
  el('line', {x1:x1, y1:y, x2:x1, y2:GY+4, stroke:INK, 'stroke-width':.8, 'stroke-dasharray':'2 4', opacity:.5});
  el('line', {x1:x2, y1:y, x2:x2, y2:GY+4, stroke:INK, 'stroke-width':.8, 'stroke-dasharray':'2 4', opacity:.5});
  txt((x1+x2)/2, y+40, '12 m', {'font-family':MONO, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:INK});
  txt((x1+x2)/2, y-16, 'ONE-WAY WINDOW', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.5)'});
})();

stageFit();
</script>
</body>
</html>
