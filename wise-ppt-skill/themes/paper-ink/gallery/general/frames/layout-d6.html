<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ================= 左块：地图线稿 x150–920, y220–640 ================= */
/* 构造虚线边框（测绘图纸感） */
el('rect', {x:150, y:220, width:770, height:420, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 6'});
/* 四角套准十字 */
[[150,220],[920,220],[150,640],[920,640]].forEach(function(p){
  el('line', {x1:p[0]-8, y1:p[1], x2:p[0]+8, y2:p[1], stroke:INK, 'stroke-width':.7, opacity:.35});

});

el('path', {d:'M 700 220 C 760 320, 700 420, 800 500 C 850 540, 880 600, 870 640', fill:'none', stroke:INK, 'stroke-width':.9, opacity:.5});

/* 横向路网（主干道 1.2px，次道 .7px） */

el('line', {x1:KX+44, y1:KY+84, x2:KX+200, y2:KY+84, stroke:INK, 'stroke-width':.8, opacity:.5});

/* 姓名 + 职务 */
txt(KX+44, KY+156, '沈昭远', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-emphasis)', fill:INK});

/* 电话 / 邮箱 / 网址行 */
var lines = [

  ['MAIL',  'zhaoyuan.shen@hengji.tech'],
  ['WEB',   'www.hengji.tech'],
  ['ADDR',  'SHENZHEN']
];
lines.forEach(function(L, i){
  var y = KY + 292 + i * 62;
  txt(KX+44, y, L[0], {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:'rgba(25,25,23,.5)'});
  txt(KX+150, y, L[1], {'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':1, fill:INK});
  if (i < lines.length-1)
    el('line', {x1:KX+44, y1:y+22, x2:KX+KW-44, y2:y+22, stroke:INK, 'stroke-width':.6, opacity:.18});
});

/* 真实可扫二维码（公众号名片），线稿墨色方块渲染 */
var QR_SIZE = 37;
var QR_DATA = [
  "1111111010010110100001001001001111111",
  "1000001001011011000001110010001000001",
  "1011101010101101100100111111001011101",
  "1011101011010110010111101010101011101",
  "1011101001110000110101100111001011101",
  "1000001010111000000101100001101000001",
  "1111111010101010101010101010101111111",
  "0000000011011101100100111001000000000",
  "1101001101011011001100001110111101101",
  "1010000111111101001010110111010110110",
  "1010011100010010010010000110101001000",
  "0011110010000100000110111000100111100",
  "1011101001010100011101000100101101000",
  "1100100101101001001110101111011111101",
  "0101111001001101000100001001000110111",
  "1001100111001101000110010001011001110",
  "1100011000110100000111101000110111001",

  "0100011011110100010111100010111100000",
  "0010110000101111010001001110100111010",
  "0000011101110001101001011111110110001",
  "0100000000000101101010101111110001000",
  "1101001001101111100010011001101000011",
  "0111000110100001010111110100110010111",
  "0011011100011110100100101100011100111",
  "1011110001111100101001111010111010011",
  "0111111011000100001111111001011010110",

  "1100111000011100101011100110111111000",

  "1111111010101100001000111010101011110",
  "1000001000100101001110100101100010010",
  "1011101000101111000010011111111111111",
  "1011101010111100111011010110000011011",
  "1011101001111010101000011110111001011",
  "1000001011001111111100001110111000001",
  "1111111010001101111010001100111101001"
];
var QCS = 4.6, QX = KX + KW - QR_SIZE*QCS - 54, QY = KY + KH - QR_SIZE*QCS - 54;
/* 白底垫（确保扫描对比度） */
el('rect', {x:QX-16, y:QY-16, width:QR_SIZE*QCS+32, height:QR_SIZE*QCS+32, fill:'rgb(255,255,255)', stroke:INK, 'stroke-width':.7, opacity:.95});  /* QR 白底垫：扫描对比度刚需 */
for (var ri = 0; ri < QR_SIZE; ri++) {
  for (var rj = 0; rj < QR_SIZE; rj++) {
    if (QR_DATA[ri][rj] === '1')
      el('rect', {x:QX + rj*QCS, y:QY + ri*QCS, width:QCS, height:QCS, fill:INK});
  }
}
txt(QX-16, QY + QR_SIZE*QCS + 38, 'SCAN · WECHAT', {'font-family':MONO, 'font-size':'var(--type-micro)', 'letter-spacing':2, fill:'rgba(25,25,23,.45)'});

/* 卡内左下：一行中文小注 */
txt(KX+44, KY+KH-96, '预约拜访请提前一个工作日邮件确认。', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:'rgba(25,25,23,.7)'});
txt(KX+44, KY+KH-62, 'VISITS BY APPOINTMENT', {'font-family':MONO, 'font-size':'var(--type-micro)', 'letter-spacing':2.5, fill:'rgba(25,25,23,.45)'});

stageFit();
</script>
