<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-a7" data-page-role="prove" data-theme="paper-ink" data-layout="paper-ink.evidence.logo-cloud" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-a7 · Logo 云墙</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: rgba(25,25,23,.45); }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: #191917;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.a7">
  <div class="doc tl">HENGJI DISPATCH — A7<br>INTEGRATED ECOSYSTEM</div>
  <div class="folio">A7 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">28 家伙伴系统已接入衡玑调度网络，生态规模开始形成。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. A7 — LOGO CLOUD WALL', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:480, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 统计性导语 ---------- */
txt(902, 246, '28', {'font-family':MONO, 'font-size':'var(--type-subheading)', 'letter-spacing':2, 'text-anchor':'end', fill:INK});
txt(924, 246, '家伙伴的仓储系统已接入衡玑调度网络', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', 'text-anchor':'start', fill:INK});
txt(960, 282, 'INTEGRATED PARTNERS · 2021 — 2026 · ALL MARKS FICTIONAL', {'font-family':MONO, 'font-size':'var(--type-micro)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK45});

/* ---------- 格阵：7 列 × 4 行，几何线稿标 + mono 假名 ---------- */
function poly(x, y, r, n, rot){
  var d = '';
  for (var i = 0; i < n; i++){
    var a = rot + i*Math.PI*2/n;
    d += (i ? ' L ' : 'M ') + (x + r*Math.cos(a)).toFixed(1) + ' ' + (y + r*Math.sin(a)).toFixed(1);
  }
  return d + ' Z';
}
function mark(k, x, y){
  var s = 16 + (k % 3) * 3;
  var st = {fill:'none', stroke:INK, 'stroke-width':1.1, opacity:.7};
  switch (k % 8) {
    case 0: /* 双环 + 核 */
      el('circle', Object.assign({cx:x, cy:y, r:s}, st));
      el('circle', Object.assign({cx:x, cy:y, r:s*.55, 'stroke-width':.7, opacity:.5}, st));
      el('circle', {cx:x, cy:y, r:2, fill:INK, opacity:.7});
      break;
    case 1: /* 六边形 + 竖杠 */
      el('path', Object.assign({d:poly(x, y, s, 6, -Math.PI/2)}, st));
      el('line', {x1:x, y1:y-s*.55, x2:x, y2:y+s*.55, stroke:INK, 'stroke-width':.8, opacity:.5});
      break;
    case 2: /* 三角 + 底刻线 */
      el('path', Object.assign({d:poly(x, y-2, s, 3, -Math.PI/2)}, st));
      el('line', {x1:x-s*.8, y1:y+s*.8, x2:x+s*.8, y2:y+s*.8, stroke:INK, 'stroke-width':.8, opacity:.5});
      break;
    case 3: /* 同心信号弧 + 点 */
      el('path', {d:'M '+(x-s)+' '+(y+s*.4)+' A '+s+' '+s+' 0 0 1 '+(x-s*.4)+' '+(y-s), fill:'none', stroke:INK, 'stroke-width':1.1, opacity:.7});
      el('path', {d:'M '+(x-s*.6)+' '+(y+s*.3)+' A '+(s*.6)+' '+(s*.6)+' 0 0 1 '+(x-s*.2)+' '+(y-s*.55), fill:'none', stroke:INK, 'stroke-width':.8, opacity:.5});
      el('circle', {cx:x+s*.45, cy:y+s*.45, r:2.2, fill:INK, opacity:.7});
      break;
    case 4: /* 菱形 + 内十字 */
      el('path', Object.assign({d:poly(x, y, s, 4, 0)}, st));
      el('line', {x1:x-s*.4, y1:y, x2:x+s*.4, y2:y, stroke:INK, 'stroke-width':.7, opacity:.5});
      el('line', {x1:x, y1:y-s*.4, x2:x, y2:y+s*.4, stroke:INK, 'stroke-width':.7, opacity:.5});
      break;
    case 5: /* 圆 + 斜杠 */
      el('circle', Object.assign({cx:x, cy:y, r:s}, st));
      el('line', {x1:x-s*.7, y1:y+s*.7, x2:x+s*.7, y2:y-s*.7, stroke:INK, 'stroke-width':.9, opacity:.6});
      break;
    case 6: /* 折峰 + 底线 */
      el('path', {d:'M '+(x-s)+' '+(y+s*.4)+' L '+(x-s*.35)+' '+(y-s*.5)+' L '+x+' '+(y+s*.05)+' L '+(x+s*.35)+' '+(y-s*.5)+' L '+(x+s)+' '+(y+s*.4), fill:'none', stroke:INK, 'stroke-width':1.1, opacity:.7});
      el('line', {x1:x-s*.7, y1:y+s*.75, x2:x+s*.7, y2:y+s*.75, stroke:INK, 'stroke-width':.7, opacity:.45});
      break;
    case 7: /* 穹顶 + 基线 */
      el('path', {d:'M '+(x-s)+' '+(y+s*.45)+' A '+s+' '+(s*.95)+' 0 0 1 '+(x+s)+' '+(y+s*.45), fill:'none', stroke:INK, 'stroke-width':1.1, opacity:.7});
      el('line', {x1:x-s-5, y1:y+s*.45, x2:x+s+5, y2:y+s*.45, stroke:INK, 'stroke-width':.8, opacity:.5});
      el('circle', {cx:x, cy:y-s*.15, r:1.8, fill:INK, opacity:.6});
      break;
  }
}
var names = ['NORDWERK','HELIOVAN','KAVO','TIDELOG','BRINNA','OSKARCO','FJORDSYS',
             'MERIDAX','KOLDE','VANTALOG','SUTRO','PINGO','ARCWELL','KELVA',
             'DOCKSIDE','HAVEL','QUANTRA','NORPEL','SIGRO','TESSLO','VARUNA',
             'OSTVEL','LINDMARK','BRAVIK','SOLDO','KIRVA','HALVO','MARNEX'];
names.forEach(function(nm, i){
  var col = i % 7, row = Math.floor(i / 7);
  var cx = 222.5 + col*245, cy = 365 + row*150;
  mark(i, cx, cy - 14);
  txt(cx, cy + 42, nm, {'font-family':MONO, 'font-size':'var(--type-micro)', 'letter-spacing':2, 'text-anchor':'middle', fill:'rgba(25,25,23,.55)'});
});

stageFit();
</script>
</body>
</html>
