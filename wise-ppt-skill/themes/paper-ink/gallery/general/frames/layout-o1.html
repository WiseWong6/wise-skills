<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-o1" data-page-role="explain" data-theme="paper-ink" data-layout="paper-ink.funnel.conversion" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-o1 · 漏斗（连续收敛）</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: rgba(25,25,23,.45); }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.o1">
  <div class="doc tl">PAPER-INK GALLERY — O1<br>FUNNEL CONVERGENCE</div>
  <div class="folio">O1 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">连续收尖的漏斗只讲一件事：数量级如何被一层层筛小。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK45 = 'rgba(25,25,23,.45)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens §1.5） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = '#C0392B';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. O1 — FUNNEL CONVERGENCE', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:560, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 连续漏斗：一个大倒三角，两侧边一路收为塔尖 ---------- */
var topY = 240, botY = 770;          /* 漏斗顶 / 塔尖（收为点） */
var cX = 660;                        /* 漏斗中轴 */
var topW = 720;                      /* 顶宽 */
function wAt(y) { return topW * (botY - y) / (botY - topY); }

/* 外轮廓：顶线 + 两条连续侧边 */
el('line', {x1:cX-topW/2, y1:topY, x2:cX+topW/2, y2:topY, stroke:INK80, 'stroke-width':1.4});
el('line', {x1:cX-topW/2, y1:topY, x2:cX, y2:botY, stroke:INK80, 'stroke-width':1.4});
el('line', {x1:cX+topW/2, y1:topY, x2:cX, y2:botY, stroke:INK80, 'stroke-width':1.4});

/* 两条横向分隔线切出三层 */
[440, 600].forEach(function(sy){
  var w = wAt(sy);
  el('line', {x1:cX-w/2, y1:sy, x2:cX+w/2, y2:sy, stroke:INK, 'stroke-width':.9, opacity:.55});
});

/* 顶部刻度尺 */
for (var i = 0; i <= 20; i++) {
  var tx = cX - topW/2 + i * (topW/20);
  el('line', {x1:tx, y1:topY, x2:tx, y2:topY - (i%5===0?12:6), stroke:INK, 'stroke-width':.6, opacity:.35});
}

var layers = [
  {y0:topY, y1:440, n:'≈ 1,200万', tag:'IMPRESSION', t:'曝光', en:'REACH',
   notes:['信息流广告','KOL 投放','搜索竞价','品牌开屏']},
  {y0:440,  y1:600, n:'≈ 86万',    tag:'CLICK',      t:'点击', en:'TRAFFIC',
   notes:['素材吸睛','定向精准','落地页承接','兴趣激发']},
  {y0:600,  y1:740, n:'≈ 9.6万',   tag:'ORDER',      t:'成交', en:'CONVERT',
   notes:['加购决策','优惠券促单','支付完成','复购引导']}
];

layers.forEach(function(L, i){
  var last = (i === layers.length - 1);   /* 最底层=成交=漏斗出口=业务结果 */
  var inkLayer = (ACCENT && last) ? RED : INK;
  var midY = (L.y0 + L.y1)/2;
  /* 层名 */
  txt(cX, midY-4, L.t, {'font-family':SANS, 'font-weight':300, 'font-size': i===2?24:30, 'text-anchor':'middle', fill:inkLayer});
  txt(cX, midY+26, L.en, {'font-family':MONO, 'font-size':14, 'letter-spacing':2, 'text-anchor':'middle', fill:(ACCENT && last ? 'rgba(192,57,43,.65)' : INK45)});
  /* 左侧：虚线引出 mono 数量 */
  var lw = wAt(midY);
  el('line', {x1:cX-lw/2-16, y1:midY, x2:cX-lw/2-70, y2:midY, stroke:inkLayer, 'stroke-width':.6, 'stroke-dasharray':'3 4', opacity:.5});
  txt(cX-lw/2-86, midY-4, L.n, {'font-family':MONO, 'font-size':26, 'text-anchor':'end', fill:inkLayer});
  txt(cX-lw/2-86, midY+22, L.tag, {'font-family':MONO, 'font-size':12, 'letter-spacing':2, 'text-anchor':'end', fill:(ACCENT && last ? 'rgba(192,57,43,.65)' : INK45)});
  /* 右侧：实线引出字段注记 */
  el('line', {x1:cX+lw/2+16, y1:midY, x2:cX+lw/2+70, y2:midY, stroke:INK, 'stroke-width':.6, opacity:.5});
  L.notes.forEach(function(n, j){
    txt(cX+lw/2+86, midY - 45 + j*30, n, {'font-family':SANS, 'font-weight':300, 'font-size':18, fill:'rgba(25,25,23,.7)'});
  });
});

/* 底部收口：塔尖墨点 → 双线小框（出口） */
el('line', {x1:cX, y1:botY, x2:cX, y2:botY+30, stroke:INK, 'stroke-width':1.2});
el('circle', {cx:cX, cy:botY+38, r:3.5, fill:INK});
el('rect', {x:cX-70, y:botY+46, width:140, height:44, fill:'none', stroke:INK80, 'stroke-width':1.2});
el('rect', {x:cX-66, y:botY+50, width:132, height:36, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
txt(cX, botY+74, 'TO REVENUE', {'font-family':MONO, 'font-size':17, 'letter-spacing':2, 'text-anchor':'middle', fill:INK});

/* ---------- 右侧规格单：成交订单清单（标本面板） ---------- */
(function(){
  var x = 1380, y = 330, w = 400;
  el('rect', {x:x, y:y, width:w, height:330, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:x+5, y:y+5, width:w-10, height:320, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
  txt(x+26, y+42, 'TOP ORDERS', {'font-family':MONO, 'font-size':16, 'letter-spacing':2, fill:INK});
  el('line', {x1:x+26, y1:y+56, x2:x+90, y2:y+56, stroke:INK, 'stroke-width':1});
  txt(x+26, y+88, '大促当日 · 成交 9.6 万单', {'font-family':SANS, 'font-weight':300, 'font-size':17, fill:'rgba(25,25,23,.55)'});
  var rows = [
    ['ORD #08172', '直播间', '¥ 2,899'],
    ['ORD #08168', '信息流', '¥ 1,580'],
    ['ORD #08155', '搜索',   '¥ 3,200'],
    ['ORD #08141', '开屏',   '¥   799'],
    ['ORD #08127', 'KOL',    '¥ 4,599']
  ];
  rows.forEach(function(r, i){
    var ry = y + 128 + i * 38;
    txt(x+26, ry, r[0], {'font-family':MONO, 'font-size':16, fill:INK});
    txt(x+w-120, ry, r[1], {'font-family':MONO, 'font-size':16, 'text-anchor':'end', fill:'rgba(25,25,23,.7)'});
    txt(x+w-26, ry, r[2], {'font-family':MONO, 'font-size':12, 'text-anchor':'end', fill:INK45});
    if (i < rows.length-1) el('line', {x1:x+26, y1:ry+14, x2:x+w-26, y2:ry+14, stroke:INK, 'stroke-width':.5, 'stroke-dasharray':'2 5', opacity:.25});
  });
})();

stageFit();
</script>
</body>
</html>
