<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-g1" data-page-role="explain" data-theme="paper-ink" data-layout="paper-ink.radial.three-way" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-g1 · 三向放射（爆炸图）</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: rgba(25,25,23,.45); }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.g1">
  <div class="doc tl">HENGJI DISPATCH — G1<br>DISPATCH NODE I/O</div>
  <div class="folio">G1 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">调度器把订单、车况、库位和充电状态转成派车、路径、避让与补能指令。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. G1 — EXPLODED TRI-RADIAL', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:560, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 中央主节点（双线框），中心 (960,520) ---------- */
var NW = 380, NH = 116, NX = 960 - NW/2, NY = 520 - NH/2;
el('rect', {x:NX, y:NY, width:NW, height:NH, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.4});
el('rect', {x:NX+5, y:NY+5, width:NW-10, height:NH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4});
txt(960, NY+46, 'DISPATCHER', {'font-family':MONO, 'font-size':24, 'letter-spacing':3, 'text-anchor':'middle', fill:INK});
txt(960, NY+84, '任务调度器', {'font-family':SANS, 'font-weight':300, 'font-size':23, 'letter-spacing':4, 'text-anchor':'middle', fill:INK});

/* ---------- 分支线：左输入 / 右输出 / 下参数 ---------- */
var LTX = 560, RTX = 1360;
el('line', {x1:NX, y1:520, x2:LTX, y2:520, stroke:INK, 'stroke-width':.8, opacity:.5});
el('line', {x1:NX+NW, y1:520, x2:RTX, y2:520, stroke:INK, 'stroke-width':.8, opacity:.5});
el('line', {x1:960, y1:NY+NH, x2:960, y2:700, stroke:INK, 'stroke-width':.8, opacity:.5});
[[LTX,520],[RTX,520],[960,700]].forEach(function(p){ el('circle', {cx:p[0], cy:p[1], r:2.4, fill:INK, opacity:.7}); });
txt((NX+LTX)/2, 506, 'IN',  {'font-family':MONO, 'font-size':14, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
txt((NX+NW+RTX)/2, 506, 'OUT', {'font-family':MONO, 'font-size':14, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* 字段行：mono 上行 + 中文 300/16 下行 */
function field(x, y, en, cn, anchor) {
  txt(x, y, en, {'font-family':MONO, 'font-size':17, 'text-anchor':anchor, fill:INK});
  txt(x, y+26, cn, {'font-family':SANS, 'font-weight':300, 'font-size':16, 'text-anchor':anchor, fill:'rgba(25,25,23,.6)'});
}

/* ---------- 左支 · 输入（右对齐） ---------- */
var inRows = [
  ['orders · wave',  '订单波次与优先级'],
  ['fleet_state',    '机器人位置与电量'],
  ['slot_map',       '货位占用与库存'],
  ['charge_queue',   '充电桩排队状态']
];
txt(LTX, 268, '输 入', {'font-family':SANS, 'font-weight':300, 'font-size':26, 'text-anchor':'end', fill:INK});
txt(LTX, 296, 'INPUT', {'font-family':MONO, 'font-size':14, 'letter-spacing':2, 'text-anchor':'end', fill:INK45});
el('line', {x1:LTX, y1:320, x2:LTX, y2:800, stroke:INK, 'stroke-width':.8, opacity:.5});
inRows.forEach(function(r, j){
  var ry = 348 + j * 116;
  el('line', {x1:LTX, y1:ry, x2:LTX-18, y2:ry, stroke:INK, 'stroke-width':.8, opacity:.5});
  field(LTX-30, ry+6, r[0], r[1], 'end');
});

/* ---------- 右支 · 输出（左对齐） ---------- */
var outRows = [
  ['dispatch_cmd',   '派车指令下发'],
  ['route_plan',     '全局路径规划'],
  ['avoid_priority', '交叉避让优先级'],
  ['charge_plan',    '自动充电计划'],
  ['heartbeat',      '运行心跳回传'],
  ['exception',      '异常事件上报']
];
txt(RTX, 268, '输 出', {'font-family':SANS, 'font-weight':300, 'font-size':26, fill:INK});
txt(RTX, 296, 'OUTPUT', {'font-family':MONO, 'font-size':14, 'letter-spacing':2, fill:INK45});
el('line', {x1:RTX, y1:320, x2:RTX, y2:860, stroke:INK, 'stroke-width':.8, opacity:.5});
outRows.forEach(function(r, j){
  var ry = 348 + j * 100;
  el('line', {x1:RTX, y1:ry, x2:RTX+18, y2:ry, stroke:INK, 'stroke-width':.8, opacity:.5});
  field(RTX+30, ry+6, r[0], r[1], 'start');
});

/* ---------- 下支 · 参数（横轴均布） ---------- */
var paramRows = [
  ['safe_dist',    '安全距离'],
  ['max_fleet',    '最大并发'],
  ['congestion_w', '拥堵权重'],
  ['battery_min',  '电量阈值'],
  ['retry_ms',     '超时重派']
];
txt(984, 668, '参 数', {'font-family':SANS, 'font-weight':300, 'font-size':26, fill:INK});
txt(984, 696, 'PARAMS', {'font-family':MONO, 'font-size':14, 'letter-spacing':2, fill:INK45});
el('line', {x1:620, y1:700, x2:1300, y2:700, stroke:INK, 'stroke-width':.8, opacity:.5});
paramRows.forEach(function(r, j){
  var rx = 660 + j * 150;
  el('line', {x1:rx, y1:700, x2:rx, y2:716, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(rx, 744, r[0], {'font-family':MONO, 'font-size':17, 'text-anchor':'middle', fill:INK});
  txt(rx, 772, r[1], {'font-family':SANS, 'font-weight':300, 'font-size':16, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
});

stageFit();
</script>
</body>
</html>
