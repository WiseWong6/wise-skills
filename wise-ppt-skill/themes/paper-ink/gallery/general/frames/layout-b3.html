<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-b3" data-page-role="sequence" data-theme="paper-ink" data-layout="paper-ink.temporal.swimlane-roadmap" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-b3 · 多泳道路线图</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  /* B24 多泳道路线图 · 纸底 */
  .doc.tl, .folio { color: rgba(25,25,23,.45); }
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: #191917;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.b3">
  <div class="doc tl">HENGJI DISPATCH — B3<br>THREE-LANE ROADMAP</div>
  <div class="folio">B3 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch24" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="9" stroke="#191917" stroke-width=".7" opacity=".35"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">引擎、硬件与数据必须共用一张路线图，首仓交付才不会被单线进度拖住。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. B3 — MULTI-LANE ROADMAP', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:540, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 时间刻度尺（x340–1760，六个季度） ---------- */
var X0 = 340, X1 = 1760, QW = (X1 - X0) / 6;
var QLABELS = ['25Q3', '25Q4', '26Q1', '26Q2', '26Q3', '26Q4'];

/* 竖向虚线栅格（贯穿全图，先画沉底） */
for (var i = 0; i <= 6; i++) {
  var gx = X0 + i * QW;
  el('line', {x1:gx, y1:268, x2:gx, y2:820, stroke:INK, 'stroke-width':.6, opacity:.22, 'stroke-dasharray':'2 6'});
}

/* 尺脊：本页唯一强调线 */
el('line', {x1:X0, y1:250, x2:X1, y2:250, stroke:INK, 'stroke-width':2});
for (var i = 0; i <= 6; i++) {
  var tx = X0 + i * QW;
  el('line', {x1:tx, y1:250, x2:tx, y2:264, stroke:INK80, 'stroke-width':1});
  if (i < 6) {
    var mx = tx + QW / 2;
    el('line', {x1:mx, y1:250, x2:mx, y2:257, stroke:INK, 'stroke-width':.5, opacity:.5});
    txt(tx + QW / 2, 236, QLABELS[i], {'font-family':MONO, 'font-size':13, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
  }
}

/* ---------- 泳道分隔线 ---------- */
[455, 625].forEach(function(y){
  el('line', {x1:X0, y1:y, x2:X1, y2:y, stroke:INK, 'stroke-width':.6, opacity:.2});
});

/* ---------- 泳道标签列（x150–300） ---------- */
var LANES = [
  {no:'L1', en:'SCHEDULER', cn:'调度引擎', cy:360},
  {no:'L2', en:'FLEET',     cn:'车队硬件', cy:540},
  {no:'L3', en:'DATA',      cn:'数据平台', cy:720}
];
LANES.forEach(function(L){
  txt(150, L.cy-8, L.no + ' · ' + L.en, {'font-family':MONO, 'font-size':14, 'letter-spacing':2, fill:INK});
  txt(150, L.cy+22, L.cn, {'font-family':SANS, 'font-weight':300, 'font-size':18, fill:INK70});
  el('line', {x1:296, y1:L.cy, x2:328, y2:L.cy, stroke:INK, 'stroke-width':.8, opacity:.4});
});

/* ---------- span 条与里程碑 ---------- */
function span(x1, x2, cy, en, cn, filled) {
  el('rect', {x:x1, y:cy-18, width:x2-x1, height:36,
    fill: filled ? 'url(#hatch24)' : 'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:x1, y1:cy-28, x2:x1, y2:cy+28, stroke:INK, 'stroke-width':1, opacity:.7});
  el('line', {x1:x2, y1:cy-28, x2:x2, y2:cy+28, stroke:INK, 'stroke-width':1, opacity:.7});
  txt((x1+x2)/2, cy+5, en, {'font-family':MONO, 'font-size':13, 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
  txt(x1+2, cy-34, cn, {'font-family':SANS, 'font-weight':300, 'font-size':17, fill:INK70});
}
function milestone(x, cy, en, cn) {
  el('circle', {cx:x, cy:cy, r:8, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:x, cy:cy, r:3, fill:INK});
  el('circle', {cx:x, cy:cy, r:13, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
  txt(x, cy-30, en, {'font-family':MONO, 'font-size':11, 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
  txt(x, cy+46, cn, {'font-family':SANS, 'font-weight':300, 'font-size':15, 'text-anchor':'middle', fill:INK70});
}
function q(n) { return X0 + n * QW; }   /* 季度边界 x（0–6） */

/* L1 调度引擎 */
span(q(0),   q(2),   360, 'V1 · PATH ENGINE', '路径引擎 v1 上线', true);
span(q(2),   q(4),   360, 'V2 · FORECAST',    '预测调度 v2 灰度', false);
milestone(q(4.5), 360, 'STRESS 1K', '千车压测');

/* L2 车队硬件 */
span(q(1),   q(3),   540, 'GEN-2 ADAPT',      '二代机型适配', false);
span(q(3),   q(6),   540, 'MIXED-FLOW CERT',  '人机混行认证', true);
milestone(q(3), 540, 'FIRST SITE', '首仓交付');

/* L3 数据平台 */
span(q(0),   q(3),   720, 'PALLET DATA BASE', '托盘数据底座', true);
span(q(4),   q(6),   720, 'DIGITAL TWIN',     '跨仓数字孪生', false);
milestone(q(3.5), 720, 'AUTO AUDIT', '盘点自动化');

/* ---------- 底部刻度注 ---------- */
txt(960, 856, 'HENGJI ROBOTICS · FLEET ORCHESTRATION ROADMAP — ALL DATA FICTIONAL',
  {'font-family':MONO, 'font-size':11, 'letter-spacing':3, 'text-anchor':'middle', fill:INK45});

stageFit();
</script>
</body>
</html>
