<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-c6" data-page-role="prove" data-theme="paper-ink" data-layout="paper-ink.data.kpi-band" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-c6 · KPI 大数字横带</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: rgba(25,25,23,.45); }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: #191917;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.c6">
  <div class="doc tl">PAPER-INK GALLERY — C6<br>KPI BIG-NUMBER BAND</div>
  <div class="folio">C6 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">大数字横带让数字自己说话：数字即主角，单位降字级，格间只隔一根细线。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = getComputedStyle(document.documentElement).getPropertyValue('--accent-red').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. C6 — KPI BIG-NUMBER BAND', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:520, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 引子 ---------- */
txt(960, 316, '上线 18 个月 · 半年增长总账', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:INK70});
txt(960, 350, 'GROWTH REVIEW · 2026 H1', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK45});

/* ---------- 主角：通栏大数字横带（x120–1800，y380–640，4 格均分） ---------- */
var CW = 64.8;   /* mono 108px 单字符宽 */
var cells = [
  {num:'3,214', unit:'万',   uw:24, label:'日活用户',   en:'DAU'},
  {num:'42',    unit:'%',    uw:24, label:'次日留存率', en:'DAY-1 RETENTION'},
  {num:'6.8',   unit:'%',    uw:24, label:'付费转化率', en:'PAID CONVERSION'},
  {num:'9.97',  unit:'亿',   uw:24, label:'半年 GMV',   en:'H1 GROSS GMV'}
];
cells.forEach(function(C, i){
  var cx = 120 + 420*i + 210;
  /* 主角判定：99.97% 达成率是全页唯一焦点 → 数字/单位/中文标签 染色；No.编号与 EN 保持墨色 */
  var focus = ACCENT && i === 1;
  var fc = focus ? RED : null;
  /* 格编号（不跟随染色） */
  txt(cx, 408, 'No.0' + (i+1), {'font-family':MONO, 'font-size':'var(--type-micro)', 'letter-spacing':2, 'text-anchor':'middle', fill: INK45});
  /* 超大数字 + 降级单位 */
  var w = C.num.length * CW, gap = 16;
  var numEnd = cx + w/2 - (C.uw + gap)/2;
  txt(numEnd, 532, C.num, {'font-family':MONO, 'font-size':'var(--type-display)', 'text-anchor':'end', fill: fc || INK});
  txt(numEnd + gap, 532, C.unit, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', 'text-anchor':'start', fill: fc || INK70});
  /* 中文标签 + mono EN（EN 不跟随染色，保持档案感） */
  txt(cx, 600, C.label, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill: fc || INK80});
  txt(cx, 632, C.en, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill: INK45});
});
/* 格间 0.6px 竖线分隔（无外框） */
[540, 960, 1380].forEach(function(x){
  el('line', {x1:x, y1:402, x2:x, y2:636, stroke:INK, 'stroke-width':.6, opacity:.3});
});

/* ---------- 底部 mono 口号行（竖线分隔） ---------- */
var words = ['ATTRACT', 'ENGAGE', 'CONVERT', 'RETAIN'];
var wx = [762, 908, 1048, 1170];
var sx = [832, 984, 1112];
words.forEach(function(wd, i){
  txt(wx[i], 732, wd, {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK70});
});
sx.forEach(function(x){
  el('line', {x1:x, y1:718, x2:x, y2:736, stroke:INK, 'stroke-width':.8, opacity:.4});
});

stageFit();
</script>
</body>
</html>
