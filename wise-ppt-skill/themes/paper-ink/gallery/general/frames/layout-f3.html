<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-f3" data-page-role="explain" data-theme="paper-ink" data-layout="paper-ink.decomposition.column-list" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-f3 · 分栏清单柱</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.f3">
  <div class="doc tl">PAPER-INK GALLERY — F3<br>COLUMN LIST</div>
  <div class="folio">F3 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">分栏清单柱用于并列陈列无优先级的离散要点，每柱保持栏题、条目题、注三层级。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. F3 — COLUMN LIST', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:500, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 栏间分隔虚线 ---------- */
[640, 1220].forEach(function(x){
  el('line', {x1:x, y1:220, x2:x, y2:830, stroke:INK, 'stroke-width':.6, 'stroke-dasharray':'2 6', opacity:.25});
});

/* ---------- 栏题（无线框：中文 + mono EN + 短横） ---------- */
function colHead(x, zh, en) {
  txt(x, 240, zh, {'font-family':SANS, 'font-weight':300, 'font-size':26, fill:INK});
  txt(x, 268, en, {'font-family':MONO, 'font-size':13, 'letter-spacing':3, fill:INK45});
  el('line', {x1:x, y1:286, x2:x + 96, y2:286, stroke:INK, 'stroke-width':.8, opacity:.5});
  el('line', {x1:x, y1:292, x2:x + 500, y2:292, stroke:INK, 'stroke-width':.6, opacity:.22});
}

/* ---------- 条目三形态（柱间图元随语义微调） ---------- */
/* 柱 1：双圈圆点引导 */
function itemDot(x, y, title, note, field) {
  el('circle', {cx:x + 8, cy:y - 7, r:4.2, fill:'none', stroke:INK80, 'stroke-width':1});
  el('circle', {cx:x + 8, cy:y - 7, r:1.4, fill:INK});
  txt(x + 28, y, title, {'font-family':SANS, 'font-weight':300, 'font-size':21, fill:INK});
  txt(x + 500, y, field, {'font-family':MONO, 'font-size':13, 'letter-spacing':1, 'text-anchor':'end', fill:'rgba(25,25,23,.5)'});
  txt(x + 28, y + 30, note, {'font-family':SANS, 'font-weight':300, 'font-size':17, fill:'rgba(25,25,23,.55)'});
}
/* 柱 2：细线小框 + 框内微图形 */
function itemBox(x, y, title, note, field, glyph) {
  el('rect', {x:x, y:y - 24, width:30, height:30, fill:'none', stroke:INK80, 'stroke-width':1});
  if (glyph === 0) {        /* 十字 */
    el('line', {x1:x + 15, y1:y - 18, x2:x + 15, y2:y, stroke:INK, 'stroke-width':.8, opacity:.7});
    el('line', {x1:x + 6, y1:y - 9, x2:x + 24, y2:y - 9, stroke:INK, 'stroke-width':.8, opacity:.7});
  } else if (glyph === 1) { /* 小圆 */
    el('circle', {cx:x + 15, cy:y - 9, r:6, fill:'none', stroke:INK, 'stroke-width':.8, opacity:.7});
    el('circle', {cx:x + 15, cy:y - 9, r:1.4, fill:INK});
  } else if (glyph === 2) { /* 折线 */
    el('path', {d:'M ' + (x + 6) + ' ' + (y - 4) + ' L ' + (x + 12) + ' ' + (y - 14) + ' L ' + (x + 18) + ' ' + (y - 8) + ' L ' + (x + 24) + ' ' + (y - 16),
      fill:'none', stroke:INK, 'stroke-width':.8, opacity:.7});
  } else {                  /* 菱点 */
    el('path', {d:'M ' + (x + 15) + ' ' + (y - 17) + ' l 7 8 l -7 8 l -7 -8 Z', fill:'none', stroke:INK, 'stroke-width':.8, opacity:.7});
  }
  txt(x + 48, y, title, {'font-family':SANS, 'font-weight':300, 'font-size':21, fill:INK});
  txt(x + 500, y, field, {'font-family':MONO, 'font-size':13, 'letter-spacing':1, 'text-anchor':'end', fill:'rgba(25,25,23,.5)'});
  txt(x + 48, y + 30, note, {'font-family':SANS, 'font-weight':300, 'font-size':17, fill:'rgba(25,25,23,.55)'});
}
/* 柱 3：mono 编号 + 短刻度 */
function itemIdx(x, y, idx, title, note, field) {
  txt(x, y, idx, {'font-family':MONO, 'font-size':15, 'letter-spacing':1, fill:INK80});
  el('line', {x1:x, y1:y + 8, x2:x + 34, y2:y + 8, stroke:INK80, 'stroke-width':.8, opacity:.5});
  txt(x + 64, y, title, {'font-family':SANS, 'font-weight':300, 'font-size':21, fill:INK});
  txt(x + 500, y, field, {'font-family':MONO, 'font-size':13, 'letter-spacing':1, 'text-anchor':'end', fill:'rgba(25,25,23,.5)'});
  txt(x + 64, y + 30, note, {'font-family':SANS, 'font-weight':300, 'font-size':17, fill:'rgba(25,25,23,.55)'});
}

/* ============ 三柱（衡玑调度平台功能清单 ） ============ */
var Y0 = 350, GAP = 128;

/* 柱 1 · 调度核心 */
colHead(120, '调度核心', 'SCHEDULING CORE');
itemDot(120, Y0 + 0 * GAP, '动态派单引擎', '订单波次到达后秒级重派，空闲车就近接单', 'RE-DISPATCH');
itemDot(120, Y0 + 1 * GAP, '任务优先级队列', '紧急插单自动上浮，普通单按库位聚类', 'Q-LEN 128');
itemDot(120, Y0 + 2 * GAP, '充电桩联动', '低电量车自动排队回充，不占用高峰运力', 'CHARGE-LINK');
itemDot(120, Y0 + 3 * GAP, '潮汐任务池', '大促期间按小时预测单量，预热备用车队', 'TIDE POOL');

/* 柱 2 · 地图与定位 */
colHead(700, '地图定位', 'MAP & POSITION');
itemBox(700, Y0 + 0 * GAP, '反光板三角定位', '通道尽头布设反光板阵列，全仓无定位盲区', '±8 MM', 0);
itemBox(700, Y0 + 1 * GAP, '动态禁区图层', '临时堆货区一键圈定，路径规划实时绕行', 'GEOFENCE V4', 1);
itemBox(700, Y0 + 2 * GAP, '多机共享地图', '单车扫图全队增量合并，新车上场即用', 'SLAM SHARE', 2);
itemBox(700, Y0 + 3 * GAP, '月台自动对位', '车厢停靠偏差自动补偿，对接误差厘米级', 'DOCK ALIGN', 3);

/* 柱 3 · 运维与告警 */
colHead(1280, '运维告警', 'OPS & ALERT');
itemIdx(1280, Y0 + 0 * GAP, 'C1', '车队健康分', '按电机温升、轮组磨损与误停率综合评分', 'FHS 92/100');
itemIdx(1280, Y0 + 1 * GAP, 'C2', '预测性维保', '故障特征提前三天推送，备件先行调拨', 'T-72 H');
itemIdx(1280, Y0 + 2 * GAP, 'C3', '异常轨迹回放', '任意误停事件可回放前后三十秒全场轨迹', 'TRACE 30S');
itemIdx(1280, Y0 + 3 * GAP, 'C4', '分级告警路由', '三级告警按值班表路由，重大异常电话直拨', 'L1 – L3');

stageFit();
</script>
</body>
</html>
