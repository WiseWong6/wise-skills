<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-b1" data-page-role="sequence" data-theme="paper-ink" data-layout="paper-ink.temporal.timeline" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-b1 · 水平时间轴</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.b1">
  <div class="doc tl">行业演进 — 能力跃迁<br>关键节点</div>
  <div class="folio">B1 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">从单点数字化到平台协同，关键跃迁发生在系统开始共享数据之后。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens §1.5） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = getComputedStyle(document.documentElement).getPropertyValue('--accent-red').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. B1 — HORIZONTAL TIMELINE', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, fill:'rgba(25,25,23,.45)'});
el('line', {x1:200, y1:192, x2:560, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 主轴 + 刻度齿 ---------- */
var AXIS = 560;
el('line', {x1:200, y1:AXIS, x2:1720, y2:AXIS, stroke:INK80, 'stroke-width':1.2});
for (var tx = 200, i = 0; tx <= 1720; tx += 38, i++) {
  var major = (i % 5 === 0);
  el('line', {x1:tx, y1:AXIS, x2:tx, y2:AXIS + (major?12:7), stroke:INK, 'stroke-width': major?1:.5, opacity: major?.4:.25});
}

/* ---------- 节点：衡玑科技「衡枢」调度平台演进 ---------- */
var nodes = [
  {x: 280, y: 2019, name:'V0.1 SEED',   org:'内测立项',        note:'核心功能原型验证',        hot:false},
  {x: 548, y: 2020, name:'V1.0 LAUNCH', org:'正式上线',        note:'',                        hot:false},
  {x: 816, y: 2021, name:'V2.0 GROW',   org:'增长引擎',        note:'',                        hot:false},
  {x:1084, y: 2022, name:'V3.0 SCALE',  org:'商业化',          note:'',                        hot:false},
  {x:1352, y: 2023, name:'V4.0 AI',     org:'智能重构',        note:'AI 驱动 · 月活破千万',     hot:true},
  {x:1620, y: 2025, name:'V5.0 ALL',    org:'全平台',          note:'多端协同 · 开放生态',      hot:false}
];

nodes.forEach(function(n){
  if (n.hot) {
    el('circle', {cx:n.x, cy:AXIS, r:5, fill:(n.hot && ACCENT) ? RED : INK});
    el('circle', {cx:n.x, cy:AXIS, r:16, fill:'none', stroke:(n.hot && ACCENT) ? RED : INK, 'stroke-width':1.4});
    el('circle', {cx:n.x, cy:AXIS, r:20, fill:'none', stroke:(n.hot && ACCENT) ? RED : INK, 'stroke-width':.6, opacity:.4});
  } else {
    el('circle', {cx:n.x, cy:AXIS, r:9, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.2});
    el('circle', {cx:n.x, cy:AXIS, r:3, fill:INK});
  }
  /* 上方：年份 / 名称 / 机构三段 + 短引线 */
  txt(n.x, AXIS-104, String(n.y), {'font-family':MONO, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:(n.hot && ACCENT) ? RED : INK});
  txt(n.x, AXIS-66, n.name, {'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':1, 'text-anchor':'middle', fill:(n.hot && ACCENT) ? RED : INK80});
  txt(n.x, AXIS-42, n.org, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:(n.hot && ACCENT) ? 'var(--accent-red-85)' : 'rgba(25,25,23,.45)'});
  el('line', {x1:n.x, y1:AXIS-28, x2:n.x, y2:AXIS-12, stroke:INK, 'stroke-width':.6, opacity:.4});
  /* 下方注释 */
  if (n.note) {
    txt(n.x, AXIS+52, n.note, {'font-family':SANS, 'font-weight': n.hot?400:300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:(n.hot && ACCENT) ? RED : (n.hot?INK:'rgba(25,25,23,.6)')});
    if (n.hot) el('line', {x1:n.x-120, y1:AXIS+66, x2:n.x+120, y2:AXIS+66, stroke:(n.hot && ACCENT) ? RED : INK, 'stroke-width':1.2, opacity:.8});
  }
});

/* 高亮叙事：手绘弧线标记 */
el('path', {d:'M 1276 646 Q 1352 700 1428 646', fill:'none', stroke:INK, 'stroke-width':.8, opacity:.35});
el('path', {d:'M 1284 654 Q 1352 702 1420 654', fill:'none', stroke:INK, 'stroke-width':.6, opacity:.2});

stageFit();
</script>
</body>
</html>
