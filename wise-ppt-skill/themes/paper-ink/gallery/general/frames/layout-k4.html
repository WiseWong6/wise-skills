<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-k4" data-page-role="synthesize" data-theme="paper-ink" data-layout="paper-ink.matrix.scenario-row-band" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-k4 · 三栏行带矩阵</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.k4">
  <div class="doc tl">PAPER-INK GALLERY — K4<br>THREE-WIDE CAMPAIGN MATRIX</div>
  <div class="folio">K4 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#191917" stroke-width="0.7" opacity="0.35"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">三役并列、现状/解法/落地三行带贯穿——矩阵页同时容纳叙事与细节。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. K4 — THREE-WIDE ROW-BAND MATRIX', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:560, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 三栏骨架 ---------- */
var COLS = [
  {x:150,  code:'SCENE 01', cn:'会员运营'},
  {x:690,  code:'SCENE 02', cn:'门店补货'},
  {x:1230, code:'SCENE 03', cn:'售后客服'}
];
var CW = 540;

/* 栏头横幅：hatch 左耳 + 中文栏题 + mono 码 */
COLS.forEach(function(c){
  el('rect', {x:c.x, y:226, width:CW, height:42, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:c.x, y:226, width:10, height:42, fill:'url(#hatch)', stroke:INK80, 'stroke-width':.9});
  txt(c.x + CW/2 + 5, 254, c.cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
  txt(c.x + CW - 16, 252, c.code, {'font-family':MONO, 'font-size':'var(--type-micro)', 'letter-spacing':2, 'text-anchor':'end', fill:INK45});
});

/* 行分隔 + 行题（中线纸色敲除） */
function rowRule(y, en, cn) {
  el('line', {x1:150, y1:y, x2:1770, y2:y, stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'3 6'});
  el('rect', {x:880, y:y-16, width:160, height:32, fill:'#DFE0D9', stroke:'none'});
  txt(960, y+6, en + ' · ' + cn, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK70});
}
rowRule(300, 'PAIN', '现状');
rowRule(430, 'FIX', '解法');
rowRule(648, 'SHIP', '落地');
el('line', {x1:150, y1:876, x2:1770, y2:876, stroke:INK, 'stroke-width':.8, opacity:.5});

/* ---------- 行一 · 现状（每栏两条 bullet） ---------- */
var PAIN = [
  ['会员沉睡率 62%，召回靠群发短信；', '单客月均打扰 4.8 次，疲劳取关渐增。'],
  ['补货靠店长经验，爆品缺货周周复发；', '库存周转 58 天，资金占用高。'],
  ['售后口径不一，客诉升级三跳起步；', '满意度徘徊 78%，根因留不下。']
];
COLS.forEach(function(c, i){
  PAIN[i].forEach(function(line, k){
    var y = 352 + k*40;
    el('rect', {x:c.x+40, y:y-11, width:5, height:5, fill:INK, opacity:.55});
    txt(c.x+58, y, line, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
  });
});

/* ---------- 行二 · 解法（每栏竖向三步链，图元异形） ---------- */
function mini(x, y, kind) {
  if (kind === 'chat') {
    el('path', {d:'M '+(x-14)+' '+(y-10)+' h 28 v 16 h -18 l -6 6 v -6 h -4 z', fill:'none', stroke:INK80, 'stroke-width':1.1});
    el('line', {x1:x-8, y1:y-4, x2:x+8, y2:y-4, stroke:INK, 'stroke-width':.8, opacity:.55});
    el('line', {x1:x-8, y1:y+1, x2:x+4, y2:y+1, stroke:INK, 'stroke-width':.8, opacity:.55});
  } else if (kind === 'tag') {
    el('path', {d:'M '+(x-12)+' '+(y-8)+' h 14 l 10 8 l -10 8 h -14 z', fill:'none', stroke:INK80, 'stroke-width':1.1});
    el('circle', {cx:x-6, cy:y, r:2, fill:'none', stroke:INK, 'stroke-width':.9});
  } else if (kind === 'send') {
    el('path', {d:'M '+(x-12)+' '+(y-8)+' L '+(x+12)+' '+(y)+' L '+(x-12)+' '+(y+8)+' L '+(x-6)+' '+(y)+' Z', fill:'none', stroke:INK80, 'stroke-width':1.1});
  } else if (kind === 'chart') {
    el('line', {x1:x-12, y1:y+10, x2:x+12, y2:y+10, stroke:INK80, 'stroke-width':1.1});
    el('polyline', {points:(x-10)+','+(y+6)+' '+(x-2)+','+(y-4)+' '+(x+4)+','+(y+2)+' '+(x+11)+','+(y-9), fill:'none', stroke:INK80, 'stroke-width':1.1});
    el('circle', {cx:x+11, cy:y-9, r:2, fill:INK});
  } else if (kind === 'gear') {
    el('circle', {cx:x, cy:y, r:10, fill:'none', stroke:INK80, 'stroke-width':1.1});
    el('circle', {cx:x, cy:y, r:3, fill:'none', stroke:INK, 'stroke-width':.9});
    [0, 90, 180, 270].forEach(function(a){
      var r = a*Math.PI/180;
      el('line', {x1:x+10*Math.cos(r), y1:y+10*Math.sin(r), x2:x+14*Math.cos(r), y2:y+14*Math.sin(r), stroke:INK, 'stroke-width':1, opacity:.6});
    });
  } else if (kind === 'route') {
    el('path', {d:'M '+(x-12)+' '+(y+8)+' L '+(x-2)+' '+(y+8)+' L '+(x+4)+' '+(y-6)+' L '+(x+12)+' '+(y-6), fill:'none', stroke:INK80, 'stroke-width':1.1});
    el('circle', {cx:x-12, cy:y+8, r:2.2, fill:INK});
    el('circle', {cx:x+12, cy:y-6, r:2.2, fill:'none', stroke:INK, 'stroke-width':1});
  } else if (kind === 'doc') {
    el('rect', {x:x-11, y:y-13, width:22, height:26, fill:'none', stroke:INK80, 'stroke-width':1.1});
    [y-6, y, y+6].forEach(function(yy){ el('line', {x1:x-6, y1:yy, x2:x+6, y2:yy, stroke:INK, 'stroke-width':.8, opacity:.55}); });
  } else if (kind === 'flag') {
    el('line', {x1:x-6, y1:y+12, x2:x-6, y2:y-12, stroke:INK80, 'stroke-width':1.1});
    el('path', {d:'M '+(x-6)+' '+(y-12)+' L '+(x+10)+' '+(y-8)+' L '+(x-6)+' '+(y-4)+' Z', fill:'url(#hatch)', stroke:INK80, 'stroke-width':.9});
  } else if (kind === 'book') {
    el('path', {d:'M '+(x-12)+' '+(y-9)+' Q '+(x-4)+' '+(y-13)+' '+(x)+' '+(y-9)+' Q '+(x+4)+' '+(y-13)+' '+(x+12)+' '+(y-9)+' V '+(y+9)+' Q '+(x+4)+' '+(y+5)+' '+(x)+' '+(y+9)+' Q '+(x-4)+' '+(y+5)+' '+(x-12)+' '+(y+9)+' Z', fill:'none', stroke:INK80, 'stroke-width':1.1});
    el('line', {x1:x, y1:y-9, x2:x, y2:y+9, stroke:INK, 'stroke-width':.8, opacity:.55});
  }
}
var FIX = [
  [['chat','沉睡唤醒'], ['tag','权益分层'], ['send','精准触达']],
  [['chart','销量预测'], ['gear','自动补货'], ['route','跨店调拨']],
  [['doc','口径入库'], ['flag','根因标注'], ['book','知识沉淀']]
];
COLS.forEach(function(c, i){
  var cx = c.x + 200;
  FIX[i].forEach(function(s, k){
    var y = 486 + k*60;
    mini(cx, y, s[0]);
    txt(cx+30, y-2, s[1], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK});
    txt(cx+30, y+18, 'STEP 0' + (k+1), {'font-family':MONO, 'font-size':'var(--type-micro)', 'letter-spacing':2, fill:INK45});
    if (k < 2) {
      el('path', {d:'M '+(cx-5)+' '+(y+20)+' L '+cx+' '+(y+26)+' L '+(cx+5)+' '+(y+20), fill:'none', stroke:INK, 'stroke-width':.8, opacity:.5, 'stroke-dasharray':'3 3'});
      el('path', {d:'M '+(cx-5)+' '+(y+26)+' L '+cx+' '+(y+32)+' L '+(cx+5)+' '+(y+26), fill:'none', stroke:INK, 'stroke-width':.8, opacity:.5, 'stroke-dasharray':'3 3'});
    }
  });
  /* 栏内右侧补一条注记，配平竖链 */
  txt(c.x + 380, 552, ['召回响应 < 30 min', '缺货率 -41%', '首解率 91%'][i], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', fill:INK45});
});

/* ---------- 行三 · 落地（三栏三种迷你图） ---------- */
/* 栏1：三节点横链（中节点 hatch） */
(function(){
  var x0 = 222, y = 740;
  [0, 1, 2].forEach(function(i){
    var x = x0 + i*150;
    el('rect', {x:x, y:y-20, width:96, height:40, fill: i===1 ? 'url(#hatch)' : 'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.1});
    if (i < 2) {
      el('line', {x1:x+96, y1:y, x2:x+150, y2:y, stroke:INK, 'stroke-width':1, opacity:.6});
      el('line', {x1:x+142, y1:y-4, x2:x+150, y2:y, stroke:INK, 'stroke-width':1, opacity:.6});
      el('line', {x1:x+142, y1:y+4, x2:x+150, y2:y, stroke:INK, 'stroke-width':1, opacity:.6});
    }
  });
  txt(x0+48, y+5, '试点', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:INK70});
  txt(x0+198, y+5, '铺开', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:INK});
  txt(x0+348, y+5, '常态', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:INK70});
  txt(x0+198, y+52, '已上线 300 家门店', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:INK45});
})();
/* 栏2：2×2 格 + 下行箭头 + 通栏条 */
(function(){
  var x0 = 860, y = 706;
  [[0,0,'预测'],[1,0,'补货'],[0,1,'调拨'],[1,1,'复盘']].forEach(function(p){
    el('rect', {x:x0+p[0]*110, y:y+p[1]*44, width:96, height:36, fill: (p[0]===1&&p[1]===0) ? 'url(#hatch)' : 'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1});
    txt(x0+p[0]*110+48, y+p[1]*44+23, p[2], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:INK70});
  });
  el('line', {x1:x0+103, y1:y+92, x2:x0+103, y2:y+108, stroke:INK, 'stroke-width':1, opacity:.6});
  el('line', {x1:x0+99, y1:y+104, x2:x0+103, y2:y+110, stroke:INK, 'stroke-width':1, opacity:.6});
  el('line', {x1:x0+107, y1:y+104, x2:x0+103, y2:y+110, stroke:INK, 'stroke-width':1, opacity:.6});
  el('rect', {x:x0-20, y:y+110, width:246, height:28, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.1});
  txt(x0+103, y+129, '全品类闭环', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:INK});
})();
/* 栏3：hub + 三辐条 */
(function(){
  var cx = 1500, y = 746;
  el('circle', {cx:cx, cy:y, r:22, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:cx, cy:y, r:15, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
  txt(cx, y+5, '7×24', {'font-family':MONO, 'font-size':'var(--type-micro)', 'text-anchor':'middle', fill:INK});
  [[-1, -1, '在线'], [1, -1, '工单'], [0, 1, '质检']].forEach(function(p){
    var nx = cx + p[0]*110, ny = y + p[1]*56;
    el('line', {x1:cx+p[0]*22, y1:cy2(p[1], y), x2:nx, y2:ny, stroke:INK, 'stroke-width':.8, opacity:.5, 'stroke-dasharray':'3 4'});
    el('circle', {cx:nx, cy:ny, r:16, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1});
    txt(nx, ny+4, p[2], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-micro)', 'text-anchor':'middle', fill:INK70});
  });
  function cy2(p1, y0) { return p1 === 1 ? y0+22 : y0-22; }
  txt(cx, y+92, '首解率 91% · 三跳归零', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:INK45});
})();

stageFit();
</script>
</body>
</html>
