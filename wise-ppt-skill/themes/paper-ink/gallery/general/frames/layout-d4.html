<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-d4" data-page-role="orient" data-theme="paper-ink" data-layout="paper-ink.scaffold.agenda" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-d4 · 目录导航页</title>
<!--
  纸墨线稿样张 · C5 目录导航页
  衡玑科技「仓储机器人调度平台」产品汇报
  版式纪律（layouts C5）：编号纵列 + 行间细线；当前章一处高亮，其余 45%；右侧一处小线稿；无 FIG
-->
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: rgba(25,25,23,.45); }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: #191917;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.d4">
  <div class="doc tl">PAPER-INK GALLERY — D4<br>TABLE OF CONTENTS</div>
  <div class="folio">D4 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">目录页用编号纵列立起全篇地图，当前章只留一处高亮。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ===== 页头：mono 小标 + 短横 ===== */
txt(300, 218, 'CONTENTS', {'font-family':MONO, 'font-size':15, 'letter-spacing':4, fill:'rgba(25,25,23,.45)'});
el('line', {x1:438, y1:212, x2:560, y2:212, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ===== 条目纵列：x300–1500，y250 起，行高 126 ===== */
var rows = [
  {no:'01', cn:'平台全景', en:'PLATFORM OVERVIEW',  note:'产品定位、系统边界与四类角色分工', cur:false},
  {no:'02', cn:'调度引擎', en:'DISPATCH ENGINE',   note:'任务拆解、路径规划与冲突仲裁',     cur:false},
  {no:'03', cn:'集群协同', en:'FLEET SYNC',        note:'多机协同、交通管制与充电调度',     cur:true},
  {no:'04', cn:'运行数据', en:'OPERATIONS DATA',   note:'首座试运行仓的九十天指标与复盘',   cur:false},
  {no:'05', cn:'落地路线', en:'ROLLOUT ROADMAP',   note:'三阶段复制计划与商务模式',         cur:false}
];
var X0 = 300, X1 = 1620, Y0 = 250, GAP = 126;

rows.forEach(function(r, i){
  var y = Y0 + i * GAP;                 /* 行基线带顶部 */
  var op = r.cur ? 1 : .45;             /* 非当前章整行淡墨 */

  /* 序号：当前章实心墨圆反白，其余空心单圈 */
  var cx = X0 + 34, cy = y + 42;
  if (r.cur) {
    el('circle', {cx:cx, cy:cy, r:26, fill:INK, opacity:op});
    el('circle', {cx:cx, cy:cy, r:31, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
    txt(cx, cy+9, r.no, {'font-family':MONO, 'font-size':26, 'text-anchor':'middle', fill:'#DFE0D9'});
    /* 高亮短横引出（全页唯一强调线） */
    el('line', {x1:cx+44, y1:cy, x2:cx+72, y2:cy, stroke:INK, 'stroke-width':1.8});
  } else {
    el('circle', {cx:cx, cy:cy, r:26, fill:'none', stroke:INK, 'stroke-width':1, opacity:op});
    txt(cx, cy+8, r.no, {'font-family':MONO, 'font-size':24, 'text-anchor':'middle', fill:INK, opacity:op});
  }

  /* 中文章题 + EN 副题 + 内容预告 */
  var tx = X0 + 116;
  txt(tx, cy+2, r.cn, {'font-family':SANS, 'font-weight':300, 'font-size':30, fill:INK, opacity:op});
  var cnw = r.cn.length * 32 + 26;
  txt(tx+cnw, cy-1, r.en, {'font-family':MONO, 'font-size':14, 'letter-spacing':3, fill:'rgba(25,25,23,.6)', opacity:op});
  txt(tx, cy+38, r.note, {'font-family':SANS, 'font-weight':300, 'font-size':17, fill:'rgba(25,25,23,.7)', opacity:op});

  /* 行右端 mono 页码锚 */
  txt(X1, cy+2, 'P.' + (i*4+3), {'font-family':MONO, 'font-size':13, 'letter-spacing':2, 'text-anchor':'end', fill:'rgba(25,25,23,.5)', opacity:op});

  /* 行间 0.6px 分隔线 */
  if (i < rows.length-1)
    el('line', {x1:X0, y1:y+GAP-26, x2:X1, y2:y+GAP-26, stroke:INK, 'stroke-width':.6, opacity:.22});
});
/* 首行上方分隔线 */
el('line', {x1:X0, y1:Y0-26, x2:X1, y2:Y0-26, stroke:INK, 'stroke-width':.6, opacity:.22});

stageFit();
</script>
</body>
</html>
