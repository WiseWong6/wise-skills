<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-k1" data-page-role="synthesize" data-theme="paper-ink" data-layout="paper-ink.matrix.stage-dimension" data-density="balanced" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-k1 · 链阵复合</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  canvas { position: absolute; inset: 0; z-index: 2; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: 33px; letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.k1">
  <div class="doc tl">PAPER-INK GALLERY — K1<br>STAGE CHAIN × DIMENSION MATRIX</div>
  <div class="folio">K1 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>
  <canvas id="cv" width="1920" height="1080"></canvas>

  <div class="caption">阶段链定节奏、维度阵装细节、收束条下结论——战略框架一页讲清。</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- FIG 图题 ---------- */
txt(200, 176, 'FIG. K1 — STAGE CHAIN × DIMENSION MATRIX', {'font-family':MONO, 'font-size':15, 'letter-spacing':3, fill:INK45});
el('line', {x1:200, y1:192, x2:560, y2:192, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ---------- 顶部：四站阶段链 ---------- */
var CXS = [477, 832, 1187, 1542];           /* 列心 = 站心，列区 x300–1720 */
var stages = [
  {no:'01', en:'INBOUND',  cn:'入库接单'},
  {no:'02', en:'DISPATCH', cn:'库内调度'},
  {no:'03', en:'EXECUTE',  cn:'拣选执行'},
  {no:'04', en:'AUDIT',    cn:'出库复核'}
];
stages.forEach(function(s, i){
  var cx = CXS[i];
  txt(cx, 240, s.en, {'font-family':MONO, 'font-size':11.5, 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
  el('circle', {cx:cx, cy:275, r:16, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:cx, cy:275, r:11.5, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
  txt(cx, 280, s.no, {'font-family':MONO, 'font-size':13, 'text-anchor':'middle', fill:INK});
  el('line', {x1:cx-24, y1:302, x2:cx+24, y2:302, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(cx, 332, s.cn, {'font-family':SANS, 'font-weight':300, 'font-size':22, 'text-anchor':'middle', fill:INK});
  /* 站心 → 矩阵列的锚定虚线（构造线不擦除） */
  el('line', {x1:cx, y1:344, x2:cx, y2:376, stroke:INK, 'stroke-width':.5, opacity:.25, 'stroke-dasharray':'2 5'});
});
/* 站间细线开放箭头 */
for (var i = 0; i < 3; i++) {
  var x1 = CXS[i]+38, x2 = CXS[i+1]-38;
  el('line', {x1:x1, y1:275, x2:x2, y2:275, stroke:INK, 'stroke-width':1.1, opacity:.55});
  el('line', {x1:x2-9, y1:269, x2:x2, y2:275, stroke:INK, 'stroke-width':1.1, opacity:.55});
  el('line', {x1:x2-9, y1:281, x2:x2, y2:275, stroke:INK, 'stroke-width':1.1, opacity:.55});
}

/* ---------- 中部：维度矩阵（3 维度 × 4 阶段） ---------- */
var MT = 380, ROWH = 137, MB = MT + ROWH*3;  /* y380–791 */
var COLS = [300, 655, 1010, 1365, 1720];
/* 横分隔线（贯通） */
[MT, MT+ROWH, MT+ROWH*2, MB].forEach(function(y, i){
  el('line', {x1:150, y1:y, x2:1720, y2:y, stroke:INK,
    'stroke-width': (i===0||i===3) ? .8 : .6, opacity: (i===0||i===3) ? .45 : .3});
});
/* 维度栏竖分隔 */
el('line', {x1:285, y1:MT, x2:285, y2:MB, stroke:INK, 'stroke-width':.6, opacity:.3});
/* 列分隔（虚线构造线） */
[COLS[1], COLS[2], COLS[3]].forEach(function(x){
  el('line', {x1:x, y1:MT, x2:x, y2:MB, stroke:INK, 'stroke-width':.5, opacity:.22, 'stroke-dasharray':'3 5'});
});

var dims = [
  {en:'ACTION', cn:'关键动作', cells:[
    [['WAVE','波次合并'],['PRIO','优先级分级'],['SLOT','库位预占'],['DOCK','月台预约']],
    [['PATH','全局路径'],['ALLOC','任务分配'],['YIELD','路口避让'],['CHG','充电策略']],
    [['PICK','货到人拣选'],['CARRY','搬运交接'],['QUEUE','站点排队'],['SCAN','条码复核']],
    [['CHECK','重量复核'],['PACK','智能装箱'],['SORT','分拨集货'],['SHIP','发运交接']]
  ]},
  {en:'METRIC', cn:'核心指标', cells:[
    [['3.2 s','接单时延'],['99.2 %','面单识别率'],['420 /min','接单峰值'],['0','漏单']],
    [['2,400','并发机器人'],['18 s','改派响应'],['92 %','通道利用率'],['0','死锁事故']],
    [['1,150 /h','单站产能'],['99.95 %','拣选准确率'],['0.4 s','交接握手'],['6 h','单班续航']],
    [['99.98 %','出库准确率'],['8 min','集货周期'],['-41 %','履约时长'],['24 h','全天候运行']]
  ]},
  {en:'SYSTEM', cn:'系统触点', cells:[
    [['OMS','订单网关'],['WMS','库存总线'],['TMS','车辆接口'],['EDI','客户直连']],
    [['CORE','调度内核'],['MAP','地图服务'],['SIM','仿真沙盘'],['BUS','状态总线']],
    [['RCS','机器人控制'],['PTL','灯光拣选'],['AMR','作业车队'],['HMI','工作站']],
    [['WCS','设备控制'],['DWS','量方称重'],['SORTER','分拣机组'],['TMS','发运回写']]
  ]}
];

dims.forEach(function(d, r){
  var rt = MT + r*ROWH;
  /* 维度栏标签 */
  txt(165, rt+62, d.en, {'font-family':MONO, 'font-size':14, 'letter-spacing':2, fill:INK});
  txt(165, rt+90, d.cn, {'font-family':SANS, 'font-weight':300, 'font-size':18, fill:INK70});
  /* 各阶段列内 1 列 2 字段（原 2×2 太挤，改为单列留白） */
  d.cells.forEach(function(fields, c){
    var cl = COLS[c];
    fields.slice(0, 2).forEach(function(f, k){
      var fx = cl + 28;
      var fy = rt + 42 + k*58;
      txt(fx, fy, f[0], {'font-family':MONO, 'font-size':13.5, 'letter-spacing':1, fill:'rgba(25,25,23,.55)'});
      txt(fx, fy+24, f[1], {'font-family':SANS, 'font-weight':300, 'font-size':15, fill:INK80});
    });
  });
});

/* ---------- 底部：chevron 收束条 ---------- */
var CY = 806, CH = 42, CW = 355;
var concl = ['QUEUE AT T+0', 'GLOBAL OPTIMUM', 'LIGHTS-OUT PICK', 'ZERO-DEFECT SHIP'];
for (var i = 0; i < 4; i++) {
  var x = COLS[i];
  var d = (i === 0)
    ? 'M '+x+' '+CY+' L '+(x+CW-16)+' '+CY+' L '+(x+CW)+' '+(CY+CH/2)+' L '+(x+CW-16)+' '+(CY+CH)+' L '+x+' '+(CY+CH)+' Z'
    : 'M '+x+' '+CY+' L '+(x+CW-16)+' '+CY+' L '+(x+CW)+' '+(CY+CH/2)+' L '+(x+CW-16)+' '+(CY+CH)+' L '+x+' '+(CY+CH)+' L '+(x+16)+' '+(CY+CH/2)+' Z';
  el('path', {d:d, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.2});
  txt(x+CW/2+(i===0?8:16), CY+27, concl[i], {'font-family':MONO, 'font-size':12.5, 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
}

stageFit();
</script>
</body>
</html>
