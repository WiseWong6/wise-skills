<!DOCTYPE html>
<html lang="zh-CN" data-page-id="gallery-general-d1" data-page-role="hook" data-theme="paper-ink" data-layout="paper-ink.scaffold.cover" data-density="breathing" data-reuse-mode="copy">
<head>
<meta charset="UTF-8">
<title>layout-d1 · 封面</title>
<link rel="stylesheet" href="../../../assets/shared.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

  /* 左侧落版文字块 */
  .kicker {
    position: absolute; left: 300px; top: 330px;
    font-family: var(--mono); font-size: var(--type-meta);
    letter-spacing: .3em; color: var(--ink-45);
    z-index: 2;
  }
  .title {
    position: absolute; left: 294px; top: 372px;
    font-family: var(--serif); font-weight: 400;
    font-size: var(--type-display); letter-spacing: .06em;
    color: var(--ink); z-index: 2;
  }
  .title-bar {
    position: absolute; left: 302px; top: 528px;
    width: 72px; height: 0;
    border-top: 2px solid var(--ink);
    z-index: 2;
  }
  .subtitle {
    position: absolute; left: 300px; top: 564px;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-subheading); letter-spacing: .1em;
    color: var(--ink-70); z-index: 2;
  }
  /* 主角判定：封面标题"仓序"是全页焦点 → 标题整词 + 下划线 bar 一起染色，形成落版焦点；右侧仓库线稿（图形）保持墨黑，不上彩 */
  :root.accent .title { color: var(--accent-red); }
  :root.accent .title-bar { border-top-color: var(--accent-red); }

  /* 右下 mono 元数据块 */
  .meta {
    position: absolute; right: 200px; bottom: 120px;
    font-family: var(--mono); font-size: var(--type-meta);
    letter-spacing: .3em; line-height: 2.3;
    color: var(--ink-45); text-align: left;
    z-index: 2; white-space: pre;
  }
  .meta b { font-weight: 400; color: var(--ink-70); }
</style>
</head>
<body>
<div class="stage" data-block-id="gallery-primary" data-provider="svg" data-component="layout-specimen" data-content-ref="example.d1">
  <div class="doc tl">PAPER-INK GALLERY — D1<br>COVER</div>
  <div class="folio">D1 / 63 — BY WISEWONG</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="kicker">NEW PRODUCT LAUNCH — 2026 SPRING</div>
  <div class="title">新境</div>
  <div class="title-bar"></div>
  <div class="subtitle">智能内容创作平台 · 产品发布会</div>

  <div class="meta"><b>SPEAKER</b> — PRODUCT TEAM
<b>DATE</b> — 2026.03.20
<b>VERSION</b> — V5.0 AI
<b>KEYWORDS</b> — CONTENT / AI / COLLAB</div>
</div>

<script src="../../../assets/particles.js"></script>
<script>
/* accent 触发：立即读 URL 加 .accent 类，让 :root.accent .title 染色不依赖 stageFit() 末尾时序 */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var NS = 'http://www.w3.org/2000/svg';
var INK80 = 'rgba(25,25,23,.8)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime';

/* ===== 右侧极细线稿小图：产品界面俯视（导航 / 侧栏 / 内容卡 / AI 入口） ===== */
(function(){
  var X = 1330, Y = 316, W = 330, H = 216;

  // 界面边界：虚线容器
  el('rect', {x:X, y:Y, width:W, height:H, fill:'none',
    stroke:INK80, 'stroke-width':.7, opacity:.45, 'stroke-dasharray':'3 5'});
  // 四角十字套准
  [[X,Y],[X+W,Y],[X,Y+H],[X+W,Y+H]].forEach(function(c){
    el('line', {x1:c[0]-6, y1:c[1], x2:c[0]+6, y2:c[1], stroke:INK80, 'stroke-width':.6, opacity:.4});
    el('line', {x1:c[0], y1:c[1]-6, x2:c[0], y2:c[1]+6, stroke:INK80, 'stroke-width':.6, opacity:.4});
  });

  // 顶部导航栏
  el('rect', {x:X, y:Y, width:W, height:28, fill:'none', stroke:INK80, 'stroke-width':.9, opacity:.6});
  [0,1,2,3].forEach(function(i){
    el('line', {x1:X+30+i*40, y1:Y+10, x2:X+50+i*40, y2:Y+10, stroke:INK80, 'stroke-width':.8, opacity:.5});
  });
  el('circle', {cx:X+W-18, cy:Y+14, r:5, fill:'none', stroke:INK80, 'stroke-width':.8, opacity:.6});

  // 左侧导航栏
  el('line', {x1:X, y1:Y+28, x2:X, y2:Y+H, stroke:INK80, 'stroke-width':.9, opacity:.5});
  el('rect', {x:X, y:Y+28, width:48, height:H-28, fill:'none', stroke:INK80, 'stroke-width':.7, opacity:.35});
  [0,1,2,3,4].forEach(function(i){
    el('rect', {x:X+12, y:Y+44+i*34, width:24, height:16, fill:'none', stroke:INK80, 'stroke-width':.7, opacity:.5});
  });

  // 主内容区：3 个内容卡片（错落）
  var cx0 = X+64, cw = 118;
  el('rect', {x:cx0, y:Y+44, width:cw, height:72, fill:'none', stroke:INK80, 'stroke-width':1, opacity:.7});
  el('line', {x1:cx0+8, y1:Y+58, x2:cx0+60, y2:Y+58, stroke:INK80, 'stroke-width':.8, opacity:.5});
  el('line', {x1:cx0+8, y1:Y+70, x2:cx0+80, y2:Y+70, stroke:INK80, 'stroke-width':.5, opacity:.35});
  el('line', {x1:cx0+8, y1:Y+80, x2:cx0+70, y2:Y+80, stroke:INK80, 'stroke-width':.5, opacity:.35});

  el('rect', {x:cx0+cw+12, y:Y+44, width:W-64-cw-12, height:72, fill:'none', stroke:INK80, 'stroke-width':1, opacity:.7});
  el('line', {x1:cx0+cw+20, y1:Y+58, x2:cx0+cw+70, y2:Y+58, stroke:INK80, 'stroke-width':.8, opacity:.5});
  el('circle', {cx:cx0+cw+34, cy:Y+86, r:10, fill:'none', stroke:INK80, 'stroke-width':.8, opacity:.5});

  el('rect', {x:cx0, y:Y+128, width:W-64, height:60, fill:'none', stroke:INK80, 'stroke-width':1, opacity:.7});
  el('line', {x1:cx0+8, y1:Y+142, x2:cx0+100, y2:Y+142, stroke:INK80, 'stroke-width':.8, opacity:.5});
  el('line', {x1:cx0+8, y1:Y+154, x2:cx0+140, y2:Y+154, stroke:INK80, 'stroke-width':.5, opacity:.35});

  // AI 生成按钮（高亮：双圈 + 实心核，落点）
  var ax = X+W-44, ay = Y+H-26;
  el('circle', {cx:ax, cy:ay, r:10, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:ax, cy:ay, r:6.4, fill:'none', stroke:INK80, 'stroke-width':.6, opacity:.5});
  el('circle', {cx:ax, cy:ay, r:2.4, fill:'#191917'});
  el('line', {x1:ax-22, y1:ay, x2:ax-12, y2:ay, stroke:INK80, 'stroke-width':.7, opacity:.5});

  // 小图注
  txt(X+W/2, Y+H+64, 'UI PREVIEW — NAV · CARD · AI', {'font-family':MONO, 'font-size':'var(--type-micro)',
    'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.45)'});
})();

stageFit();
</script>
</body>
</html>
