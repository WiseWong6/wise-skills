<!doctype html>
<html lang="zh-CN" data-runtime="wise-ppt" data-document-mode="single-html" data-deck-title="网页 PPT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网页 PPT</title>
<link rel="stylesheet" href="assets/shared.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--paper-deep);color:var(--ink);font-family:var(--sans)}.slide{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden}.stage{position:relative;width:1920px;height:1080px}
#board{padding:48px 40px 80px;min-height:100vh}.board-head,.section-label,.board-grid{max-width:1560px;margin-inline:auto}.board-head h1{font-size:30px}.board-head p,.section-label,.board-title{font-family:var(--mono)}.board-head p{color:var(--ink-70)}.section-label{margin-top:34px;padding-bottom:10px;border-bottom:1px solid var(--ink-45);letter-spacing:.16em}.board-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:18px}.board-card{appearance:none;border:0;background:none;color:inherit;text-align:left;cursor:pointer;padding:0}.board-preview{position:relative;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--ink-45);background:var(--paper)}.board-clone{position:absolute!important;inset:0!important;transform:scale(var(--board-scale));transform-origin:top left;pointer-events:none}.board-title{margin-top:10px;font-size:14px}.board-summary{margin-top:5px;color:var(--ink-70);line-height:1.5}.board-card:hover .board-preview,.board-card.active .board-preview{border-color:var(--ink);outline:1px solid var(--ink)}
#deck{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);visibility:hidden;overflow:hidden}#deck-stage{width:1920px;height:1080px;overflow:hidden;transform-origin:center}#track{display:flex;width:max-content;height:1080px;transition:transform .25s ease}#pager,#board-toggle{position:fixed;right:28px;z-index:5;color:var(--paper);background:color-mix(in srgb,var(--ink) 72%,transparent);border:1px solid rgba(255,255,255,.32);font:13px var(--mono)}#pager{bottom:20px;padding:7px 11px;border-radius:999px}#board-toggle{bottom:58px;padding:8px 12px;border-radius:5px;cursor:pointer}body.mode-deck #board{display:none}body.mode-deck #deck{visibility:visible}body.mode-board #pager,body.mode-board #board-toggle{display:none}
@page{size:20in 11.25in;margin:0}html.print-mode,html.print-mode body{background:#fff}html.print-mode #board,html.print-mode #pager,html.print-mode #board-toggle{display:none!important}html.print-mode #deck{position:static;display:block;visibility:visible;background:#fff;overflow:visible}html.print-mode #deck-stage{width:1920px;height:auto;overflow:visible;transform:none!important}html.print-mode #track{display:block;width:1920px;height:auto;transform:none!important;transition:none!important}html.print-mode .slide{break-after:page;page-break-after:always}html.print-mode .slide:last-child{break-after:auto;page-break-after:auto}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}@media(max-width:900px){.board-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){#track{transition:none}}
</style>
<script src="assets/deck-runtime.js"></script>
</head>
<body class="mode-board">
<main id="board"><header class="board-head"><h1 id="deck-title"></h1><p id="deck-subtitle"></p></header><div id="board-sections"></div></main>
<section id="deck" aria-label="横向放映"><div id="deck-stage"><div id="track">
  <!-- 在这里插入通过契约校验的 section.slide fragments。 -->
</div></div><div id="pager"></div><button id="board-toggle" type="button" aria-label="返回画册">返回画册</button></section>
</body>
</html>
