<body>
  <main class="stage" id="body" data-balance="structural" data-balance-frame="0,140,1920,980">

    <div class="folio" data-balance-exclude="true">01 / 04 — WISE PPT</div>
    <svg class="scene" viewBox="0 0 1920 1080" role="img" aria-labelledby="why-title why-desc"
      data-block-id="wise-ppt.why-comparison" data-provider="svg" data-component="dual-panel" data-content-ref="wise-ppt.story.why">
      <title id="why-title">AI 默认排版与演示编排能力的差异</title>
      <desc id="why-desc">左侧展示默认 AI 容易出现的格子化、颜色泛滥、没有视觉重心和信息密度失衡；右侧展示演示需要的清晰判断、视觉重心、语义化颜色与阅读层级。</desc>
    </svg>
    <div class="caption" data-block-id="wise-ppt.why-takeaway" data-provider="typography" data-component="takeaway" data-content-ref="wise-ppt.story.why">缺的不是生成一张页面的能力，而是把内容编排成演示的能力。</div>
  </main>
  <script src="../../themes/paper-ink/assets/particles.js"></script>
  <script>
    (function () {
      const svg = document.querySelector('.scene'), NS = 'http://www.w3.org/2000/svg';
      const INK = '#191917', INK80 = 'rgba(25,25,23,.80)', INK70 = 'rgba(25,25,23,.70)', INK45 = 'rgba(25,25,23,.45)';
      const SANS = 'var(--sans)', MONO = 'var(--mono)', SERIF = 'var(--serif)';
      const el = (tag, attrs = {}, parent = svg) => { const n = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k,v]) => n.setAttribute(k,v)); parent.appendChild(n); return n; };
      const txt = (text, x, y, attrs = {}, parent = svg) => { const n = el('text', {x, y, fill:INK, 'font-family':SANS, ...attrs}, parent); n.textContent = text; return n; };
      const line = (x1,y1,x2,y2,attrs={},parent=svg) => el('line',{x1,y1,x2,y2,stroke:INK,'stroke-width':1.1,...attrs},parent);
      const panel = (x) => { el('rect',{x,y:270,width:610,height:530,fill:'rgba(255,255,255,.22)',stroke:INK80,'stroke-width':1.3}); el('rect',{x:x+5,y:275,width:600,height:520,fill:'none',stroke:INK,'stroke-width':.6,opacity:.32}); };

      txt('FIG. 01 — DEFAULT OUTPUT × PRESENTATION INTENT',200,176,{'font-family':MONO,'font-size':14,'letter-spacing':2.2,fill:INK45});
      line(200,194,560,194,{stroke:INK45,'stroke-width':.7});
      panel(205); panel(1105);

      el('rect',{x:360,y:248,width:300,height:44,fill:'#DFE0D9',stroke:INK,'stroke-width':1.2});
      txt('DEFAULT AI OUTPUT',510,277,{'font-family':MONO,'font-size':13,'letter-spacing':2,'text-anchor':'middle',fill:INK70});
      el('rect',{x:1260,y:248,width:300,height:44,fill:'#DFE0D9',stroke:INK,'stroke-width':1.2});
      txt('PRESENTATION INTENT',1410,277,{'font-family':MONO,'font-size':13,'letter-spacing':2,'text-anchor':'middle',fill:INK70});

      txt('能排版，不等于会演示',510,356,{'font-family':SERIF,'font-size':34,'font-weight':600,'text-anchor':'middle'});
      txt('先铺满，再试图解释',510,388,{'font-size':18,'font-weight':300,'text-anchor':'middle',fill:INK70});
      const grid = el('g');
      [0,1,2].forEach(row => [0,1].forEach(col => {
        const x = 316 + col * 188, y = 432 + row * 70;
        el('rect',{x,y,width:154,height:46,fill:'none',stroke:INK45,'stroke-width':1},grid);
        line(x+18,y+16,x+110,y+16,{stroke:INK45,'stroke-width':.8},grid);
        line(x+18,y+30,x+(col ? 78 : 104),y+30,{stroke:INK45,'stroke-width':.8},grid);
      }));
      const faults = [
        ['GRID FIRST','先铺格子'], ['COLOUR FIRST','颜色抢戏'], ['NO FOCUS','没有重心'], ['DENSITY DRIFT','疏密失衡']
      ];
      faults.forEach((f,i) => { const x = 268 + (i % 2) * 270, y = 676 + Math.floor(i / 2) * 48; el('circle',{cx:x,cy:y-5,r:2.6,fill:INK}); txt(f[0],x+15,y,{'font-family':MONO,'font-size':12,'letter-spacing':1.5,fill:INK70}); txt(f[1],x+128,y,{'font-size':16,'font-weight':300,fill:INK70}); });

      txt('演示先安排阅读顺序',1410,356,{'font-family':SERIF,'font-size':34,'font-weight':600,'text-anchor':'middle'});
      txt('再决定形式、密度与强调',1410,388,{'font-size':18,'font-weight':300,'text-anchor':'middle',fill:INK70});
      const focus = el('g');
      el('circle',{cx:1410,cy:510,r:76,fill:'none',stroke:INK80,'stroke-width':1.3},focus);
      el('circle',{cx:1410,cy:510,r:50,fill:'rgba(255,255,255,.22)',stroke:INK,'stroke-width':.7,opacity:.7},focus);
      el('circle',{cx:1410,cy:510,r:5,fill:INK},focus);
      txt('ONE',1410,504,{'font-family':MONO,'font-size':12,'letter-spacing':2,'text-anchor':'middle',fill:INK70},focus);
      txt('CLAIM',1410,522,{'font-family':MONO,'font-size':12,'letter-spacing':1.4,'text-anchor':'middle',fill:INK70},focus);
      [[1215,470,'01','先有判断'],[1560,470,'02','再定重心'],[1215,610,'03','控制密度'],[1560,610,'04','颜色有义']].forEach(p => {
        const [x,y,no,label] = p; line(x < 1410 ? x+102 : x-102,y, x < 1410 ? 1340 : 1480,510,{stroke:INK45,'stroke-width':.8,'stroke-dasharray':'3 5'}); el('circle',{cx:x,cy:y,r:19,fill:'#DFE0D9',stroke:INK,'stroke-width':1}); txt(no,x,y+5,{'font-family':MONO,'font-size':12,'text-anchor':'middle'}); txt(label,x,y+48,{'font-size':17,'font-weight':300,'text-anchor':'middle',fill:INK70});
      });
      txt('视觉服务内容，而不是替内容制造噪声。',1410,736,{'font-size':19,'font-weight':300,'text-anchor':'middle',fill:INK70});
    })();
    stageFit();
  </script>
