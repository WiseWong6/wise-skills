<!doctype html>
<html lang="zh-CN" data-page-id="wise-ppt-component-atlas" data-page-role="explain" data-theme="paper-ink" data-layout-source="gallery" data-layout="paper-ink.radial.annotated-hero" data-density="dense" data-reuse-mode="adapt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成熟表达沉淀为可复用单元</title>
  <link rel="stylesheet" href="../../themes/paper-ink/assets/shared.css">
  <style>.scene{position:absolute;inset:0;width:100%;height:100%}.caption{position:absolute;left:0;right:0;bottom:118px;z-index:5;text-align:center;font-family:var(--sans);font-size:30px;font-weight:300;letter-spacing:.04em}</style>
</head>
<body>
  <main class="stage" id="body" data-balance="structural" data-balance-frame="0,140,1920,980">
    <div class="doc tl" data-balance-exclude="true">WISE PPT SKILL — 05<br>REUSABLE EXPRESSION UNITS</div>
    <div class="folio" data-balance-exclude="true">05 / 06 — WISE PPT</div>
    <svg class="scene" viewBox="0 0 1920 1080" role="img" aria-label="成熟表达沉淀为可复用单元" aria-describedby="component-desc"
      data-block-id="wise-ppt.component-atlas" data-provider="ppt-component-atlas" data-component="evidence-annotation" data-content-ref="wise-ppt.story.component-atlas">
      <desc id="component-desc">左侧说明组件是按需调用的表达积木。右侧示意流程、同心圆、架构、统计卡片、数据图表和关系矩阵六种可复用单元。</desc>
    </svg>
    <div class="caption" data-block-id="wise-ppt.component-atlas-takeaway" data-provider="typography" data-component="takeaway" data-content-ref="wise-ppt.story.component-atlas">提供成熟的表达组件，并由页面内容决定是否调用。</div>
  </main>
  <script src="../../themes/paper-ink/assets/particles.js"></script>
  <script src="frame-input.js"></script>
  <script>
    (function(){
      const svg=document.querySelector('.scene'),NS='http://www.w3.org/2000/svg';
      const INK='#191917',INK80='rgba(25,25,23,.80)',INK70='rgba(25,25,23,.70)',INK45='rgba(25,25,23,.45)';
      const SANS='var(--sans)',MONO='var(--mono)',SERIF='var(--serif)';
      const el=(tag,attrs={},parent=svg)=>{const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));parent.appendChild(n);return n;};
      const txt=(text,x,y,attrs={},parent=svg)=>{const n=el('text',{x,y,fill:INK,'font-family':SANS,...attrs},parent);n.textContent=text;return n;};
      const line=(x1,y1,x2,y2,attrs={},parent=svg)=>el('line',{x1,y1,x2,y2,stroke:INK,'stroke-width':1.1,...attrs},parent);
      txt('FIG. 05 — OPTIONAL, REUSABLE EXPRESSION UNITS',200,176,{'font-family':MONO,'font-size':14,'letter-spacing':2.2,fill:INK45});line(200,194,560,194,{stroke:INK45,'stroke-width':.7});
      const cardTop=360,cardGap=14,cardHeight=140,cardBottom=cardTop+2*(cardHeight+cardGap)+cardHeight;
      line(690,270,690,cardBottom,{stroke:INK45,'stroke-width':.9});

      txt('组件不是设计替身',225,277,{'font-family':SANS,'font-size':36,'font-weight':300});
      txt('它是可复用的表达单元',225,319,{'font-family':SANS,'font-size':22,'font-weight':300,fill:INK70});
      const introTop=cardTop+13;
      txt('版式决定阅读结构；组件决定',225,introTop,{'font-size':18,'font-weight':300,fill:INK70});
      txt('一个内容插槽如何被准确画出来。',225,introTop+28,{'font-size':18,'font-weight':300,fill:INK70});
      const principle=(y,no,title,lines)=>{el('circle',{cx:246,cy:y-5,r:18,fill:'#DFE0D9',stroke:INK,'stroke-width':1});txt(no,246,y,{'font-family':MONO,'font-size':12,'text-anchor':'middle'});txt(title,282,y,{'font-family':SANS,'font-size':23,'font-weight':300});lines.forEach((t,i)=>txt(t,282,y+29+i*23,{'font-size':16,'font-weight':300,fill:INK70}));};
      const principleStart=477,principleLast=cardBottom-52,principleStep=(principleLast-principleStart)/2;
      [['01','沉淀成熟表达',['把数据、流程、结构等','反复出现的形式规范下来。']],['02','按内容按需调用',['组件可装进不同版式，','也可以完全不使用。']],['03','让生成更加稳定',['减少随机的视觉偏差，','保留内容与构图的自由。']]].forEach((item,i)=>principle(principleStart+i*principleStep,item[0],item[1],item[2]));

      txt('成熟表达沉淀为单元',748,277,{'font-family':SANS,'font-size':36,'font-weight':300});
      txt('按内容按需调用',748,319,{'font-family':SANS,'font-size':22,'font-weight':300,fill:INK70});
      const componentPreview=(kind,x,y)=>{
        const previewCenter=x+310,previewOffset={process:95.5,concentric:96,architecture:85,stats:87,chart:102,matrix:104};
        const px=previewCenter-previewOffset[kind],py=y+18;
        if(kind==='process'){
          ['需求','设计','开发','测试'].forEach((label,i)=>{const bx=px+i*51;el('rect',{x:bx,y:py+34,width:38,height:30,fill:i===1?'rgba(255,255,255,.22)':'none',stroke:INK,'stroke-width':.8});txt(label,bx+19,py+53,{'font-size':9,'text-anchor':'middle'});if(i<3){line(bx+39,py+49,bx+49,py+49,{stroke:INK,'stroke-width':.8});el('path',{d:`M ${bx+45} ${py+45} L ${bx+49} ${py+49} L ${bx+45} ${py+53}`,fill:'none',stroke:INK,'stroke-width':.8});}});
        }
        if(kind==='concentric'){
          [[58,'生态层'],[40,'服务层'],[23,'内核']].forEach((p,i)=>{el('circle',{cx:px+96,cy:py+51,r:p[0],fill:i===0?'rgba(255,255,255,.12)':'none',stroke:INK,'stroke-width':i===0?1:.8});});txt('内核',px+96,py+55,{'font-size':11,'text-anchor':'middle'});
        }
        if(kind==='architecture'){
          ['应用','资源','评测','追踪'].forEach((label,i)=>{const yy=py+8+i*24;el('rect',{x:px,y:yy,width:48,height:16,fill:'rgba(255,255,255,.22)',stroke:INK,'stroke-width':.7});txt(label,px+24,yy+12,{'font-size':8,'text-anchor':'middle'});[0,1,2].forEach(n=>el('rect',{x:px+56+n*40,y:yy,width:34,height:16,fill:'none',stroke:INK45,'stroke-width':.6}));});
        }
        if(kind==='stats'){
          [[0,'42','METRIC A'],[92,'7%','METRIC B']].forEach(p=>{const bx=px+p[0];el('rect',{x:bx,y:py+10,width:82,height:82,fill:'none',stroke:INK,'stroke-width':.8});txt(p[2],bx+10,py+31,{'font-family':MONO,'font-size':9,'letter-spacing':.6,fill:INK70});txt(p[1],bx+10,py+70,{'font-family':SANS,'font-size':28,'font-weight':300});});
        }
        if(kind==='chart'){
          [0,1,2].forEach(i=>{
            const bx=px+16+i*62;
            el('rect',{x:bx,y:py+20,width:48,height:70,fill:'none',stroke:INK45,'stroke-width':.8});
            [0,1,2].forEach(n=>line(bx+12+n*10,py+82,bx+12+n*10,py+82-(18+i*7+n*6),{stroke:INK,'stroke-width':1.3}));
          });
        }
        if(kind==='matrix'){
          const mx=px+104,my=py+58;
          line(mx,my-40,mx,my+40,{stroke:INK,'stroke-width':.9});line(mx-64,my,mx+64,my,{stroke:INK,'stroke-width':.9});
          [[-35,-24],[35,-24],[-35,24],[35,24]].forEach(p=>el('circle',{cx:mx+p[0],cy:my+p[1],r:4,fill:INK}));
        }
      };
      const componentCard=(x,y,num,title,kind)=>{el('rect',{x,y,width:440,height:cardHeight,fill:'rgba(255,255,255,.22)',stroke:INK80,'stroke-width':1.1});el('rect',{x:x+5,y:y+5,width:430,height:cardHeight-10,fill:'none',stroke:INK,'stroke-width':.55,opacity:.3});txt(num,x+21,y+29,{'font-family':MONO,'font-size':12,'letter-spacing':1.5,fill:INK45});txt(title,x+21,y+86,{'font-family':SANS,'font-size':24,'font-weight':300});line(x+184,y+20,x+184,y+120,{stroke:INK45,'stroke-width':.7});componentPreview(kind,x,y);};
      [['01','流程','process'],['02','同心圆','concentric'],['03','架构','architecture'],['04','统计卡片','stats'],['05','数据图表','chart'],['06','关系矩阵','matrix']].forEach((item,i)=>componentCard(i%2?1240:748,cardTop+Math.floor(i/2)*(cardHeight+cardGap),item[0],item[1],item[2]));
    })();stageFit();
  </script>
</body>
</html>
